<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>360 Panorama</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: #222;
    color: #fff;
    font-family: -apple-system, sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
  }
  #pano-container {
    position: fixed; inset: 0; background: #222;
  }
  #pano-canvas {
    display: block;
    width: 100%; height: 100%;
    touch-action: none;
  }
  #ui {
    position: fixed; inset: 0;
    pointer-events: none; z-index: 10;
  }
  #ui .btn {
    pointer-events: auto;
    position: absolute;
    top: 12px;
    width: 52px; height: 52px;
    border-radius: 50%;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.35);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 15px; font-weight: 600;
    -webkit-user-select: none; user-select: none;
  }
  #ui .btn:active { background: rgba(0,0,0,0.85); }
  #ui .btn.active {
    background: rgba(200,50,50,0.85);
    border-color: rgba(255,255,255,0.7);
  }
  #btn-gyro       { right: 12px; }
  #btn-vr         { right: 76px; font-size: 13px; }
  #btn-fullscreen { right: 140px; font-size: 22px; }
  #status {
    position: fixed; bottom: 10px; left: 12px;
    font-size: 12px; color: rgba(255,255,255,0.65);
    pointer-events: none; z-index: 20;
    text-shadow: 0 1px 2px black;
  }
  #error {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(200,30,30,0.95);
    color: white;
    padding: 16px 20px;
    border-radius: 8px;
    font-size: 14px;
    max-width: 80vw;
    z-index: 100;
    display: none;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>

<div id="pano-container">
  <canvas id="pano-canvas"></canvas>
</div>

<div id="ui">
  <div class="btn" id="btn-fullscreen" title="Fullscreen">⛶</div>
  <div class="btn" id="btn-vr" title="VR side-by-side">VR</div>
  <div class="btn" id="btn-gyro" title="Gyroscope">◉</div>
</div>

<div id="status">loading…</div>
<div id="error"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';

  const statusEl = document.getElementById('status');
  const errorEl  = document.getElementById('error');

  function setStatus(m) { statusEl.textContent = m; }
  function showError(m) {
    errorEl.textContent = m;
    errorEl.style.display = 'block';
    console.error('[pano]', m);
  }

  window.addEventListener('error', function (e) {
    showError('Error: ' + (e.message || e));
  });

  if (typeof THREE === 'undefined') {
    showError('Three.js не загрузился. Нет интернета?');
    return;
  }

  try {

    /* ================================================================
       1. ТЕСТОВАЯ ПАНОРАМА  (equirectangular, 4 цветные полосы)
       ================================================================ */
    function generateTestPano() {
      const W = 2048, H = 1024;
      const cv = document.createElement('canvas');
      cv.width  = W;
      cv.height = H;
      const ctx = cv.getContext('2d');

      // u = 0   -> BACK   (зелёный)
      // u = 0.25-> LEFT   (жёлтый)
      // u = 0.5 -> FRONT  (оранжевый — виден сразу)
      // u = 0.75-> RIGHT  (синий)
      ctx.fillStyle = '#4CAF50'; ctx.fillRect(0,     0, W/4, H);
      ctx.fillStyle = '#FFEB3B'; ctx.fillRect(W/4,   0, W/4, H);
      ctx.fillStyle = '#FF5722'; ctx.fillRect(W/2,   0, W/4, H);
      ctx.fillStyle = '#2196F3'; ctx.fillRect(3*W/4, 0, W/4, H);

      // сетка
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.lineWidth = 2;
      for (let i = 0; i <= 8; i++) {
        ctx.beginPath(); ctx.moveTo(i * W / 8, 0); ctx.lineTo(i * W / 8, H); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i * H / 8); ctx.lineTo(W, i * H / 8); ctx.stroke();
      }
      // горизонт
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(0, H/2); ctx.lineTo(W, H/2); ctx.stroke();

      // подписи
      ctx.font = 'bold 140px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 8;
      ctx.strokeStyle = 'black';

      const labels = [
        { x: W/2,   y: H/2,       t: 'FRONT'  },
        { x: W/4,   y: H/2,       t: 'LEFT'   },
        { x: 3*W/4, y: H/2,       t: 'RIGHT'  },
        { x: 0,     y: H/2,       t: 'BACK'   },
        { x: W,     y: H/2,       t: 'BACK'   },
        { x: W/2,   y: H * 0.10,  t: 'TOP'    },
        { x: W/2,   y: H * 0.90,  t: 'BOTTOM' }
      ];
      labels.forEach(function (l) {
        ctx.strokeText(l.t, l.x, l.y);
        ctx.fillStyle = 'white';
        ctx.fillText(l.t, l.x, l.y);
      });

      return cv;
    }

    /* ================================================================
       2. Three.js
       ================================================================ */
    const canvas = document.getElementById('pano-canvas');
    const renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      antialias: false,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

    const scene  = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1100);
    camera.rotation.order = 'YXZ';

    const panoTex = new THREE.CanvasTexture(generateTestPano());
    panoTex.minFilter = THREE.LinearFilter;
    panoTex.magFilter = THREE.LinearFilter;
    panoTex.needsUpdate = true;

    const sphere = new THREE.Mesh(
      new THREE.SphereGeometry(500, 60, 40),
      new THREE.MeshBasicMaterial({ map: panoTex, side: THREE.BackSide })
    );
    // разворачиваем так, чтобы u=0.5 (FRONT) смотрел в -Z (куда смотрит камера)
    sphere.rotation.y = Math.PI / 2;
    scene.add(sphere);

    /* ================================================================
       3. Resize с защитой от нулевого размера
       ================================================================ */
    function resize() {
      const container = document.getElementById('pano-container');
      let w = container.clientWidth  || window.innerWidth;
      let h = container.clientHeight || window.innerHeight;
      if (w < 10) w = window.innerWidth;
      if (h < 10) h = window.innerHeight;
      if (w < 10 || h < 10) {
        setTimeout(resize, 100);
        return;
      }
      renderer.setSize(w, h, false);   // размер буфера; CSS размер = 100%
      const aspect = w / h;
      if (Math.abs(camera.aspect - aspect) > 0.0001 && !vrMode) {
        camera.aspect = aspect;
        camera.updateProjectionMatrix();
      }
      setStatus('ready · ' + w + '×' + h);
    }

    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', function () {
      setTimeout(resize, 250);
    });

    /* ================================================================
       4. Управление drag / touch
       ================================================================ */
    let lon = 0, lat = 0;
    let lonStart = 0, latStart = 0;
    let isDragging = false, startX = 0, startY = 0;

    function clampLat() {
      const MAX = Math.PI / 2 - 0.01;
      if (lat >  MAX) lat =  MAX;
      if (lat < -MAX) lat = -MAX;
    }

    canvas.addEventListener('touchstart', function (e) {
      if (e.touches.length === 1 && !gyroEnabled) {
        isDragging = true;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        lonStart = lon; latStart = lat;
      }
    }, { passive: true });

    canvas.addEventListener('touchmove', function (e) {
      if (!isDragging || e.touches.length !== 1 || gyroEnabled) return;
      const dx = e.touches[0].clientX - startX;
      const dy = e.touches[0].clientY - startY;
      lon = lonStart - dx * 0.005;
      lat = latStart - dy * 0.005;
      clampLat();
    }, { passive: true });

    canvas.addEventListener('touchend',     function () { isDragging = false; });
    canvas.addEventListener('touchcancel',  function () { isDragging = false; });

    canvas.addEventListener('mousedown', function (e) {
      if (gyroEnabled) return;
      isDragging = true;
      startX = e.clientX; startY = e.clientY;
      lonStart = lon; latStart = lat;
    });
    window.addEventListener('mousemove', function (e) {
      if (!isDragging || gyroEnabled) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      lon = lonStart - dx * 0.005;
      lat = latStart - dy * 0.005;
      clampLat();
    });
    window.addEventListener('mouseup', function () { isDragging = false; });

    /* ================================================================
       5. Гироскоп  (паттерн Three.js DeviceOrientationControls,
          детект как в AirPano через devicemotion)
       ================================================================ */
    let gyroEnabled = false;
    let gyroSeen    = false;                  // пришли ли валидные данные
    const devOrient = { alpha: 0, beta: 0, gamma: 0 };
    let screenOrient = window.orientation || 0;

    // AirPano-паттерн: devicemotion = датчики «живые»
    window.addEventListener('devicemotion', function () {
      if (!gyroSeen) {
        gyroSeen = true;
        setStatus('gyro available');
      }
    }, { passive: true });

    window.addEventListener('deviceorientation', function (e) {
      if (e.alpha == null && e.beta == null && e.gamma == null) return;
      devOrient.alpha = e.alpha || 0;
      devOrient.beta  = e.beta  || 0;
      devOrient.gamma = e.gamma || 0;
    });

    window.addEventListener('orientationchange', function () {
      screenOrient = window.orientation || 0;
    });

    const DEG2RAD = Math.PI / 180;
    const zee = new THREE.Vector3(0, 0, 1);
    const _euler = new THREE.Euler();
    const q0 = new THREE.Quaternion();
    const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));

    function applyGyro() {
      const a = devOrient.alpha * DEG2RAD;
      const b = devOrient.beta  * DEG2RAD;
      const g = devOrient.gamma * DEG2RAD;
      const o = screenOrient    * DEG2RAD;

      _euler.set(b, a, -g, 'YXZ');
      camera.quaternion.setFromEuler(_euler);
      camera.quaternion.multiply(q1);
      camera.quaternion.multiply(q0.setFromAxisAngle(zee, -o));
    }

    function enableGyro() {
      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        // iOS 13+
        DeviceOrientationEvent.requestPermission().then(function (p) {
          if (p === 'granted') {
            gyroEnabled = true;
            document.getElementById('btn-gyro').classList.add('active');
            setStatus('gyro ON');
          } else {
            showError('Гироскоп запрещён. Разрешите движение в настройках Safari.');
          }
        }).catch(function (e) {
          showError('Gyro: ' + e.message);
        });
      } else {
        // Android / desktop
        gyroEnabled = true;
        document.getElementById('btn-gyro').classList.add('active');
        setStatus('gyro ON');
      }
    }

    function disableGyro() {
      // сохраняем текущий взгляд, чтобы не «дёрнулось»
      const e = new THREE.Euler().setFromQuaternion(camera.quaternion, 'YXZ');
      lon = e.y;
      lat = e.x;
      clampLat();
      gyroEnabled = false;
      document.getElementById('btn-gyro').classList.remove('active');
      setStatus('gyro OFF');
    }

    document.getElementById('btn-gyro').addEventListener('click', function () {
      if (gyroEnabled) disableGyro();
      else             enableGyro();
    });

    /* ================================================================
       6. VR side-by-side
       ================================================================ */
    let vrMode = false;
    document.getElementById('btn-vr').addEventListener('click', function () {
      vrMode = !vrMode;
      this.classList.toggle('active', vrMode);
      resize();
    });

    /* ================================================================
       7. Fullscreen
       ================================================================ */
    document.getElementById('btn-fullscreen').addEventListener('click', function () {
      const el = document.getElementById('pano-container');
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (el.requestFullscreen)            el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen)            document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
      setTimeout(resize, 300);
    });

    /* ================================================================
       8. Рендер
       ================================================================ */
    function renderFrame() {
      if (gyroEnabled) {
        applyGyro();
      } else {
        camera.rotation.y = lon;
        camera.rotation.x = lat;
      }

      if (vrMode) {
        const w = renderer.domElement.width;
        const h = renderer.domElement.height;
        const halfW = Math.floor(w / 2);

        camera.aspect = halfW / h;
        camera.updateProjectionMatrix();

        renderer.setScissorTest(true);

        renderer.setViewport(0, 0, halfW, h);
        renderer.setScissor(0, 0, halfW, h);
        renderer.render(scene, camera);

        renderer.setViewport(halfW, 0, halfW, h);
        renderer.setScissor(halfW, 0, halfW, h);
        renderer.render(scene, camera);
      } else {
        const w = renderer.domElement.width;
        const h = renderer.domElement.height;
        const targetAspect = w / h;
        if (Math.abs(camera.aspect - targetAspect) > 0.001) {
          camera.aspect = targetAspect;
          camera.updateProjectionMatrix();
        }
        renderer.setScissorTest(false);
        renderer.render(scene, camera);
      }
    }

    /* ================================================================
       9. Старт  — повторный resize несколько раз,
          чтобы поймать момент, когда layout реально готов
       ================================================================ */
    resize();
    setTimeout(resize, 50);
    setTimeout(resize, 200);
    setTimeout(resize, 800);

    renderer.setAnimationLoop(renderFrame);

  } catch (err) {
    showError('Init error: ' + err.message);
  }
})();
</script>
</body>
</html>
