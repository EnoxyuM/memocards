<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>360</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0a0e14;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  #pano-canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #start-screen {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    background: #0a0e14; color: #5ad0ff;
    font: 600 30px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    letter-spacing: 0.08em;
    text-shadow: 0 0 20px rgba(90, 208, 255, 0.55);
    cursor: pointer; transition: opacity 0.45s ease;
  }
  #start-screen.hidden { opacity: 0; pointer-events: none; }
  #crosshair {
    position: fixed; left: 50%; top: 50%;
    width: 22px; height: 22px; margin: -11px 0 0 -11px;
    z-index: 10; pointer-events: none; opacity: 0; transition: opacity 0.4s ease;
  }
  #crosshair.visible { opacity: 1; }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: #8fe4ff;
    box-shadow: 0 0 6px rgba(90, 208, 255, 0.9); border-radius: 1px;
  }
  #crosshair::before { left: 10px; top: 0; width: 2px; height: 22px; }
  #crosshair::after  { top: 10px; left: 0; width: 2px; height: 22px; }
  #crosshair::after  { top: 10px; left: 0; width: 22px; height: 2px; }
  #joystick {
    position: fixed; left: 24px; bottom: 24px;
    width: 130px; height: 130px; border-radius: 50%;
    background: rgba(90, 208, 255, 0.08);
    border: 2px solid rgba(90, 208, 255, 0.5);
    z-index: 15; touch-action: none; display: none;
  }
  #joystick.active { display: block; }
  #joystick-knob {
    position: absolute; left: 50%; top: 50%;
    width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%;
    background: rgba(90, 208, 255, 0.3);
    border: 2px solid rgba(90, 208, 255, 0.9);
    pointer-events: none; will-change: transform;
  }
  .action-btn {
    position: fixed; width: 68px; height: 68px; border-radius: 50%;
    background: rgba(90, 208, 255, 0.12);
    border: 2px solid rgba(90, 208, 255, 0.6);
    z-index: 15; display: none; align-items: center; justify-content: center;
    font: 600 11px/1.1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: #8fe4ff; text-transform: uppercase; letter-spacing: 0.05em;
    text-align: center; touch-action: none; padding: 4px; box-sizing: border-box;
  }
  .action-btn.active { display: flex; }
  .action-btn:active { background: rgba(90, 208, 255, 0.35); }
  #btn-build   { right: 24px; bottom: 102px; }
  #btn-destroy { right: 102px; bottom: 102px; }
  #btn-jump    { right: 24px; bottom: 24px; width: 84px; height: 84px; font-size: 13px; }
</style>
</head>
<body>
<canvas id="pano-canvas"></canvas>
<div id="crosshair"></div>
<div id="start-screen">Tap to Start.</div>
<div id="joystick"><div id="joystick-knob"></div></div>
<div id="btn-build" class="action-btn">Build</div>
<div id="btn-destroy" class="action-btn">Break</div>
<div id="btn-jump" class="action-btn">Jump</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';
  if (typeof THREE === 'undefined') { console.error('[pano] Three.js не загрузился'); return; }

  const DEG = Math.PI / 180;

  const canvas = document.getElementById('pano-canvas');
  const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x0a0e14, 1);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, 1, 0.05, 2000);

  scene.add(new THREE.AmbientLight(0xffffff, 0.75));
  const sun1 = new THREE.DirectionalLight(0xffffff, 0.55);
  sun1.position.set(30, 80, 20); scene.add(sun1);
  const sun2 = new THREE.DirectionalLight(0xffffff, 0.25);
  sun2.position.set(-40, 40, -30); scene.add(sun2);

  /* ============ World ============ */
  const CHUNK_SIZE = 16;
  const VIEW_DIST = 3;
  const MAX_WIN_DIST = 60;
  const worldSeed = Math.floor(Math.random() * 1000000);
  const chunks = new Map();

  function hash2(x, z, seed) {
    let h = seed ^ Math.imul(x | 0, 0x27d4eb2d);
    h = Math.imul(h ^ (h >>> 15), 0x85ebca6b);
    h = h ^ Math.imul(z | 0, 0xc2b2ae35);
    h = Math.imul(h ^ (h >>> 13), 0x27d4eb2d);
    return (h >>> 0) / 4294967296;
  }
  function smooth(t) { return t * t * (3 - 2 * t); }
  function valueNoise(x, z, seed) {
    const xi = Math.floor(x), zi = Math.floor(z);
    const xf = x - xi, zf = z - zi;
    const u = smooth(xf), v = smooth(zf);
    const a = hash2(xi, zi, seed);
    const b = hash2(xi + 1, zi, seed);
    const c = hash2(xi, zi + 1, seed);
    const d = hash2(xi + 1, zi + 1, seed);
    return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
  }
  function terrainHeight(wx, wz) {
    const n1 = valueNoise(wx * 0.05, wz * 0.05, worldSeed);
    const n2 = valueNoise(wx * 0.2, wz * 0.2, worldSeed + 1);
    return Math.floor(n1 * 12 + n2 * 3) - 2;
  }

  const blockMaterials = {
    1: new THREE.MeshLambertMaterial({ color: 0x6abf4b }),
    2: new THREE.MeshLambertMaterial({ color: 0x9c7554 }),
    3: new THREE.MeshLambertMaterial({ color: 0x888888 }),
    4: new THREE.MeshLambertMaterial({ color: 0xf0d060 })
  };
  const blockGeometry = new THREE.BoxGeometry(1, 1, 1);

  function generateChunk(cx, cz) {
    const chunk = { cx, cz, blocks: new Map(), mesh: null };
    const x0 = cx * CHUNK_SIZE, z0 = cz * CHUNK_SIZE;
    for (let lx = 0; lx < CHUNK_SIZE; lx++) {
      for (let lz = 0; lz < CHUNK_SIZE; lz++) {
        const wx = x0 + lx, wz = z0 + lz;
        const h = terrainHeight(wx, wz);
        for (let y = -4; y <= h; y++) {
          let type;
          if (y === h) type = 1;
          else if (y >= h - 3) type = 2;
          else type = 3;
          chunk.blocks.set(wx + ',' + y + ',' + wz, type);
        }
      }
    }
    return chunk;
  }

  function buildChunkMesh(chunk) {
    if (chunk.mesh) { scene.remove(chunk.mesh); chunk.mesh = null; }
    if (chunk.blocks.size === 0) return;
    const groups = {};
    chunk.blocks.forEach((type, bkey) => {
      if (!groups[type]) groups[type] = [];
      groups[type].push(bkey);
    });
    const group = new THREE.Group();
    const dummy = new THREE.Object3D();
    for (const typeStr in groups) {
      const type = +typeStr;
      const list = groups[type];
      const mat = blockMaterials[type] || blockMaterials[3];
      const mesh = new THREE.InstancedMesh(blockGeometry, mat, list.length);
      mesh.frustumCulled = false;
      for (let i = 0; i < list.length; i++) {
        const parts = list[i].split(',');
        dummy.position.set(+parts[0] + 0.5, +parts[1] + 0.5, +parts[2] + 0.5);
        dummy.updateMatrix();
        mesh.setMatrixAt(i, dummy.matrix);
      }
      mesh.instanceMatrix.needsUpdate = true;
      group.add(mesh);
    }
    scene.add(group);
    chunk.mesh = group;
  }

  function getChunk(cx, cz) {
    const key = cx + ',' + cz;
    let chunk = chunks.get(key);
    if (!chunk) { chunk = generateChunk(cx, cz); chunks.set(key, chunk); buildChunkMesh(chunk); }
    return chunk;
  }
  function getBlock(wx, wy, wz) {
    const cx = Math.floor(wx / CHUNK_SIZE);
    const cz = Math.floor(wz / CHUNK_SIZE);
    const chunk = chunks.get(cx + ',' + cz);
    if (!chunk) return 0;
    return chunk.blocks.get(wx + ',' + wy + ',' + wz) || 0;
  }
  function setBlock(wx, wy, wz, type) {
    const cx = Math.floor(wx / CHUNK_SIZE);
    const cz = Math.floor(wz / CHUNK_SIZE);
    const key = cx + ',' + cz;
    let chunk = chunks.get(key);
    if (!chunk) { chunk = { cx, cz, blocks: new Map(), mesh: null }; chunks.set(key, chunk); }
    const bkey = wx + ',' + wy + ',' + wz;
    if (type === 0) { if (!chunk.blocks.has(bkey)) return; chunk.blocks.delete(bkey); }
    else { if (chunk.blocks.get(bkey) === type) return; chunk.blocks.set(bkey, type); }
    buildChunkMesh(chunk);
  }

  /* ============ Player ============ */
  const PLAYER_WIDTH = 0.6;
  const PLAYER_HEIGHT = 1.7;
  const EYE_HEIGHT = PLAYER_HEIGHT * 0.9;
  const GRAVITY = 25;
  const JUMP_VEL = 8.5;
  const MAX_SPEED = 5;
  const REACH = 6;

  const playerPos = new THREE.Vector3(0.5, 0, 0.5);
  const playerVel = new THREE.Vector3(0, 0, 0);
  let grounded = false;
  (function () { const h = terrainHeight(0, 0); playerPos.set(0.5, h + 1, 0.5); })();

  const _camDir = new THREE.Vector3();
  function getCamDir() { camera.getWorldDirection(_camDir); return _camDir; }

  function playerAABBSolid(x, y, z) {
    const hw = PLAYER_WIDTH / 2;
    const minX = Math.floor(x - hw), maxX = Math.floor(x + hw);
    const minY = Math.floor(y), maxY = Math.floor(y + PLAYER_HEIGHT);
    const minZ = Math.floor(z - hw), maxZ = Math.floor(z + hw);
    for (let bx = minX; bx <= maxX; bx++)
      for (let by = minY; by <= maxY; by++)
        for (let bz = minZ; bz <= maxZ; bz++)
          if (getBlock(bx, by, bz) !== 0)
            if (x + hw > bx && x - hw < bx + 1 &&
                y + PLAYER_HEIGHT > by && y < by + 1 &&
                z + hw > bz && z - hw < bz + 1) return true;
    return false;
  }
  function checkGrounded() {
    const hw = PLAYER_WIDTH / 2 - 0.01;
    const minBX = Math.floor(playerPos.x - hw), maxBX = Math.floor(playerPos.x + hw);
    const minBZ = Math.floor(playerPos.z - hw), maxBZ = Math.floor(playerPos.z + hw);
    const testY = Math.floor(playerPos.y - 0.05);
    for (let bx = minBX; bx <= maxBX; bx++)
      for (let bz = minBZ; bz <= maxBZ; bz++)
        if (getBlock(bx, testY, bz) !== 0) return true;
    return false;
  }
  function shouldAutoJump(dirX, dirZ) {
    if (!grounded) return false;
    const len = Math.hypot(dirX, dirZ);
    if (len < 0.01) return false;
    const nx = dirX / len, nz = dirZ / len;
    const cx = playerPos.x + nx * 0.7, cz = playerPos.z + nz * 0.7;
    const footBlock = getBlock(Math.floor(cx), Math.floor(playerPos.y + 0.1), Math.floor(cz));
    if (footBlock === 0) return false;
    const headBlock = getBlock(Math.floor(cx), Math.floor(playerPos.y + PLAYER_HEIGHT - 0.1), Math.floor(cz));
    if (headBlock !== 0) return false;
    if (getBlock(Math.floor(playerPos.x), Math.floor(playerPos.y + 1.2), Math.floor(playerPos.z)) !== 0) return false;
    return true;
  }

  function updatePlayer(dt) {
    if (playerPos.y < -50) {
      const h = terrainHeight(0, 0);
      playerPos.set(0.5, h + 2, 0.5); playerVel.set(0, 0, 0);
    }
    const camDir = getCamDir();
    let yawX = camDir.x, yawZ = camDir.z;
    const yawLen = Math.hypot(yawX, yawZ);
    if (yawLen > 0.0001) { yawX /= yawLen; yawZ /= yawLen; }
    const rightX = -yawZ, rightZ = yawX;
    const wishX = (yawX * joystickVec.z + rightX * joystickVec.x) * MAX_SPEED;
    const wishZ = (yawZ * joystickVec.z + rightZ * joystickVec.x) * MAX_SPEED;
    if (shouldAutoJump(wishX, wishZ)) { playerVel.y = JUMP_VEL; grounded = false; }
    playerVel.x = wishX; playerVel.z = wishZ;
    playerVel.y -= GRAVITY * dt;
    if (playerVel.y < -15) playerVel.y = -15;
    const dx = playerVel.x * dt;
    if (dx !== 0 && !playerAABBSolid(playerPos.x + dx, playerPos.y, playerPos.z)) playerPos.x += dx;
    const dz = playerVel.z * dt;
    if (dz !== 0 && !playerAABBSolid(playerPos.x, playerPos.y, playerPos.z + dz)) playerPos.z += dz;
    const dy = playerVel.y * dt;
    if (dy < 0) {
      if (checkGrounded()) { playerVel.y = 0; grounded = true; }
      else {
        const ny = playerPos.y + dy;
        if (playerAABBSolid(playerPos.x, ny, playerPos.z)) {
          playerPos.y = Math.floor(ny) + 1; playerVel.y = 0; grounded = true;
        } else { playerPos.y = ny; grounded = false; }
      }
    } else if (dy > 0) {
      const ny = playerPos.y + dy;
      if (playerAABBSolid(playerPos.x, ny, playerPos.z)) playerVel.y = 0;
      else playerPos.y = ny;
      grounded = false;
    } else {
      if (checkGrounded()) grounded = true;
    }
    camera.position.set(playerPos.x, playerPos.y + EYE_HEIGHT, playerPos.z);
  }

  /* ============ Chunks ============ */
  let lastChunkCX = null, lastChunkCZ = null;
  function initialChunks() {
    const pcx = Math.floor(playerPos.x / CHUNK_SIZE);
    const pcz = Math.floor(playerPos.z / CHUNK_SIZE);
    for (let dx = -VIEW_DIST; dx <= VIEW_DIST; dx++)
      for (let dz = -VIEW_DIST; dz <= VIEW_DIST; dz++) getChunk(pcx + dx, pcz + dz);
    lastChunkCX = pcx; lastChunkCZ = pcz;
  }
  function updateChunks() {
    const pcx = Math.floor(playerPos.x / CHUNK_SIZE);
    const pcz = Math.floor(playerPos.z / CHUNK_SIZE);
    if (pcx === lastChunkCX && pcz === lastChunkCZ) return;
    lastChunkCX = pcx; lastChunkCZ = pcz;
    for (let dx = -VIEW_DIST; dx <= VIEW_DIST; dx++)
      for (let dz = -VIEW_DIST; dz <= VIEW_DIST; dz++) {
        const cx = pcx + dx, cz = pcz + dz;
        if (!chunks.has(cx + ',' + cz)) getChunk(cx, cz);
      }
  }

  /* ============ Block raycast / build / destroy ============ */
  function raycastBlock(maxDist) {
    const dir = getCamDir().clone();
    const eye = new THREE.Vector3(playerPos.x, playerPos.y + EYE_HEIGHT, playerPos.z);
    const step = 0.05;
    let prev = { x: Math.floor(eye.x), y: Math.floor(eye.y), z: Math.floor(eye.z) };
    for (let t = 0; t <= maxDist; t += step) {
      const px = eye.x + dir.x * t, py = eye.y + dir.y * t, pz = eye.z + dir.z * t;
      const bx = Math.floor(px), by = Math.floor(py), bz = Math.floor(pz);
      if (getBlock(bx, by, bz) !== 0) return { hit: { x: bx, y: by, z: bz }, prev };
      prev = { x: bx, y: by, z: bz };
    }
    return null;
  }
  function blockIntersectsPlayer(bx, by, bz) {
    const hw = PLAYER_WIDTH / 2;
    return (playerPos.x + hw > bx && playerPos.x - hw < bx + 1 &&
            playerPos.y + PLAYER_HEIGHT > by && playerPos.y < by + 1 &&
            playerPos.z + hw > bz && playerPos.z - hw < bz + 1);
  }
  function buildBlock() {
    const res = raycastBlock(REACH); if (!res) return;
    const { x, y, z } = res.prev;
    if (blockIntersectsPlayer(x, y, z)) return;
    setBlock(x, y, z, 4);
  }
  function destroyBlock() {
    const res = raycastBlock(REACH); if (!res) return;
    setBlock(res.hit.x, res.hit.y, res.hit.z, 0);
  }
  function doJump() { if (grounded) { playerVel.y = JUMP_VEL; grounded = false; } }

  /* ============ Aim placement ============ */
  function getAimPlacement() {
    const eye = new THREE.Vector3(playerPos.x, playerPos.y + EYE_HEIGHT, playerPos.z);
    const dir = getCamDir().clone();
    const res = raycastBlock(REACH);
    if (res) {
      const hit = res.hit, prev = res.prev;
      let nx = prev.x - hit.x, ny = prev.y - hit.y, nz = prev.z - hit.z;
      if (Math.abs(nx) + Math.abs(ny) + Math.abs(nz) >= 0.5) {
        const ax = Math.abs(nx), ay = Math.abs(ny), az = Math.abs(nz);
        if (ax >= ay && ax >= az) { nx = nx > 0 ? 1 : -1; ny = 0; nz = 0; }
        else if (ay >= ax && ay >= az) { nx = 0; ny = ny > 0 ? 1 : -1; nz = 0; }
        else { nx = 0; ny = 0; nz = nz > 0 ? 1 : -1; }
        return {
          pos: new THREE.Vector3(
            hit.x + 0.5 + nx * 0.51,
            hit.y + 0.5 + ny * 0.51,
            hit.z + 0.5 + nz * 0.51
          ),
          normal: new THREE.Vector3(nx, ny, nz),
          attached: true
        };
      }
    }
    const pos = eye.clone().add(dir.clone().multiplyScalar(REACH));
    const normal = dir.clone().negate().normalize();
    return { pos, normal, attached: false };
  }

  /* ============ Windows ============ */
  const WIN_W = 1.0;
  const WIN_H = 0.75;
  const TEX_W = 512, TEX_H = 384;
  const WINDOW_FONT = '500 36px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif';
  const BTN_IDS = ['close', 'move', 'resize', 'text', 'flip'];
  const BTN_SIZE = 64, BTN_TOP = 8, BTN_RIGHT = 8, BTN_GAP = 3;

  // Все кнопочные меши (hit / prog / ring) на одном z — 1% ширины окна вперёд.
  const BTN_Z = 0.01;

  function buttonRect(index) {
    const right = TEX_W - BTN_RIGHT - index * (BTN_SIZE + BTN_GAP);
    return { x: right - BTN_SIZE, y: BTN_TOP, w: BTN_SIZE, h: BTN_SIZE };
  }

  function palette(flipped) {
    return flipped ? {
      accent: '#ff7ec1', accentLight: '#ffb0d8',
      accentSoft: 'rgba(255, 126, 193, 0.10)',
      border: 'rgba(255, 126, 193, 0.50)',
      text: '#f5dce8', glow: 'rgba(255, 126, 193, 0.28)', hex: 0xff7ec1
    } : {
      accent: '#5ad0ff', accentLight: '#8fe4ff',
      accentSoft: 'rgba(90, 208, 255, 0.10)',
      border: 'rgba(90, 208, 255, 0.50)',
      text: '#c8d8e0', glow: 'rgba(90, 208, 255, 0.28)', hex: 0x5ad0ff
    };
  }

  function wrapText(ctx, text, maxWidth) {
    const paragraphs = String(text).split('\n');
    const lines = [];
    for (let i = 0; i < paragraphs.length; i++) {
      const p = paragraphs[i];
      if (p === '') { lines.push(''); continue; }
      const words = p.split(/\s+/);
      let line = '';
      for (let j = 0; j < words.length; j++) {
        const test = line ? line + ' ' + words[j] : words[j];
        if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = words[j]; }
        else line = test;
      }
      lines.push(line);
    }
    return lines;
  }

  function drawButtonIcon(ctx, r, id, flipped, p) {
    const cx = r.x + r.w / 2, cy = r.y + r.h / 2, rad = r.w / 2 - 2;
    ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2);
    ctx.fillStyle = p.accentSoft; ctx.fill();
    ctx.strokeStyle = p.accentLight; ctx.fillStyle = p.accentLight;
    ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const isz = rad * 0.52;
    if (id === 'close') {
      ctx.beginPath();
      ctx.moveTo(cx - isz, cy - isz); ctx.lineTo(cx + isz, cy + isz);
      ctx.moveTo(cx + isz, cy - isz); ctx.lineTo(cx - isz, cy + isz);
      ctx.stroke();
    } else if (id === 'move') {
      ctx.beginPath(); ctx.rect(cx - isz, cy - isz, isz * 2, isz * 2); ctx.stroke();
    } else if (id === 'resize') {
      ctx.beginPath();
      ctx.moveTo(cx, cy - isz * 1.05);
      ctx.lineTo(cx + isz * 1.05, cy + isz * 0.9);
      ctx.lineTo(cx - isz * 1.05, cy + isz * 0.9);
      ctx.closePath(); ctx.stroke();
    } else if (id === 'text') {
      ctx.beginPath(); ctx.arc(cx, cy, isz * 0.95, 0, Math.PI * 2); ctx.stroke();
    } else if (id === 'flip') {
      const spikes = 5, outer = isz * 1.15, inner = isz * 0.48;
      ctx.beginPath();
      for (let i = 0; i < spikes * 2; i++) {
        const rr = (i % 2 === 0) ? outer : inner;
        const a = -Math.PI / 2 + i * Math.PI / spikes;
        const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath();
      if (flipped) ctx.stroke(); else ctx.fill();
    }
  }

  function drawWindowFace(ctx, W, H, text, flipped) {
    const p = palette(flipped);
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0d0d11'; ctx.fillRect(0, 0, W, H);
    const g = ctx.createRadialGradient(W / 2, H / 2, 20, W / 2, H / 2, Math.max(W, H) * 0.7);
    g.addColorStop(0, p.glow); g.addColorStop(1, 'rgba(5, 5, 8, 0.0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = p.border; ctx.lineWidth = 2;
    ctx.strokeRect(1, 1, W - 2, H - 2);
    if (text) {
      ctx.font = WINDOW_FONT; ctx.fillStyle = p.text;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const lines = wrapText(ctx, text, W - 100).slice(0, 4);
      const lh = 38;
      const startY = H / 2 + 14 - (lines.length - 1) * lh / 2;
      for (let i = 0; i < lines.length; i++) ctx.fillText(lines[i], W / 2, startY + i * lh);
    }
    for (let i = 0; i < BTN_IDS.length; i++) drawButtonIcon(ctx, buttonRect(i), BTN_IDS[i], flipped, p);
  }

  const windows = [];
  let nextRenderOrder = 1;

  function makeWindow(text) {
    const group = new THREE.Group();
    const ro = nextRenderOrder; nextRenderOrder += 10;

    const cv = document.createElement('canvas');
    cv.width = TEX_W; cv.height = TEX_H;
    const ctx = cv.getContext('2d');
    const tex = new THREE.CanvasTexture(cv);
    tex.minFilter = THREE.LinearFilter; tex.magFilter = THREE.LinearFilter;

    // Лицо окна. polygonOffset отодвигает его чуть вглубь по z-buffer,
    // чтобы кнопочные меши впереди гарантированно проходили depth test.
    const face = new THREE.Mesh(
      new THREE.PlaneGeometry(WIN_W, WIN_H),
      new THREE.MeshBasicMaterial({
        map: tex, transparent: true, side: THREE.DoubleSide,
        depthTest: true, depthWrite: false,
        polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1
      })
    );
    face.renderOrder = ro;
    group.add(face);

    const win = { group, face, ctx, tex, textFront: text || '', textBack: '', flipped: false, buttons: {} };

    for (let i = 0; i < BTN_IDS.length; i++) {
      const id = BTN_IDS[i];
      const r = buttonRect(i);
      const lx = ((r.x + r.w / 2) / TEX_W - 0.5) * WIN_W;
      const ly = (0.5 - (r.y + r.h / 2) / TEX_H) * WIN_H;
      const rad = (r.w / 2 / TEX_W) * WIN_W;

      // Hit-меш на том же z, что и визуальные кольца — активация совпадает с картинкой.
      const hit = new THREE.Mesh(
        new THREE.CircleGeometry(rad * 1.10, 24),
        new THREE.MeshBasicMaterial({ visible: false })
      );
      hit.position.set(lx, ly, BTN_Z);
      group.add(hit);

      // Заливка прогресса и кольцо — в ОДНОЙ плоскости (BTN_Z), чуть впереди окна.
      const prog = new THREE.Mesh(
        new THREE.CircleGeometry(rad * 1.05, 24),
        new THREE.MeshBasicMaterial({
          color: 0x5ad0ff, transparent: true, opacity: 0.35,
          side: THREE.DoubleSide, depthTest: true, depthWrite: false
        })
      );
      prog.position.set(lx, ly, BTN_Z);
      prog.renderOrder = ro + 5;
      prog.visible = false;
      prog.scale.setScalar(0.0001);
      group.add(prog);

      const ring = new THREE.Mesh(
        new THREE.RingGeometry(rad * 1.05, rad * 1.30, 24),
        new THREE.MeshBasicMaterial({
          color: 0x5ad0ff, transparent: true, opacity: 0.95,
          side: THREE.DoubleSide, depthTest: true, depthWrite: false
        })
      );
      ring.position.set(lx, ly, BTN_Z);
      ring.renderOrder = ro + 6;
      ring.visible = false;
      group.add(ring);

      win.buttons[id] = { id, hit, ring, prog, progress: 0, armed: true };
    }

    refreshWindow(win);
    return win;
  }

  function refreshWindow(win) {
    const text = win.flipped ? win.textBack : win.textFront;
    drawWindowFace(win.ctx, TEX_W, TEX_H, text, win.flipped);
    win.tex.needsUpdate = true;
    const col = palette(win.flipped).hex;
    for (const id in win.buttons) {
      win.buttons[id].ring.material.color.setHex(col);
      win.buttons[id].prog.material.color.setHex(col);
    }
  }

  function orientWindowToPlacement(win, placement) {
    win.group.position.copy(placement.pos);
    if (placement.attached) {
      const n = placement.normal;
      win.group.lookAt(
        placement.pos.x + n.x,
        placement.pos.y + n.y,
        placement.pos.z + n.z
      );
    } else {
      const eye = new THREE.Vector3(playerPos.x, playerPos.y + EYE_HEIGHT, playerPos.z);
      win.group.lookAt(eye);
    }
  }

  function createWindowCenter() {
    const placement = getAimPlacement();
    const win = makeWindow('');
    orientWindowToPlacement(win, placement);
    scene.add(win.group);
    windows.push(win);
  }

  function removeWindow(win) {
    scene.remove(win.group);
    win.face.geometry.dispose();
    if (win.face.material.map) win.face.material.map.dispose();
    win.face.material.dispose();
    win.tex.dispose();
    for (const id in win.buttons) {
      const b = win.buttons[id];
      b.hit.geometry.dispose(); b.hit.material.dispose();
      b.ring.geometry.dispose(); b.ring.material.dispose();
      b.prog.geometry.dispose(); b.prog.material.dispose();
    }
    const i = windows.indexOf(win);
    if (i !== -1) windows.splice(i, 1);
    if (mode && mode.win === win) { mode = null; hideModeVisuals(); }
    if (editingWin === win) cancelEdit();
  }

  function updateWindowVisibility() {
    const eye = new THREE.Vector3(playerPos.x, playerPos.y + EYE_HEIGHT, playerPos.z);
    for (let i = 0; i < windows.length; i++) {
      const w = windows[i];
      w.group.visible = w.group.position.distanceTo(eye) <= MAX_WIN_DIST;
    }
  }

  /* ============ Hover ============ */
  const raycaster = new THREE.Raycaster();
  const CENTER_NDC = new THREE.Vector2(0, 0);

  function getButtonUnderCrosshair() {
    if (!windows.length) return null;
    const hitsList = [];
    for (let i = 0; i < windows.length; i++) {
      const w = windows[i];
      if (!w.group.visible) continue;
      for (const id in w.buttons) hitsList.push(w.buttons[id].hit);
    }
    if (!hitsList.length) return null;
    raycaster.setFromCamera(CENTER_NDC, camera);
    const hits = raycaster.intersectObjects(hitsList, false);
    if (!hits.length) return null;
    const obj = hits[0].object;
    for (let i = 0; i < windows.length; i++) {
      const w = windows[i];
      for (const id in w.buttons)
        if (w.buttons[id].hit === obj) return { win: w, btn: w.buttons[id], id: id };
    }
    return null;
  }

  function clearAllButtonVisuals() {
    for (let i = 0; i < windows.length; i++) {
      const w = windows[i];
      for (const id in w.buttons) {
        const b = w.buttons[id];
        b.progress = 0; b.armed = true;
        b.ring.visible = false; b.prog.visible = false;
        b.prog.scale.setScalar(0.0001);
      }
    }
  }

  function updateHover(dt) {
    if (mode || editingWin) { clearAllButtonVisuals(); return; }
    const found = getButtonUnderCrosshair();

    for (let i = 0; i < windows.length; i++) {
      const w = windows[i];
      for (const id in w.buttons) {
        const b = w.buttons[id];
        const isFound = found && found.btn === b;
        if (!isFound) {
          b.progress = 0; b.armed = true;
          b.ring.visible = false; b.prog.visible = false;
          b.prog.scale.setScalar(0.0001);
        }
      }
    }

    if (!found) return;
    const b = found.btn;
    b.ring.visible = true;
    if (b.armed) {
      b.progress += dt;
      if (b.progress >= 1) { b.progress = 0; b.armed = false; fireButton(found.win, b.id); }
    }
    if (b.progress > 0.001) {
      b.prog.visible = true;
      b.prog.scale.setScalar(Math.max(0.0001, b.progress));
    } else b.prog.visible = false;
  }

  function fireButton(win, id) {
    if (id === 'close') removeWindow(win);
    else if (id === 'move') startMode('move', win);
    else if (id === 'resize') startMode('resize', win);
    else if (id === 'text') editText(win);
    else if (id === 'flip') { win.flipped = !win.flipped; refreshWindow(win); }
  }

  /* ============ Move / Resize ============ */
  let mode = null;
  const MODE_TOL = 1.2 * DEG;
  const MODE_DURATION = 1.0;

  const modeRing = new THREE.Mesh(
    new THREE.RingGeometry(0.93, 1.0, 48),
    new THREE.MeshBasicMaterial({ color: 0x5ad0ff, transparent: true, opacity: 0.95, side: THREE.DoubleSide, depthTest: false, depthWrite: false })
  );
  modeRing.renderOrder = 40; modeRing.visible = false; scene.add(modeRing);

  const modeFill = new THREE.Mesh(
    new THREE.CircleGeometry(1, 48),
    new THREE.MeshBasicMaterial({ color: 0x5ad0ff, transparent: true, opacity: 0.25, side: THREE.DoubleSide, depthTest: false, depthWrite: false })
  );
  modeFill.renderOrder = 39; modeFill.visible = false; scene.add(modeFill);

  function hideModeVisuals() { modeRing.visible = false; modeFill.visible = false; }

  function startMode(type, win) {
    const dir = getCamDir().clone();
    const eye = new THREE.Vector3(playerPos.x, playerPos.y + EYE_HEIGHT, playerPos.z);
    clearAllButtonVisuals();
    mode = {
      type, win,
      plantOrigin: eye.clone(),
      plantDir: dir.clone(),
      progress: 0, scaleT: 0,
      baseScale: win.group.scale.x || 1
    };
    const col = palette(win.flipped).hex;
    modeRing.material.color.setHex(col);
    modeFill.material.color.setHex(col);
    updateModeVisuals();
  }

  function updateModeVisuals(placement) {
    if (!mode) { hideModeVisuals(); return; }
    if (!placement) placement = getAimPlacement();
    const eye = new THREE.Vector3(playerPos.x, playerPos.y + EYE_HEIGHT, playerPos.z);
    const distToAim = placement.pos.distanceTo(eye);
    const R = Math.max(0.03, distToAim * Math.tan(MODE_TOL));

    modeRing.position.copy(placement.pos);
    modeRing.lookAt(eye);
    modeRing.scale.setScalar(R);
    modeRing.visible = true;

    const pr = Math.max(0, Math.min(1, mode.progress / MODE_DURATION));
    modeFill.position.copy(placement.pos);
    modeFill.lookAt(eye);
    modeFill.scale.setScalar(Math.max(0.0001, R * pr));
    modeFill.visible = pr > 0.001;
  }

  function updateMode(dt) {
    if (!mode) return;

    const eye = new THREE.Vector3(playerPos.x, playerPos.y + EYE_HEIGHT, playerPos.z);
    const dir = getCamDir().clone();
    const placement = getAimPlacement();

    const aimAng = Math.acos(Math.max(-1, Math.min(1, mode.plantDir.dot(dir))));
    const eyeMoved = mode.plantOrigin.distanceTo(eye);
    const isRunning = Math.hypot(playerVel.x, playerVel.z) > 0.1;
    const stable = aimAng <= MODE_TOL && eyeMoved <= 0.3 && !isRunning;

    if (!stable) {
      mode.plantOrigin.copy(eye);
      mode.plantDir.copy(dir);
      mode.progress = 0;
    } else {
      mode.progress += dt;
    }

    if (mode.type === 'resize' && !stable) {
      mode.scaleT += dt;
      const s = mode.baseScale + Math.sin(mode.scaleT * 4) * 0.7;
      mode.win.group.scale.setScalar(Math.max(0.4, Math.min(2.5, s)));
    }

    updateModeVisuals(placement);

    if (mode.progress >= MODE_DURATION) {
      if (mode.type === 'move') {
        orientWindowToPlacement(mode.win, placement);
      }
      mode = null;
      hideModeVisuals();
    }
  }

  /* ============ Text input ============ */
  let editInput = null, editingWin = null, lastEditEnd = 0;

  function ensureInput() {
    if (editInput) return editInput;
    editInput = document.createElement('textarea');
    editInput.id = 'window-text-input';
    editInput.autocomplete = 'off';
    editInput.spellcheck = false;
    editInput.setAttribute('autocorrect', 'off');
    editInput.setAttribute('autocapitalize', 'sentences');
    editInput.rows = 3;
    Object.assign(editInput.style, {
      position: 'fixed', left: '50%', top: '25%',
      transform: 'translate(-50%, -50%)',
      width: '78%', maxWidth: '440px', boxSizing: 'border-box',
      padding: '14px 18px', fontSize: '20px',
      fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif',
      background: '#0d0d11', color: '#e9f8ff',
      border: '2px solid #5ad0ff', borderRadius: '10px',
      boxShadow: '0 0 24px rgba(90,208,255,0.55)',
      zIndex: 100, outline: 'none', display: 'none',
      caretColor: '#5ad0ff', resize: 'none',
      lineHeight: '1.35', minHeight: '80px', maxHeight: '42vh', overflowY: 'auto'
    });
    document.body.appendChild(editInput);
    editInput.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { e.preventDefault(); cancelEdit(); }
    });
    editInput.addEventListener('blur', function () {
      setTimeout(function () {
        if (editingWin && document.activeElement !== editInput) commitEdit();
      }, 120);
    });
    return editInput;
  }

  let warmInput = null;
  function warmUpKeyboard() {
    if (warmInput) return;
    warmInput = document.createElement('input');
    warmInput.type = 'text'; warmInput.setAttribute('autocomplete', 'off');
    Object.assign(warmInput.style, {
      position: 'fixed', left: '50%', top: '0', width: '1px', height: '1px',
      padding: '0', border: 'none', outline: 'none', opacity: '0',
      pointerEvents: 'none', zIndex: -1
    });
    document.body.appendChild(warmInput);
    try { warmInput.focus(); } catch (e) {}
    setTimeout(function () { try { warmInput.blur(); } catch (e) {} }, 30);
  }

  function editText(win) {
    ensureInput();
    editingWin = win;
    const p = palette(win.flipped);
    editInput.style.borderColor = p.accent;
    editInput.style.boxShadow = '0 0 24px ' + (win.flipped ? 'rgba(255,126,193,0.55)' : 'rgba(90,208,255,0.55)');
    editInput.style.caretColor = p.accent;
    editInput.style.color = win.flipped ? '#f5dce8' : '#e9f8ff';
    editInput.value = win.flipped ? win.textBack : win.textFront;
    editInput.style.display = 'block';
    const tryFocus = function () {
      try {
        editInput.focus({ preventScroll: true });
        const len = editInput.value.length;
        editInput.setSelectionRange(len, len);
      } catch (e) {}
    };
    tryFocus();
    requestAnimationFrame(tryFocus);
    setTimeout(tryFocus, 20);
    setTimeout(tryFocus, 80);
    setTimeout(tryFocus, 200);
  }
  function commitEdit() {
    if (!editingWin || !editInput) return;
    const win = editingWin;
    editingWin = null;
    lastEditEnd = performance.now();
    const value = editInput.value;
    if (win.flipped) win.textBack = value; else win.textFront = value;
    refreshWindow(win);
    editInput.style.display = 'none';
    try { editInput.blur(); } catch (e) {}
  }
  function cancelEdit() {
    if (!editInput) return;
    editingWin = null;
    lastEditEnd = performance.now();
    editInput.style.display = 'none';
    try { editInput.blur(); } catch (e) {}
  }

  /* ============ Gyro / fallback ============ */
  let gyroOn = false, gyroFailed = false, requestInFlight = false, gotOrientation = false;
  const dev = { alpha: 0, beta: 0, gamma: 0 };
  let screenOrient = window.orientation || 0;

  window.addEventListener('deviceorientation', function (e) {
    if (e.alpha == null && e.beta == null && e.gamma == null) return;
    gotOrientation = true;
    dev.alpha = e.alpha || 0; dev.beta = e.beta || 0; dev.gamma = e.gamma || 0;
  });
  window.addEventListener('orientationchange', function () { screenOrient = window.orientation || 0; });

  function tryEnableGyro() {
    if (gyroOn || requestInFlight || gyroFailed) return;
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      requestInFlight = true;
      DeviceOrientationEvent.requestPermission()
        .then(function (p) { requestInFlight = false; if (p === 'granted') gyroOn = true; else gyroFailed = true; })
        .catch(function () { requestInFlight = false; gyroFailed = true; });
    } else gyroOn = true;
  }
  document.addEventListener('touchstart', tryEnableGyro, { passive: true });
  document.addEventListener('click', tryEnableGyro);

  const zee = new THREE.Vector3(0, 0, 1);
  const _euler = new THREE.Euler();
  const q0 = new THREE.Quaternion();
  const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));

  function applyGyro() {
    const a = dev.alpha * DEG, b = dev.beta * DEG, g = dev.gamma * DEG, o = screenOrient * DEG;
    _euler.set(b, a, -g, 'YXZ');
    camera.quaternion.setFromEuler(_euler);
    camera.quaternion.multiply(q1);
    camera.quaternion.multiply(q0.setFromAxisAngle(zee, -o));
  }

  let lookMode = false;
  let lookYaw = 0, lookPitch = 0;
  const _lookEuler = new THREE.Euler(0, 0, 0, 'YXZ');
  function applyLook() { _lookEuler.set(lookPitch, lookYaw, 0, 'YXZ'); camera.quaternion.setFromEuler(_lookEuler); }

  /* ============ Resize ============ */
  function resize() {
    let w = canvas.clientWidth || window.innerWidth;
    let h = canvas.clientHeight || window.innerHeight;
    if (w < 10) w = window.innerWidth;
    if (h < 10) h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 250); });

  /* ============ Joystick ============ */
  const joystickEl = document.getElementById('joystick');
  const joystickKnob = document.getElementById('joystick-knob');
  const joystickVec = { x: 0, z: 0 };
  let joystickActive = false, joystickPointerId = null;

  function updateJoystickPos(e) {
    const rect = joystickEl.getBoundingClientRect();
    const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
    let dx = e.clientX - cx, dy = e.clientY - cy;
    const maxR = rect.width / 2 - 15;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > maxR) { dx = dx / dist * maxR; dy = dy / dist * maxR; }
    joystickVec.x = dx / maxR; joystickVec.z = -dy / maxR;
    joystickKnob.style.transform = 'translate(' + dx + 'px, ' + dy + 'px)';
  }
  function resetJoystick() {
    joystickActive = false; joystickPointerId = null;
    joystickVec.x = 0; joystickVec.z = 0;
    joystickKnob.style.transform = 'translate(0, 0)';
  }
  joystickEl.addEventListener('pointerdown', function (e) {
    e.preventDefault(); e.stopPropagation();
    joystickActive = true; joystickPointerId = e.pointerId;
    try { joystickEl.setPointerCapture(e.pointerId); } catch (err) {}
    updateJoystickPos(e);
  });
  joystickEl.addEventListener('pointermove', function (e) {
    if (!joystickActive || e.pointerId !== joystickPointerId) return;
    e.preventDefault(); updateJoystickPos(e);
  });
  joystickEl.addEventListener('pointerup', function (e) {
    if (!joystickActive || e.pointerId !== joystickPointerId) return;
    resetJoystick();
  });
  joystickEl.addEventListener('pointercancel', resetJoystick);

  /* ============ Action buttons ============ */
  const btnBuild = document.getElementById('btn-build');
  const btnDestroy = document.getElementById('btn-destroy');
  const btnJump = document.getElementById('btn-jump');
  function bindTap(el, fn) {
    el.addEventListener('pointerdown', function (e) { e.preventDefault(); e.stopPropagation(); fn(); });
  }
  bindTap(btnBuild, buildBlock);
  bindTap(btnDestroy, destroyBlock);
  bindTap(btnJump, doJump);

  /* ============ Start / canvas input ============ */
  const startScreen = document.getElementById('start-screen');
  const crosshair = document.getElementById('crosshair');
  let started = false, consumeNextTap = false;

  function begin() {
    if (started) return;
    started = true;
    startScreen.classList.add('hidden');
    crosshair.classList.add('visible');
    joystickEl.classList.add('active');
    btnBuild.classList.add('active');
    btnDestroy.classList.add('active');
    btnJump.classList.add('active');
    warmUpKeyboard();
    initialChunks();
    tryEnableGyro();
    camera.position.set(playerPos.x, playerPos.y + EYE_HEIGHT, playerPos.z);
    setTimeout(function () {
      if (!gotOrientation && !gyroOn) { gyroOn = false; gyroFailed = true; lookMode = true; }
    }, 2500);
  }
  startScreen.addEventListener('pointerdown', begin);

  let pointerInfo = null;

  canvas.addEventListener('pointerdown', function (e) {
    if (!started) return;
    if (editingWin) { commitEdit(); consumeNextTap = true; return; }
    pointerInfo = {
      id: e.pointerId, lastX: e.clientX, lastY: e.clientY,
      moved: 0, t: performance.now()
    };
    if (lookMode && canvas.setPointerCapture) {
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    }
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!pointerInfo || e.pointerId !== pointerInfo.id) return;
    const dx = e.clientX - pointerInfo.lastX;
    const dy = e.clientY - pointerInfo.lastY;
    pointerInfo.lastX = e.clientX; pointerInfo.lastY = e.clientY;
    pointerInfo.moved += Math.abs(dx) + Math.abs(dy);
    if (lookMode && !mode && !editingWin) {
      lookYaw -= dx * 0.0045;
      lookPitch -= dy * 0.0045;
      lookPitch = Math.max(-1.25, Math.min(1.25, lookPitch));
    }
  });
  canvas.addEventListener('pointerup', function (e) {
    if (consumeNextTap) { consumeNextTap = false; pointerInfo = null; return; }
    if (!pointerInfo || e.pointerId !== pointerInfo.id) { pointerInfo = null; return; }
    const info = pointerInfo;
    pointerInfo = null;
    if (!started) return;
    if (performance.now() - lastEditEnd < 300) return;
    if (info.moved < 12 && performance.now() - info.t < 700) {
      if (mode) { mode = null; hideModeVisuals(); }
      else if (!editingWin) createWindowCenter();
    }
  });
  canvas.addEventListener('pointercancel', function () { pointerInfo = null; });

  /* ============ Render loop ============ */
  let lastTime = performance.now();
  function render(now) {
    requestAnimationFrame(render);
    const t = (typeof now === 'number') ? now : performance.now();
    const dt = Math.min(0.05, Math.max(0, (t - lastTime) / 1000));
    lastTime = t;
    if (gyroOn) applyGyro();
    else if (lookMode) applyLook();
    if (started) {
      updatePlayer(dt);
      updateChunks();
      updateWindowVisibility();
      updateHover(dt);
      updateMode(dt);
    } else {
      camera.position.set(playerPos.x, playerPos.y + EYE_HEIGHT, playerPos.z);
    }
    renderer.render(scene, camera);
  }

  resize();
  setTimeout(resize, 50);
  setTimeout(resize, 200);
  setTimeout(resize, 800);
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
