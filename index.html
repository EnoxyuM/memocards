<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>360</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
  }
  #pano-canvas {
    display: block;
    width: 100%; height: 100%;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="pano-canvas"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';

  if (typeof THREE === 'undefined') {
    console.error('[pano] Three.js не загрузился');
    return;
  }

  /* ============================================================
     Тестовая equirect-панорама: 4 цветные стороны + подписи
     u=0   BACK    зелёный
     u=0.25 LEFT   жёлтый
     u=0.5 FRONT   оранжевый (видно сразу)
     u=0.75 RIGHT  синий
     ============================================================ */
  function generateTestPano() {
    const W = 2048, H = 1024;
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');

    ctx.fillStyle = '#4CAF50'; ctx.fillRect(0,      0, W/4, H);
    ctx.fillStyle = '#FFEB3B'; ctx.fillRect(W/4,    0, W/4, H);
    ctx.fillStyle = '#FF5722'; ctx.fillRect(W/2,    0, W/4, H);
    ctx.fillStyle = '#2196F3'; ctx.fillRect(3*W/4,  0, W/4, H);

    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 2;
    for (let i = 0; i <= 8; i++) {
      ctx.beginPath(); ctx.moveTo(i*W/8, 0); ctx.lineTo(i*W/8, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i*H/8); ctx.lineTo(W, i*H/8); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(0, H/2); ctx.lineTo(W, H/2); ctx.stroke();

    ctx.font = 'bold 140px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 8;
    ctx.strokeStyle = 'black';
    [
      ['FRONT',  W/2,   H/2],
      ['LEFT',   W/4,   H/2],
      ['RIGHT',  3*W/4, H/2],
      ['BACK',   0,     H/2],
      ['BACK',   W,     H/2],
      ['TOP',    W/2,   H*0.10],
      ['BOTTOM', W/2,   H*0.90]
    ].forEach(function (l) {
      ctx.strokeText(l[0], l[1], l[2]);
      ctx.fillStyle = 'white';
      ctx.fillText(l[0], l[1], l[2]);
    });

    return cv;
  }

  /* ============================================================
     Three.js
     ============================================================ */
  const canvas = document.getElementById('pano-canvas');
  const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

  const scene  = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1100);
  camera.rotation.order = 'YXZ';

  const tex = new THREE.CanvasTexture(generateTestPano());
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;

  const sphere = new THREE.Mesh(
    new THREE.SphereGeometry(500, 60, 40),
    new THREE.MeshBasicMaterial({ map: tex, side: THREE.BackSide })
  );
  // чтобы u=0.5 (FRONT, оранжевый) смотрел прямо перед камерой
  sphere.rotation.y = Math.PI / 2;
  scene.add(sphere);

  /* ============================================================
     Resize
     ============================================================ */
  function resize() {
    let w = canvas.clientWidth  || window.innerWidth;
    let h = canvas.clientHeight || window.innerHeight;
    if (w < 10) w = window.innerWidth;
    if (h < 10) h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () {
    setTimeout(resize, 250);
  });

  /* ============================================================
     Drag (работает, пока гироскоп не включён)
     ============================================================ */
  let lon = 0, lat = 0;
  let lonStart = 0, latStart = 0;
  let dragging = false, sx = 0, sy = 0;
  const MAXLAT = Math.PI / 2 - 0.01;

  function clampLat() {
    if (lat >  MAXLAT) lat =  MAXLAT;
    if (lat < -MAXLAT) lat = -MAXLAT;
  }

  function onStart(x, y) {
    if (gyroEnabled) return;
    dragging = true;
    sx = x; sy = y;
    lonStart = lon; latStart = lat;
  }
  function onMove(x, y) {
    if (!dragging || gyroEnabled) return;
    lon = lonStart - (x - sx) * 0.005;
    lat = latStart - (y - sy) * 0.005;
    clampLat();
  }
  function onEnd() { dragging = false; }

  canvas.addEventListener('touchstart', function (e) {
    tryEnableGyro();
    if (e.touches.length === 1) onStart(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
  canvas.addEventListener('touchmove', function (e) {
    if (e.touches.length === 1) onMove(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
  canvas.addEventListener('touchend',    onEnd);
  canvas.addEventListener('touchcancel', onEnd);

  canvas.addEventListener('mousedown', function (e) {
    tryEnableGyro();
    onStart(e.clientX, e.clientY);
  });
  window.addEventListener('mousemove', function (e) { onMove(e.clientX, e.clientY); });
  window.addEventListener('mouseup',   onEnd);

  /* ============================================================
     Гироскоп — включается на первом тапе
     ============================================================ */
  let gyroEnabled = false;
  let gyroTried   = false;
  let gotGyroData = false;

  const dev = { alpha: 0, beta: 0, gamma: 0 };
  let screenOrient = window.orientation || 0;

  window.addEventListener('deviceorientation', function (e) {
    if (e.alpha == null && e.beta == null && e.gamma == null) return;
    dev.alpha = e.alpha || 0;
    dev.beta  = e.beta  || 0;
    dev.gamma = e.gamma || 0;
    gotGyroData = true;
  });
  window.addEventListener('orientationchange', function () {
    screenOrient = window.orientation || 0;
  });

  const DEG = Math.PI / 180;
  const zee    = new THREE.Vector3(0, 0, 1);
  const _euler = new THREE.Euler();
  const q0     = new THREE.Quaternion();
  const q1     = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));

  function applyGyro() {
    const a = dev.alpha * DEG;
    const b = dev.beta  * DEG;
    const g = dev.gamma * DEG;
    const o = screenOrient * DEG;

    _euler.set(b, a, -g, 'YXZ');
    camera.quaternion.setFromEuler(_euler);
    camera.quaternion.multiply(q1);
    camera.quaternion.multiply(q0.setFromAxisAngle(zee, -o));
  }

  function tryEnableGyro() {
    if (gyroTried) return;
    gyroTried = true;

    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      // iOS 13+
      DeviceOrientationEvent.requestPermission().then(function (p) {
        if (p === 'granted') {
          gyroEnabled = true;
          // если данные так и не пришли (нет гироскопа) — откатываемся на drag
          setTimeout(function () {
            if (!gotGyroData) gyroEnabled = false;
          }, 1200);
        }
      }).catch(function () { /* пользователь отказал — остаёмся на drag */ });
    } else {
      // Android / desktop
      gyroEnabled = true;
      setTimeout(function () {
        if (!gotGyroData) gyroEnabled = false;
      }, 1200);
    }
  }

  /* ============================================================
     Рендер-цикл
     ============================================================ */
  function render() {
    requestAnimationFrame(render);

    if (gyroEnabled) {
      applyGyro();
    } else {
      camera.rotation.y = lon;
      camera.rotation.x = lat;
    }

    renderer.render(scene, camera);
  }

  /* ============================================================
     Старт
     ============================================================ */
  resize();
  setTimeout(resize, 50);
  setTimeout(resize, 200);
  setTimeout(resize, 800);
  render();
})();
</script>
</body>
</html>
