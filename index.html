<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Флеш-карточки с гироскопом</title>
  <style>
    :root {
      color-scheme: light dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 16px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .wrapper {
      width: min(640px, 100%);
      display: grid;
      gap: 12px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: 1.35rem;
    }

    .counter {
      opacity: 0.7;
      font-variant-numeric: tabular-nums;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      border: 1px solid #d1d5db;
      background: #fff;
      color: #111827;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 1rem;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:active {
      transform: translateY(1px);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      min-height: 1.4em;
      font-size: 0.95rem;
      opacity: 0.85;
    }

    .card {
      perspective: 1200px;
      height: min(62vh, 430px);
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .card-inner.flipped {
      transform: rotateY(180deg);
    }

    .face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: grid;
      place-items: center;
      padding: 24px;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgb(0 0 0 / 0.12);
      background: #fff;
      font-size: clamp(1.4rem, 4.5vw, 2.4rem);
      line-height: 1.25;
      text-align: center;
      overflow: auto;
    }

    .face.back {
      transform: rotateY(180deg);
      background: #111827;
      color: #f9fafb;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .hint {
      margin: 0;
      font-size: 0.9rem;
      opacity: 0.65;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #020617;
        color: #e2e8f0;
      }

      button {
        background: #0f172a;
        border-color: #334155;
        color: #e2e8f0;
      }

      .face {
        background: #0f172a;
        color: #e2e8f0;
      }

      .face.back {
        background: #e2e8f0;
        color: #0f172a;
      }
    }
  </style>
</head>
<body>
  <main class="wrapper">
    <header class="topbar">
      <h1>Флеш-карточки</h1>
      <div id="counter" class="counter"></div>
    </header>

    <div class="toolbar">
      <button id="enableBtn" type="button">Включить сенсоры</button>
      <button id="calibrateBtn" type="button" disabled>Центр</button>
    </div>

    <div id="status" class="status">
      Сенсоры выключены. Нажмите «Включить сенсоры», затем разрешите доступ, если браузер спросит.
    </div>

    <section class="card" aria-live="polite">
      <div class="card-inner" id="cardInner">
        <div class="face front" id="front"></div>
        <div class="face back" id="back"></div>
      </div>
    </section>

    <div class="controls">
      <button id="prevBtn" type="button">Назад</button>
      <button id="flipBtn" type="button">Перевернуть</button>
      <button id="nextBtn" type="button">Вперёд</button>
    </div>

    <p class="hint">
      Встряхивание переворачивает карточку. Наклон вправо/влево переключает карточки.
      Если срабатывает слишком часто, увеличьте пороги в коде.
    </p>
  </main>

  <script>
    "use strict";

    const cards = [
      { q: "Столица Франции?", a: "Париж" },
      { q: "2 + 2", a: "4" },
      { q: "Самая большая планета Солнечной системы", a: "Юпитер" },
      { q: "Скорость света примерно", a: "300 000 км/с" }
    ];

    const frontEl = document.getElementById("front");
    const backEl = document.getElementById("back");
    const cardInnerEl = document.getElementById("cardInner");
    const statusEl = document.getElementById("status");
    const counterEl = document.getElementById("counter");
    const enableBtn = document.getElementById("enableBtn");
    const calibrateBtn = document.getElementById("calibrateBtn");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const flipBtn = document.getElementById("flipBtn");

    let index = 0;
    let flipped = false;
    let sensorsEnabled = false;

    let latestGamma = 0;
    let latestBeta = 0;
    let baseGamma = null;
    let baseBeta = null;

    let tiltArmed = true;
    let lastTiltAt = 0;
    let lastShakeAt = 0;

    let gotOrientation = false;
    let gotMotion = false;

    const TILT_THRESHOLD = 25;
    const TILT_RESET_THRESHOLD = 10;
    const TILT_COOLDOWN_MS = 700;

    const SHAKE_ACCEL_THRESHOLD = 11;
    const SHAKE_GRAVITY_DEVIATION_THRESHOLD = 8;
    const SHAKE_COOLDOWN_MS = 900;

    function vibrate(ms = 18) {
      if ("vibrate" in navigator) navigator.vibrate(ms);
    }

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function render() {
      frontEl.textContent = cards[index].q;
      backEl.textContent = cards[index].a;
      counterEl.textContent = `${index + 1}/${cards.length}`;
      cardInnerEl.classList.toggle("flipped", flipped);
    }

    function goTo(newIndex) {
      index = (newIndex + cards.length) % cards.length;
      flipped = false;
      render();
    }

    function flipCard() {
      flipped = !flipped;
      cardInnerEl.classList.toggle("flipped", flipped);
      vibrate();
    }

    function nextCard() {
      goTo(index + 1);
      vibrate();
    }

    function prevCard() {
      goTo(index - 1);
      vibrate();
    }

    function normalizeAngle(value) {
      let a = value;
      while (a > 180) a -= 360;
      while (a < -180) a += 360;
      return a;
    }

    function onOrientation(event) {
      if (!sensorsEnabled) return;
      gotOrientation = true;

      if (typeof event.gamma !== "number" || typeof event.beta !== "number") return;

      latestGamma = event.gamma;
      latestBeta = event.beta;

      if (baseGamma === null || baseBeta === null) {
        baseGamma = latestGamma;
        baseBeta = latestBeta;
        setStatus("Данные ориентации получены. Если нужно, нажмите «Центр».");
        return;
      }

      const isLandscape = window.matchMedia("(orientation: landscape)").matches;
      const raw = isLandscape ? latestBeta - baseBeta : latestGamma - baseGamma;
      const tilt = normalizeAngle(raw);
      const now = Date.now();

      if (tiltArmed && now - lastTiltAt > TILT_COOLDOWN_MS) {
        if (tilt > TILT_THRESHOLD) {
          nextCard();
          tiltArmed = false;
          lastTiltAt = now;
          setStatus("Наклон вправо: следующая карточка");
        } else if (tilt < -TILT_THRESHOLD) {
          prevCard();
          tiltArmed = false;
          lastTiltAt = now;
          setStatus("Наклон влево: предыдущая карточка");
        }
      }

      if (Math.abs(tilt) < TILT_RESET_THRESHOLD) {
        tiltArmed = true;
      }
    }

    function onMotion(event) {
      if (!sensorsEnabled) return;
      gotMotion = true;

      const now = Date.now();
      if (now - lastShakeAt < SHAKE_COOLDOWN_MS) return;

      const acc = event.acceleration;
      if (acc && acc.x !== null && acc.y !== null && acc.z !== null) {
        const magnitude = Math.hypot(acc.x, acc.y, acc.z);
        if (magnitude > SHAKE_ACCEL_THRESHOLD) {
          lastShakeAt = now;
          flipCard();
          setStatus("Встряхивание: переворот");
          return;
        }
      }

      const g = event.accelerationIncludingGravity;
      if (g && g.x !== null && g.y !== null && g.z !== null) {
        const magnitude = Math.hypot(g.x, g.y, g.z);
        const deviation = Math.abs(magnitude - 9.81);
        if (deviation > SHAKE_GRAVITY_DEVIATION_THRESHOLD) {
          lastShakeAt = now;
          flipCard();
          setStatus("Встряхивание: переворот");
        }
      }
    }

    async function requestSensorPermissions() {
      const requests = [];

      if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
        requests.push(DeviceOrientationEvent.requestPermission());
      }

      if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function") {
        requests.push(DeviceMotionEvent.requestPermission());
      }

      if (requests.length === 0) return true;

      const results = await Promise.all(requests);
      return results.every((result) => result === "granted");
    }

    async function enableSensors() {
      setStatus("Запрашиваем доступ к сенсорам...");

      try {
        const granted = await requestSensorPermissions();
        if (!granted) {
          setStatus("Доступ к сенсорам не разрешён. Разрешите доступ в настройках сайта/браузера.");
          return;
        }
      } catch (error) {
        setStatus(`Ошибка доступа к сенсорам: ${error.message || error}`);
        return;
      }

      if (!("DeviceOrientationEvent" in window) && !("DeviceMotionEvent" in window)) {
        setStatus("Браузер не поддерживает DeviceOrientation/DeviceMotion. Кнопки ручного управления остаются рабочими.");
        return;
      }

      window.addEventListener("deviceorientation", onOrientation);
      window.addEventListener("devicemotion", onMotion);

      sensorsEnabled = true;
      enableBtn.disabled = true;
      calibrateBtn.disabled = false;
      setStatus("Сенсоры включены. Держите телефон удобно и нажмите «Центр», если нужно.");

      setTimeout(() => {
        if (!sensorsEnabled) return;

        if (!gotOrientation && !gotMotion) {
          setStatus("События сенсоров не приходят. Проверьте доступ к датчикам и откройте страницу по HTTPS.");
        } else if (!gotOrientation) {
          setStatus("Движение определяется, но наклон не приходит. Наклон может быть недоступен в этом браузере.");
        } else if (!gotMotion) {
          setStatus("Наклон работает, но события движения не приходят. Встряхивание может быть недоступно.");
        }
      }, 2500);
    }

    enableBtn.addEventListener("click", enableSensors);

    calibrateBtn.addEventListener("click", () => {
      if (!gotOrientation) {
        setStatus("Данные ориентации ещё не получены.");
        return;
      }

      baseGamma = latestGamma;
      baseBeta = latestBeta;
      tiltArmed = true;
      setStatus("Нейтральное положение сохранено.");
    });

    window.addEventListener("orientationchange", () => {
      if (!sensorsEnabled) return;
      baseGamma = latestGamma;
      baseBeta = latestBeta;
      tiltArmed = true;
      setStatus("Ориентация экрана изменилась. При необходимости нажмите «Центр».");
    });

    prevBtn.addEventListener("click", prevCard);
    nextBtn.addEventListener("click", nextCard);
    flipBtn.addEventListener("click", flipCard);

    render();
  </script>
</body>
</html>
