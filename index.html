<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=overlays-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AR Windows</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
    touch-action: none;
    -webkit-text-size-adjust: 100%;
  }
  body.xr-mode { background: transparent; }

  #camera-feed {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 0;
    display: none;
    background: #000;
    pointer-events: none;
  }
  #pano-canvas {
    position: fixed; inset: 0;
    display: block; width: 100%; height: 100%;
    z-index: 1;
    touch-action: none;
    background: transparent;
  }
  #start-screen {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: #0a0e14; color: #5ad0ff;
    font: 600 30px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    letter-spacing: 0.08em;
    text-shadow: 0 0 20px rgba(90, 208, 255, 0.55);
    cursor: pointer; transition: opacity 0.45s ease;
    text-align: center;
    padding: 0 24px;
    box-sizing: border-box;
  }
  #start-screen.hidden { opacity: 0; pointer-events: none; }
  #start-title { font-size: 30px; }
  #start-sub {
    font-size: 14px; font-weight: 500; margin-top: 14px;
    color: #8fe4ff; letter-spacing: 0.04em;
    text-shadow: none;
  }
  #start-version {
    font: 500 12px/1.2 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    margin-top: 22px; color: #4aa9d0; letter-spacing: 0.05em;
    text-shadow: none;
  }
  #start-mode {
    font-size: 13px; font-weight: 500; margin-top: 26px;
    color: #a0b6c4; letter-spacing: 0.03em;
    text-shadow: none;
    max-width: 340px; line-height: 1.5;
  }
  #start-mode .warn { color: #ffb060; }
  #start-mode .err  { color: #ff7a7a; }

  #crosshair {
    position: fixed; left: 50%; top: 50%;
    width: 22px; height: 22px; margin: -11px 0 0 -11px;
    z-index: 10; pointer-events: none; opacity: 0; transition: opacity 0.4s ease;
  }
  #crosshair.visible { opacity: 1; }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: #8fe4ff;
    box-shadow: 0 0 6px rgba(90, 208, 255, 0.9); border-radius: 1px;
  }
  #crosshair::before { left: 10px; top: 0; width: 2px; height: 22px; }
  #crosshair::after  { top: 10px; left: 0; width: 22px; height: 2px; }

  #hud {
    position: fixed;
    top: calc(10px + env(safe-area-inset-top, 0px));
    left: calc(10px + env(safe-area-inset-left, 0px));
    z-index: 25;
    color: #8fe4ff;
    font: 500 10px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    letter-spacing: 0.03em;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s ease;
    text-shadow: 0 0 2px #000, 0 0 4px #000, 0 0 8px rgba(90, 208, 255, 0.4);
    background: rgba(0, 0, 0, 0.35);
    padding: 6px 9px;
    border-radius: 6px;
    border: 1px solid rgba(90, 208, 255, 0.2);
    white-space: pre;
  }
  #hud.visible { opacity: 1; }
  #hud .good { color: #7fff9a; }
  #hud .warn { color: #ffb060; }
  #hud .bad  { color: #ff7a7a; }

  #burger-btn {
    position: fixed;
    top: calc(12px + env(safe-area-inset-top, 0px));
    right: calc(12px + env(safe-area-inset-right, 0px));
    width: 44px; height: 44px;
    z-index: 30;
    background: rgba(10, 14, 20, 0.72);
    border: 1.5px solid rgba(90, 208, 255, 0.55);
    border-radius: 10px;
    padding: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 4px;
    cursor: pointer;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  #burger-btn.active { display: flex; }
  #burger-btn:active { background: rgba(90, 208, 255, 0.28); }
  #burger-btn span {
    display: block;
    width: 20px; height: 2px;
    background: #8fe4ff;
    border-radius: 1px;
    box-shadow: 0 0 4px rgba(90, 208, 255, 0.6);
  }

  #burger-menu {
    position: fixed;
    top: calc(64px + env(safe-area-inset-top, 0px));
    right: calc(12px + env(safe-area-inset-right, 0px));
    width: 260px;
    max-width: calc(100vw - 24px);
    z-index: 31;
    background: rgba(10, 14, 20, 0.94);
    border: 1.5px solid rgba(90, 208, 255, 0.55);
    border-radius: 12px;
    padding: 14px 16px 16px;
    box-sizing: border-box;
    color: #c8d8e0;
    font: 500 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 0 16px rgba(90, 208, 255, 0.15);
    display: none;
  }
  #burger-menu.open { display: block; }
  #burger-menu .menu-title {
    font: 600 11px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: #5ad0ff;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  #burger-menu .menu-label {
    display: block;
    font-size: 12px;
    color: #a8c0d0;
    margin-bottom: 10px;
  }
  #burger-menu .row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #burger-menu input[type="range"] {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    background: rgba(90, 208, 255, 0.22);
    border-radius: 2px;
    outline: none;
    min-width: 0;
    margin: 0;
  }
  #burger-menu input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px; height: 18px;
    background: #5ad0ff;
    border-radius: 50%;
    border: 2px solid #0d0d11;
    box-shadow: 0 0 8px rgba(90, 208, 255, 0.8);
    cursor: pointer;
  }
  #burger-menu input[type="range"]::-moz-range-thumb {
    width: 18px; height: 18px;
    background: #5ad0ff;
    border-radius: 50%;
    border: 2px solid #0d0d11;
    box-shadow: 0 0 8px rgba(90, 208, 255, 0.8);
    cursor: pointer;
  }
  #burger-menu input[type="number"] {
    width: 64px;
    padding: 6px 8px;
    background: rgba(90, 208, 255, 0.08);
    border: 1.5px solid rgba(90, 208, 255, 0.4);
    border-radius: 6px;
    color: #e9f8ff;
    font: 500 13px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    text-align: center;
    outline: none;
    box-sizing: border-box;
    -moz-appearance: textfield;
  }
  #burger-menu input[type="number"]::-webkit-inner-spin-button,
  #burger-menu input[type="number"]::-webkit-outer-spin-button {
    -webkit-appearance: none; margin: 0;
  }
  #burger-menu input[type="number"]:focus {
    border-color: #5ad0ff;
    box-shadow: 0 0 8px rgba(90, 208, 255, 0.4);
  }
</style>
</head>
<body>
<video id="camera-feed" autoplay playsinline muted></video>
<canvas id="pano-canvas"></canvas>
<div id="crosshair"></div>
<div id="hud"></div>
<button id="burger-btn" aria-label="Menu">
  <span></span><span></span><span></span>
</button>
<div id="burger-menu">
  <div class="menu-title">Settings</div>
  <label class="menu-label">Button Time</label>
  <div class="row">
    <input type="range" id="btn-time-slider" min="0.1" max="2" step="0.05" value="0.5">
    <input type="number" id="btn-time-input" min="0.1" max="2" step="0.05" value="0.5">
  </div>
</div>
<div id="start-screen">
  <div id="start-title">Tap to Start.</div>
  <div id="start-sub">AR Windows</div>
  <div id="start-version">v1.6.5</div>
  <div id="start-mode">Определяем поддержку AR…</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';
  if (typeof THREE === 'undefined') { console.error('[pano] Three.js не загрузился'); return; }

  /* ============================================================
     VERSION
     ============================================================ */
  const VERSION = '1.6.5';
  document.getElementById('start-version').textContent = 'v' + VERSION;

  const DEG = Math.PI / 180;

  const isMobile = (function () {
    if (/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) return true;
    if (navigator.maxTouchPoints > 0 && window.matchMedia('(pointer: coarse)').matches) return true;
    return false;
  })();

  const DPR_CAP = isMobile ? 1.5 : 2;

  /* ============================================================
     Renderer / Scene / Camera
     ============================================================ */
  const canvas = document.getElementById('pano-canvas');
  const videoEl = document.getElementById('camera-feed');
  const hudEl = document.getElementById('hud');
  const startModeEl = document.getElementById('start-mode');

  const renderer = new THREE.WebGLRenderer({
    canvas: canvas,
    antialias: !isMobile,
    powerPreference: 'high-performance',
    stencil: false,
    depth: true,
    alpha: true
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, DPR_CAP));
  renderer.setClearColor(0x000000, 0);

  canvas.addEventListener('webglcontextlost', function () {
    console.warn('[gl] context lost');
  }, false);
  canvas.addEventListener('webglcontextrestored', function () {
    console.warn('[gl] context restored');
  }, false);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, 1, 0.05, 2000);

  /* ============================================================
     Global AR state
     ============================================================ */
  let xrMode = false;
  let xrSession = null;
  let hitTestSource = null;
  let lastHitPose = null;
  let reticle = null;
  let activeRefSpaceType = '—';
  let xrViewerPosChanges = 0;

  const _xrViewerPos = new THREE.Vector3();
  const _xrViewerQuat = new THREE.Quaternion();
  const _xrPrevViewerPos = new THREE.Vector3(Infinity, Infinity, Infinity);
  const _tmpM4 = new THREE.Matrix4();

  const EYE_HEIGHT = 1.55;
  const REACH = 6;
  const playerPos = new THREE.Vector3(0, 0, 0);

  const _camDir = new THREE.Vector3();
  function getCamDir() { camera.getWorldDirection(_camDir); return _camDir; }
  function getEye() {
    return new THREE.Vector3(playerPos.x, playerPos.y + EYE_HEIGHT, playerPos.z);
  }
  function getCurrentEye() {
    if (xrMode) return _xrViewerPos.clone();
    return getEye();
  }
  function getCurrentDir() {
    if (xrMode) return new THREE.Vector3(0, 0, -1).applyQuaternion(_xrViewerQuat).normalize();
    return getCamDir().clone();
  }

  /* ============================================================
     UI tap tracking
     ============================================================ */
  let uiTapTime = 0;
  const UI_TAP_GUARD_MS = 250;
  function markUITap() { uiTapTime = performance.now(); }
  function recentUITap() { return performance.now() - uiTapTime < UI_TAP_GUARD_MS; }

  /* ============================================================
     Editing guard
     ============================================================ */
  let lastEditEnd = 0;
  function recentlyEdited() {
    if (editingWin) return true;
    if (performance.now() - lastEditEnd < 500) return true;
    return false;
  }

  /* ============================================================
     Settings
     ============================================================ */
  const burgerBtn = document.getElementById('burger-btn');
  const burgerMenu = document.getElementById('burger-menu');
  const btnTimeSlider = document.getElementById('btn-time-slider');
  const btnTimeInput = document.getElementById('btn-time-input');

  let buttonHoldTime = 0.5;

  function applyButtonTime(v) {
    if (!isFinite(v)) return;
    v = Math.max(0.1, Math.min(2, v));
    buttonHoldTime = v;
    if (btnTimeSlider.value !== String(v)) btnTimeSlider.value = v;
    const displayVal = v.toFixed(2);
    if (btnTimeInput.value !== displayVal && btnTimeInput !== document.activeElement) {
      btnTimeInput.value = displayVal;
    }
    for (let i = 0; i < windows.length; i++) {
      const w = windows[i];
      for (const id in w.buttons) {
        w.buttons[id].progress = 0;
        w.buttons[id].armed = true;
        w.buttons[id].ring.visible = false;
        w.buttons[id].prog.visible = false;
        w.buttons[id].prog.scale.setScalar(0.0001);
      }
    }
  }

  btnTimeSlider.addEventListener('input', function () {
    applyButtonTime(parseFloat(btnTimeSlider.value));
  });
  btnTimeInput.addEventListener('input', function () {
    const v = parseFloat(btnTimeInput.value);
    if (isFinite(v) && v >= 0.1 && v <= 2) {
      buttonHoldTime = v;
      btnTimeSlider.value = v;
    }
  });
  btnTimeInput.addEventListener('blur', function () {
    const v = parseFloat(btnTimeInput.value);
    if (!isFinite(v)) { btnTimeInput.value = buttonHoldTime.toFixed(2); return; }
    applyButtonTime(v);
    btnTimeInput.value = buttonHoldTime.toFixed(2);
  });
  btnTimeInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); btnTimeInput.blur(); }
  });

  function setMenuOpen(open) {
    burgerMenu.classList.toggle('open', open);
    burgerBtn.classList.toggle('open', open);
  }
  function isMenuOpen() { return burgerMenu.classList.contains('open'); }

  burgerBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    markUITap();
    setMenuOpen(!isMenuOpen());
  });

  document.addEventListener('pointerdown', function (e) {
    if (burgerBtn.contains(e.target) || burgerMenu.contains(e.target) || (editInput && editInput.contains(e.target))) {
      markUITap();
    }
    if (!isMenuOpen()) return;
    if (burgerBtn.contains(e.target)) return;
    if (burgerMenu.contains(e.target)) return;
    markUITap();
    setMenuOpen(false);
  }, true);

  /* ============================================================
     Camera feed (fallback)
     ============================================================ */
  function updateVideoFit() {
    if (!videoEl.videoWidth || !videoEl.videoHeight) return;
    const va = videoEl.videoWidth / videoEl.videoHeight;
    const sa = window.innerWidth / window.innerHeight;
    const ratio = Math.max(va / sa, sa / va);
    videoEl.style.objectFit = ratio > 1.5 ? 'contain' : 'cover';
  }

  async function requestCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      console.warn('[camera] getUserMedia недоступен');
      return;
    }
    const sa = window.innerWidth / window.innerHeight;
    const tries = [
      { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 }, aspectRatio: { ideal: sa } }, audio: false },
      { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false },
      { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
      { video: { facingMode: 'environment' }, audio: false },
      { video: true, audio: false }
    ];
    for (let i = 0; i < tries.length; i++) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia(tries[i]);
        videoEl.srcObject = stream;
        videoEl.style.display = 'block';
        try { await videoEl.play(); } catch (e) {}
        updateVideoFit();
        return;
      } catch (err) {
        console.warn('[camera] попытка', i, 'не удалась:', err);
      }
    }
    console.warn('[camera] камера недоступна');
  }

  videoEl.addEventListener('loadedmetadata', updateVideoFit);
  videoEl.addEventListener('canplay', updateVideoFit);
  videoEl.addEventListener('pause', function () {
    if (!started) return;
    if (document.hidden) return;
    if (xrMode) return;
    videoEl.play().catch(function () {});
  });

  /* ============================================================
     Aim placement
     ============================================================ */
  function getAimPlacement() {
    if (xrMode) {
      if (lastHitPose) {
        _tmpM4.fromArray(lastHitPose.transform.matrix);
        const pos = new THREE.Vector3().setFromMatrixPosition(_tmpM4);
        const toCam = _xrViewerPos.clone().sub(pos).normalize();
        return { pos, normal: toCam.clone().negate(), attached: true };
      }
      const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(_xrViewerQuat).normalize();
      const pos = _xrViewerPos.clone().add(dir.clone().multiplyScalar(2));
      return { pos, normal: dir.clone().negate(), attached: false };
    }
    const eye = getEye();
    const dir = getCamDir().clone();
    const pos = eye.clone().add(dir.clone().multiplyScalar(REACH));
    const normal = dir.clone().negate().normalize();
    return { pos, normal, attached: false };
  }

  /* ============================================================
     Windows
     ============================================================ */
  const WIN_W = 0.55;
  const WIN_H = 0.4125;
  const TEX_W = 512, TEX_H = 384;
  const WINDOW_FONT = '500 36px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif';
  const BTN_IDS = ['close', 'move', 'resize', 'text', 'flip'];
  const BTN_SIZE = 64, BTN_TOP = 8, BTN_RIGHT = 8, BTN_GAP = 3;
  const BTN_Z = 0.001;
  const MAX_WIN_DIST = 60;

  function buttonRect(index) {
    const right = TEX_W - BTN_RIGHT - index * (BTN_SIZE + BTN_GAP);
    return { x: right - BTN_SIZE, y: BTN_TOP, w: BTN_SIZE, h: BTN_SIZE };
  }

  function palette(flipped) {
    return flipped ? {
      accent: '#ff7ec1', accentLight: '#ffb0d8',
      accentSoft: 'rgba(255, 126, 193, 0.10)',
      border: 'rgba(255, 126, 193, 0.50)',
      text: '#f5dce8', glow: 'rgba(255, 126, 193, 0.28)', hex: 0xff7ec1
    } : {
      accent: '#5ad0ff', accentLight: '#8fe4ff',
      accentSoft: 'rgba(90, 208, 255, 0.10)',
      border: 'rgba(90, 208, 255, 0.50)',
      text: '#c8d8e0', glow: 'rgba(90, 208, 255, 0.28)', hex: 0x5ad0ff
    };
  }

  function wrapText(ctx, text, maxWidth) {
    const paragraphs = String(text).split('\n');
    const lines = [];
    for (let i = 0; i < paragraphs.length; i++) {
      const p = paragraphs[i];
      if (p === '') { lines.push(''); continue; }
      const words = p.split(/\s+/).filter(function (w) { return w.length > 0; });
      let line = '';
      for (let j = 0; j < words.length; j++) {
        const word = words[j];
        const test = line ? line + ' ' + word : word;
        if (ctx.measureText(test).width <= maxWidth) { line = test; continue; }
        if (line) { lines.push(line); line = ''; }
        if (ctx.measureText(word).width > maxWidth) {
          let sub = '';
          for (let k = 0; k < word.length; k++) {
            const c = word[k];
            if (sub && ctx.measureText(sub + c).width > maxWidth) { lines.push(sub); sub = c; }
            else sub += c;
          }
          line = sub;
        } else {
          line = word;
        }
      }
      if (line) lines.push(line);
    }
    return lines;
  }

  function drawButtonIcon(ctx, r, id, flipped, p) {
    const cx = r.x + r.w / 2, cy = r.y + r.h / 2, rad = r.w / 2 - 2;
    ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2);
    ctx.fillStyle = p.accentSoft; ctx.fill();
    ctx.strokeStyle = p.accentLight; ctx.fillStyle = p.accentLight;
    ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const isz = rad * 0.52;
    if (id === 'close') {
      ctx.beginPath();
      ctx.moveTo(cx - isz, cy - isz); ctx.lineTo(cx + isz, cy + isz);
      ctx.moveTo(cx + isz, cy - isz); ctx.lineTo(cx - isz, cy + isz);
      ctx.stroke();
    } else if (id === 'move') {
      ctx.beginPath(); ctx.rect(cx - isz, cy - isz, isz * 2, isz * 2); ctx.stroke();
    } else if (id === 'resize') {
      ctx.beginPath();
      ctx.moveTo(cx, cy - isz * 1.05);
      ctx.lineTo(cx + isz * 1.05, cy + isz * 0.9);
      ctx.lineTo(cx - isz * 1.05, cy + isz * 0.9);
      ctx.closePath(); ctx.stroke();
    } else if (id === 'text') {
      ctx.beginPath(); ctx.arc(cx, cy, isz * 0.95, 0, Math.PI * 2); ctx.stroke();
    } else if (id === 'flip') {
      const spikes = 5, outer = isz * 1.15, inner = isz * 0.48;
      ctx.beginPath();
      for (let i = 0; i < spikes * 2; i++) {
        const rr = (i % 2 === 0) ? outer : inner;
        const a = -Math.PI / 2 + i * Math.PI / spikes;
        const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath();
      if (flipped) ctx.stroke(); else ctx.fill();
    }
  }

  function drawWindowFace(ctx, W, H, text, flipped) {
    const p = palette(flipped);
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0d0d11'; ctx.fillRect(0, 0, W, H);
    const g = ctx.createRadialGradient(W / 2, H / 2, 20, W / 2, H / 2, Math.max(W, H) * 0.7);
    g.addColorStop(0, p.glow); g.addColorStop(1, 'rgba(5, 5, 8, 0.0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = p.border; ctx.lineWidth = 2;
    ctx.strokeRect(1, 1, W - 2, H - 2);
    if (text) {
      ctx.font = WINDOW_FONT; ctx.fillStyle = p.text;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const lines = wrapText(ctx, text, W - 40).slice(0, 5);
      const lh = 38;
      const startY = H / 2 + 14 - (lines.length - 1) * lh / 2;
      for (let i = 0; i < lines.length; i++) ctx.fillText(lines[i], W / 2, startY + i * lh);
    }
    for (let i = 0; i < BTN_IDS.length; i++) drawButtonIcon(ctx, buttonRect(i), BTN_IDS[i], flipped, p);
  }

  const windows = [];
  let nextRenderOrder = 1;

  function makeWindow(text) {
    const group = new THREE.Group();
    const ro = nextRenderOrder; nextRenderOrder += 10;

    const cv = document.createElement('canvas');
    cv.width = TEX_W; cv.height = TEX_H;
    const ctx = cv.getContext('2d');
    const tex = new THREE.CanvasTexture(cv);
    tex.minFilter = THREE.LinearFilter; tex.magFilter = THREE.LinearFilter;

    const face = new THREE.Mesh(
      new THREE.PlaneGeometry(WIN_W, WIN_H),
      new THREE.MeshBasicMaterial({
        map: tex, transparent: true, side: THREE.DoubleSide,
        depthTest: true, depthWrite: false,
        polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1
      })
    );
    face.renderOrder = ro;
    group.add(face);

    const win = { group, face, ctx, tex, textFront: text || '', textBack: '', flipped: false, buttons: {} };

    for (let i = 0; i < BTN_IDS.length; i++) {
      const id = BTN_IDS[i];
      const r = buttonRect(i);
      const lx = ((r.x + r.w / 2) / TEX_W - 0.5) * WIN_W;
      const ly = (0.5 - (r.y + r.h / 2) / TEX_H) * WIN_H;
      const rad = (r.w / 2 / TEX_W) * WIN_W;

      const hit = new THREE.Mesh(
        new THREE.CircleGeometry(rad * 1.10, 24),
        new THREE.MeshBasicMaterial({ visible: false })
      );
      hit.position.set(lx, ly, BTN_Z);
      group.add(hit);

      const prog = new THREE.Mesh(
        new THREE.CircleGeometry(rad * 1.05, 24),
        new THREE.MeshBasicMaterial({
          color: 0x5ad0ff, transparent: true, opacity: 0.35,
          side: THREE.DoubleSide, depthTest: true, depthWrite: false
        })
      );
      prog.position.set(lx, ly, BTN_Z);
      prog.renderOrder = ro + 5;
      prog.visible = false;
      prog.scale.setScalar(0.0001);
      group.add(prog);

      const ring = new THREE.Mesh(
        new THREE.RingGeometry(rad * 1.05, rad * 1.30, 24),
        new THREE.MeshBasicMaterial({
          color: 0x5ad0ff, transparent: true, opacity: 0.95,
          side: THREE.DoubleSide, depthTest: true, depthWrite: false
        })
      );
      ring.position.set(lx, ly, BTN_Z);
      ring.renderOrder = ro + 6;
      ring.visible = false;
      group.add(ring);

      win.buttons[id] = { id, hit, ring, prog, progress: 0, armed: true };
    }

    refreshWindow(win);
    return win;
  }

  function refreshWindow(win) {
    const text = win.flipped ? win.textBack : win.textFront;
    drawWindowFace(win.ctx, TEX_W, TEX_H, text, win.flipped);
    win.tex.needsUpdate = true;
    const col = palette(win.flipped).hex;
    for (const id in win.buttons) {
      win.buttons[id].ring.material.color.setHex(col);
      win.buttons[id].prog.material.color.setHex(col);
    }
  }

  function orientWindowToPlacement(win, placement) {
    win.group.position.copy(placement.pos);
    const eye = getCurrentEye();
    const toEye = eye.clone().sub(placement.pos);
    if (toEye.lengthSq() < 1e-6) {
      toEye.copy(getCurrentDir()).negate();
    }
    toEye.normalize();
    win.group.lookAt(
      placement.pos.x + toEye.x,
      placement.pos.y + toEye.y,
      placement.pos.z + toEye.z
    );
  }

  function createWindowCenter() {
    const placement = getAimPlacement();
    const win = makeWindow('');
    orientWindowToPlacement(win, placement);
    scene.add(win.group);
    windows.push(win);
  }

  function removeWindow(win) {
    scene.remove(win.group);
    win.face.geometry.dispose();
    if (win.face.material.map) win.face.material.map.dispose();
    win.face.material.dispose();
    win.tex.dispose();
    for (const id in win.buttons) {
      const b = win.buttons[id];
      b.hit.geometry.dispose(); b.hit.material.dispose();
      b.ring.geometry.dispose(); b.ring.material.dispose();
      b.prog.geometry.dispose(); b.prog.material.dispose();
    }
    const i = windows.indexOf(win);
    if (i !== -1) windows.splice(i, 1);
    if (mode && mode.win === win) { mode = null; hideModeVisuals(); }
    if (editingWin === win) cancelEdit();
  }

  function updateWindowVisibility() {
    const eye = getCurrentEye();
    for (let i = 0; i < windows.length; i++) {
      const w = windows[i];
      w.group.visible = w.group.position.distanceTo(eye) <= MAX_WIN_DIST;
    }
  }

  /* ============================================================
     Hover / Raycasting
     ============================================================ */
  const raycaster = new THREE.Raycaster();
  const CENTER_NDC = new THREE.Vector2(0, 0);

  function setRayFromCenter() {
    if (xrMode) {
      raycaster.ray.origin.copy(_xrViewerPos);
      raycaster.ray.direction.set(0, 0, -1).applyQuaternion(_xrViewerQuat).normalize();
    } else {
      raycaster.setFromCamera(CENTER_NDC, camera);
    }
  }

  function getButtonUnderCrosshair() {
    if (!windows.length) return null;
    const hitsList = [];
    for (let i = 0; i < windows.length; i++) {
      const w = windows[i];
      if (!w.group.visible) continue;
      for (const id in w.buttons) hitsList.push(w.buttons[id].hit);
    }
    if (!hitsList.length) return null;
    setRayFromCenter();
    const hits = raycaster.intersectObjects(hitsList, false);
    if (!hits.length) return null;
    const obj = hits[0].object;
    for (let i = 0; i < windows.length; i++) {
      const w = windows[i];
      for (const id in w.buttons)
        if (w.buttons[id].hit === obj) return { win: w, btn: w.buttons[id], id: id };
    }
    return null;
  }

  function clearAllButtonVisuals() {
    for (let i = 0; i < windows.length; i++) {
      const w = windows[i];
      for (const id in w.buttons) {
        const b = w.buttons[id];
        b.progress = 0; b.armed = true;
        b.ring.visible = false; b.prog.visible = false;
        b.prog.scale.setScalar(0.0001);
      }
    }
  }

  function updateHover(dt) {
    if (mode || editingWin || isMenuOpen()) { clearAllButtonVisuals(); return; }
    const found = getButtonUnderCrosshair();

    for (let i = 0; i < windows.length; i++) {
      const w = windows[i];
      for (const id in w.buttons) {
        const b = w.buttons[id];
        const isFound = found && found.btn === b;
        if (!isFound) {
          b.progress = 0; b.armed = true;
          b.ring.visible = false; b.prog.visible = false;
          b.prog.scale.setScalar(0.0001);
        }
      }
    }

    if (!found) return;
    const b = found.btn;
    b.ring.visible = true;
    if (b.armed) {
      b.progress += dt / Math.max(0.05, buttonHoldTime);
      if (b.progress >= 1) { b.progress = 0; b.armed = false; fireButton(found.win, b.id); }
    }
    if (b.progress > 0.001) {
      b.prog.visible = true;
      b.prog.scale.setScalar(Math.max(0.0001, Math.min(1, b.progress)));
    } else b.prog.visible = false;
  }

  function fireButton(win, id) {
    if (id === 'close') removeWindow(win);
    else if (id === 'move') startMode('move', win);
    else if (id === 'resize') startMode('resize', win);
    else if (id === 'text') editText(win);
    else if (id === 'flip') { win.flipped = !win.flipped; refreshWindow(win); }
  }

  /* ============================================================
     Move / Resize
     ============================================================ */
  let mode = null;
  const MODE_TOL = 1.2 * DEG;
  const MODE_DURATION = 1.0;

  const modeRing = new THREE.Mesh(
    new THREE.RingGeometry(0.93, 1.0, 48),
    new THREE.MeshBasicMaterial({ color: 0x5ad0ff, transparent: true, opacity: 0.95, side: THREE.DoubleSide, depthTest: false, depthWrite: false })
  );
  modeRing.renderOrder = 40; modeRing.visible = false; scene.add(modeRing);

  const modeFill = new THREE.Mesh(
    new THREE.CircleGeometry(1, 48),
    new THREE.MeshBasicMaterial({ color: 0x5ad0ff, transparent: true, opacity: 0.25, side: THREE.DoubleSide, depthTest: false, depthWrite: false })
  );
  modeFill.renderOrder = 39; modeFill.visible = false; scene.add(modeFill);

  function hideModeVisuals() { modeRing.visible = false; modeFill.visible = false; }

  function startMode(type, win) {
    const dir = getCurrentDir();
    const eye = getCurrentEye();
    clearAllButtonVisuals();
    mode = {
      type, win,
      plantOrigin: eye.clone(),
      plantDir: dir.clone(),
      progress: 0, scaleT: 0,
      baseScale: win.group.scale.x || 1
    };
    const col = palette(win.flipped).hex;
    modeRing.material.color.setHex(col);
    modeFill.material.color.setHex(col);
    updateModeVisuals();
  }

  function updateModeVisuals(placement) {
    if (!mode) { hideModeVisuals(); return; }
    if (!placement) placement = getAimPlacement();
    const eye = getCurrentEye();
    const distToAim = placement.pos.distanceTo(eye);
    const R = Math.max(0.03, distToAim * Math.tan(MODE_TOL));

    modeRing.position.copy(placement.pos);
    modeRing.lookAt(eye);
    modeRing.scale.setScalar(R);
    modeRing.visible = true;

    const pr = Math.max(0, Math.min(1, mode.progress / MODE_DURATION));
    modeFill.position.copy(placement.pos);
    modeFill.lookAt(eye);
    modeFill.scale.setScalar(Math.max(0.0001, R * pr));
    modeFill.visible = pr > 0.001;
  }

  function updateMode(dt) {
    if (!mode) return;

    const eye = getCurrentEye();
    const dir = getCurrentDir();
    const placement = getAimPlacement();

    const aimAng = Math.acos(Math.max(-1, Math.min(1, mode.plantDir.dot(dir))));
    const eyeMoved = mode.plantOrigin.distanceTo(eye);
    const stable = aimAng <= MODE_TOL && eyeMoved <= 0.3;

    if (!stable) {
      mode.plantOrigin.copy(eye);
      mode.plantDir.copy(dir);
      mode.progress = 0;
    } else {
      mode.progress += dt;
    }

    if (mode.type === 'resize' && !stable) {
      mode.scaleT += dt;
      const s = mode.baseScale + Math.sin(mode.scaleT * 4) * 0.7;
      mode.win.group.scale.setScalar(Math.max(0.4, Math.min(2.5, s)));
    }

    updateModeVisuals(placement);

    if (mode.progress >= MODE_DURATION) {
      if (mode.type === 'move') {
        orientWindowToPlacement(mode.win, placement);
      }
      mode = null;
      hideModeVisuals();
    }
  }

  /* ============================================================
     Text input (textarea)
     ============================================================ */
  let editInput = null, editingWin = null;

  function ensureInput() {
    if (editInput) return editInput;
    editInput = document.createElement('textarea');
    editInput.id = 'window-text-input';
    editInput.autocomplete = 'off';
    editInput.spellcheck = false;
    editInput.setAttribute('autocorrect', 'off');
    editInput.setAttribute('autocapitalize', 'sentences');
    editInput.rows = 3;
    // Фиксированные размеры — чтобы показ/скрытие панели предсказаний GBoard
    // не вызывал reflow (и, как следствие, перерисовку DOM-слоя).
    Object.assign(editInput.style, {
      position: 'fixed',
      left: '50%',
      top: '72px',
      transform: 'translateX(-50%)',
      width: '380px',
      maxWidth: 'calc(100vw - 32px)',
      height: '180px',
      boxSizing: 'border-box',
      padding: '14px 18px',
      fontSize: '20px',
      fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif',
      background: '#0d0d11',
      color: '#e9f8ff',
      border: '2px solid #5ad0ff',
      borderRadius: '10px',
      boxShadow: '0 0 24px rgba(90,208,255,0.55)',
      zIndex: 100,
      outline: 'none',
      display: 'none',
      caretColor: '#5ad0ff',
      resize: 'none',
      lineHeight: '1.35',
      overflowY: 'auto'
    });
    document.body.appendChild(editInput);
    editInput.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { e.preventDefault(); cancelEdit(); }
    });
    editInput.addEventListener('blur', function () {
      setTimeout(function () {
        if (editingWin && document.activeElement !== editInput) commitEdit();
      }, 300);
    });
    return editInput;
  }

  let warmInput = null;
  function warmUpKeyboard() {
    if (warmInput) return;
    warmInput = document.createElement('input');
    warmInput.type = 'text'; warmInput.setAttribute('autocomplete', 'off');
    Object.assign(warmInput.style, {
      position: 'fixed', left: '50%', top: '0', width: '1px', height: '1px',
      padding: '0', border: 'none', outline: 'none', opacity: '0',
      pointerEvents: 'none', zIndex: -1
    });
    document.body.appendChild(warmInput);
    try { warmInput.focus(); } catch (e) {}
    setTimeout(function () { try { warmInput.blur(); } catch (e) {} }, 30);
  }

  function editText(win) {
    ensureInput();
    editingWin = win;
    const p = palette(win.flipped);
    editInput.style.borderColor = p.accent;
    editInput.style.boxShadow = '0 0 24px ' + (win.flipped ? 'rgba(255,126,193,0.55)' : 'rgba(90,208,255,0.55)');
    editInput.style.caretColor = p.accent;
    editInput.style.color = win.flipped ? '#f5dce8' : '#e9f8ff';
    editInput.value = win.flipped ? win.textBack : win.textFront;
    editInput.style.display = 'block';
    const tryFocus = function () {
      try {
        editInput.focus({ preventScroll: true });
        const len = editInput.value.length;
        editInput.setSelectionRange(len, len);
      } catch (e) {}
    };
    tryFocus();
    requestAnimationFrame(tryFocus);
    setTimeout(tryFocus, 20);
    setTimeout(tryFocus, 80);
    setTimeout(tryFocus, 200);
  }
  function commitEdit() {
    if (!editingWin || !editInput) return;
    const win = editingWin;
    editingWin = null;
    lastEditEnd = performance.now();
    const value = editInput.value;
    if (win.flipped) win.textBack = value; else win.textFront = value;
    refreshWindow(win);
    editInput.style.display = 'none';
    try { editInput.blur(); } catch (e) {}
    setTimeout(resize, 500);
  }
  function cancelEdit() {
    if (!editInput) return;
    editingWin = null;
    lastEditEnd = performance.now();
    editInput.style.display = 'none';
    try { editInput.blur(); } catch (e) {}
    setTimeout(resize, 500);
  }

  /* ============================================================
     Gyro / fallback orientation
     ============================================================ */
  let gyroOn = false, gyroFailed = false, requestInFlight = false, gotOrientation = false;
  const dev = { alpha: 0, beta: 0, gamma: 0 };
  let screenOrient = window.orientation || 0;

  window.addEventListener('deviceorientation', function (e) {
    if (e.alpha == null && e.beta == null && e.gamma == null) return;
    gotOrientation = true;
    dev.alpha = e.alpha || 0; dev.beta = e.beta || 0; dev.gamma = e.gamma || 0;
  });

  function tryEnableGyro() {
    if (gyroOn || requestInFlight || gyroFailed) return;
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      requestInFlight = true;
      DeviceOrientationEvent.requestPermission()
        .then(function (p) { requestInFlight = false; if (p === 'granted') gyroOn = true; else gyroFailed = true; })
        .catch(function () { requestInFlight = false; gyroFailed = true; });
    } else gyroOn = true;
  }

  const zee = new THREE.Vector3(0, 0, 1);
  const _euler = new THREE.Euler();
  const q0 = new THREE.Quaternion();
  const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));

  function applyGyro() {
    const a = dev.alpha * DEG, b = dev.beta * DEG, g = dev.gamma * DEG, o = screenOrient * DEG;
    _euler.set(b, a, -g, 'YXZ');
    camera.quaternion.setFromEuler(_euler);
    camera.quaternion.multiply(q1);
    camera.quaternion.multiply(q0.setFromAxisAngle(zee, -o));
  }

  let lookMode = false;
  let lookYaw = 0, lookPitch = 0;
  const _lookEuler = new THREE.Euler(0, 0, 0, 'YXZ');
  function applyLook() { _lookEuler.set(lookPitch, lookYaw, 0, 'YXZ'); camera.quaternion.setFromEuler(_lookEuler); }

  /* ============================================================
     Resize
     ============================================================ */
  let lastResizeW = 0, lastResizeH = 0;

  function resize() {
    if (renderer.xr.isPresenting) return;
    if (recentlyEdited()) return;

    let w = canvas.clientWidth || window.innerWidth;
    let h = canvas.clientHeight || window.innerHeight;
    if (w < 10) w = window.innerWidth;
    if (h < 10) h = window.innerHeight;

    if (Math.abs(w - lastResizeW) < 4 && Math.abs(h - lastResizeH) < 4) return;
    lastResizeW = w;
    lastResizeH = h;

    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, DPR_CAP));
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    updateVideoFit();
  }

  let resizeTimer = null;
  function scheduleResize() {
    if (recentlyEdited()) return;
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 100);
  }

  const startScreen = document.getElementById('start-screen');
  const crosshair = document.getElementById('crosshair');

  window.addEventListener('orientationchange', function () {
    screenOrient = window.orientation || 0;
    setTimeout(resize, 50);
    setTimeout(resize, 250);
    setTimeout(updateVideoFit, 300);
  });
  window.addEventListener('resize', scheduleResize);

  /* ============================================================
     HUD
     ============================================================ */
  function updateHUD() {
    if (!started) { hudEl.classList.remove('visible'); return; }
    if (recentlyEdited()) return;
    hudEl.classList.add('visible');
    const pos = xrMode ? _xrViewerPos : getEye();
    const moving = xrViewerPosChanges > 5;
    const hitStatus = xrMode
      ? (hitTestSource ? (lastHitPose ? 'HIT' : 'search') : 'n/a')
      : 'n/a';
    const modeStr = xrMode ? 'AR (6DoF)' : 'fallback (3DoF)';
    const posCls = xrMode ? (moving ? 'good' : 'warn') : 'bad';
    hudEl.innerHTML =
      '<span class="' + (xrMode ? 'good' : 'bad') + '">' + modeStr + '</span>\n' +
      'ref: ' + activeRefSpaceType + '\n' +
      'hit: ' + hitStatus + '\n' +
      'pos: <span class="' + posCls + '">' +
        pos.x.toFixed(2) + ' ' + pos.y.toFixed(2) + ' ' + pos.z.toFixed(2) +
      '</span>\n' +
      'win: ' + windows.length + '  v' + VERSION;
  }

  /* ============================================================
     XR session
     ============================================================ */
  async function pickRefSpaceType(session) {
    const types = ['local-floor', 'local', 'viewer'];
    for (let i = 0; i < types.length; i++) {
      try {
        await session.requestReferenceSpace(types[i]);
        return types[i];
      } catch (e) {
        console.warn('[xr] refspace', types[i], 'недоступен:', e.message || e);
      }
    }
    return 'viewer';
  }

  async function startWebXR() {
    if (!navigator.xr) return false;

    let session;
    try {
      session = await navigator.xr.requestSession('immersive-ar', {
        requiredFeatures: [],
        optionalFeatures: ['hit-test', 'dom-overlay', 'anchors', 'local-floor', 'local'],
        domOverlay: { root: document.body }
      });
    } catch (e) {
      console.warn('[xr] requestSession failed:', e);
      startModeEl.innerHTML = '<span class="err">WebXR immersive-ar недоступен:</span><br>' + (e.name || e) +
        '<br><span class="warn">Проверьте chrome://flags → WebXR AR</span>';
      return false;
    }

    xrSession = session;
    activeRefSpaceType = await pickRefSpaceType(session);
    console.log('[xr] reference space:', activeRefSpaceType);

    renderer.xr.enabled = true;
    renderer.xr.setReferenceSpaceType(activeRefSpaceType);

    try {
      await renderer.xr.setSession(session);
    } catch (e) {
      console.warn('[xr] setSession failed:', e);
      try { session.end(); } catch (err) {}
      xrSession = null;
      return false;
    }

    try {
      const viewerSpace = await session.requestReferenceSpace('viewer');
      hitTestSource = await session.requestHitTestSource({ space: viewerSpace });
    } catch (e) {
      console.warn('[xr] hit-test недоступен:', e);
      hitTestSource = null;
    }

    const rg = new THREE.RingGeometry(0.08, 0.11, 32);
    rg.rotateX(-Math.PI / 2);
    reticle = new THREE.Mesh(rg, new THREE.MeshBasicMaterial({
      color: 0x5ad0ff, transparent: true, opacity: 0.9,
      side: THREE.DoubleSide, depthTest: false, depthWrite: false
    }));
    reticle.matrixAutoUpdate = false;
    reticle.renderOrder = 50;
    reticle.visible = false;
    scene.add(reticle);

    videoEl.style.display = 'none';
    document.body.classList.add('xr-mode');

    session.addEventListener('select', onXRSelect);
    session.addEventListener('end', onXRSessionEnd);

    xrMode = true;
    renderer.setAnimationLoop(xrRenderFrame);
    return true;
  }

  async function startFallback() {
    await requestCamera();
    tryEnableGyro();
    setTimeout(function () {
      if (!gotOrientation && !gyroOn) { gyroFailed = true; lookMode = true; }
    }, 2500);
    camera.position.set(playerPos.x, playerPos.y + EYE_HEIGHT, playerPos.z);
    renderer.setAnimationLoop(fallbackRenderFrame);
  }

  function onXRSessionEnd() {
    xrMode = false;
    renderer.setAnimationLoop(null);
    document.body.classList.remove('xr-mode');
    startScreen.classList.remove('hidden');
    crosshair.classList.remove('visible');
    hudEl.classList.remove('visible');
    burgerBtn.classList.remove('active');
    setMenuOpen(false);
    started = false;
    beginning = false;
  }

  function onXRSelect() {
    if (!started) return;
    if (recentUITap()) return;
    if (isMenuOpen()) return;
    if (recentlyEdited()) return;

    const found = getButtonUnderCrosshair();
    if (found) {
      found.btn.progress = 0;
      found.btn.armed = true;
      fireButton(found.win, found.id);
      return;
    }
    if (mode) { mode = null; hideModeVisuals(); return; }
    if (editingWin) { commitEdit(); return; }
    createWindowCenter();
  }

  /* ============================================================
     Render — XR
     ============================================================ */
  function xrRenderFrame(t, frame) {
    if (!frame) return;
    const refSpace = renderer.xr.getReferenceSpace();
    if (!refSpace) { renderer.render(scene, camera); return; }

    const viewerPose = frame.getViewerPose(refSpace);
    if (viewerPose) {
      const tr = viewerPose.transform;
      _xrViewerPos.set(tr.position.x, tr.position.y, tr.position.z);
      _xrViewerQuat.set(tr.orientation.x, tr.orientation.y, tr.orientation.z, tr.orientation.w);

      if (_xrPrevViewerPos.x === Infinity) {
        _xrPrevViewerPos.copy(_xrViewerPos);
      } else {
        const d = _xrViewerPos.distanceTo(_xrPrevViewerPos);
        if (d > 0.005) { xrViewerPosChanges++; _xrPrevViewerPos.copy(_xrViewerPos); }
      }
    }

    if (hitTestSource) {
      const results = frame.getHitTestResults(hitTestSource);
      let hasHit = false;
      if (results.length > 0) {
        const pose = results[0].getPose(refSpace);
        if (pose) {
          lastHitPose = pose;
          reticle.matrix.fromArray(pose.transform.matrix);
          reticle.visible = true;
          hasHit = true;
        }
      }
      if (!hasHit) {
        lastHitPose = null;
        reticle.visible = false;
      }
    }

    if (started && !recentlyEdited()) {
      const dt = 1 / 60;
      updateHover(dt);
      updateMode(dt);
      updateWindowVisibility();
      updateHUD();
    }

    renderer.render(scene, camera);
  }

  /* ============================================================
     Render — fallback
     ============================================================ */
  let lastTime = performance.now();
  let fallbackHudAccum = 0;
  function fallbackRenderFrame(now) {
    const t = (typeof now === 'number') ? now : performance.now();
    const dt = Math.min(0.05, Math.max(0, (t - lastTime) / 1000));
    lastTime = t;

    if (gyroOn) applyGyro();
    else if (lookMode) applyLook();

    camera.position.set(playerPos.x, playerPos.y + EYE_HEIGHT, playerPos.z);

    if (started && !recentlyEdited()) {
      updateWindowVisibility();
      updateHover(dt);
      updateMode(dt);
      fallbackHudAccum += dt;
      if (fallbackHudAccum > 0.2) { updateHUD(); fallbackHudAccum = 0; }
    }

    renderer.render(scene, camera);
  }

  /* ============================================================
     Start
     ============================================================ */
  let started = false, beginning = false, consumeNextTap = false;

  async function begin() {
    if (started || beginning) return;
    beginning = true;

    let ok = false;

    if (navigator.xr) {
      try {
        const supported = await navigator.xr.isSessionSupported('immersive-ar');
        if (supported) {
          ok = await startWebXR();
        } else {
          startModeEl.innerHTML = '<span class="warn">immersive-ar не поддерживается браузером.</span>';
        }
      } catch (e) {
        console.warn('[xr] isSessionSupported failed:', e);
      }
    } else {
      startModeEl.innerHTML = '<span class="warn">navigator.xr отсутствует — WebXR не поддерживается.</span>';
    }

    if (!ok) await startFallback();

    started = true;
    startScreen.classList.add('hidden');
    crosshair.classList.add('visible');
    burgerBtn.classList.add('active');
    warmUpKeyboard();
    resize();
  }

  (async function probeXR() {
    if (!navigator.xr) {
      startModeEl.innerHTML = '<span class="warn">WebXR отсутствует</span>';
      return;
    }
    try {
      const supported = await navigator.xr.isSessionSupported('immersive-ar');
      if (supported) {
        startModeEl.innerHTML = '<span class="good" style="color:#7fff9a">WebXR AR доступен — окна будут закреплены в реальном мире.</span>';
      } else {
        startModeEl.innerHTML = '<span class="warn">immersive-ar не поддерживается — окна не будут привязаны к реальному миру.</span>';
      }
    } catch (e) {
      startModeEl.innerHTML = '<span class="err">Не удалось проверить WebXR.</span>';
    }
  })();

  startScreen.addEventListener('pointerdown', begin);

  /* ============================================================
     Canvas input (fallback)
     ============================================================ */
  let pointerInfo = null;

  canvas.addEventListener('pointerdown', function (e) {
    if (!started || xrMode) return;
    if (recentUITap()) { consumeNextTap = true; return; }
    if (editingWin) { commitEdit(); consumeNextTap = true; return; }
    pointerInfo = {
      id: e.pointerId, lastX: e.clientX, lastY: e.clientY,
      moved: 0, t: performance.now()
    };
    if (lookMode && canvas.setPointerCapture) {
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    }
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!pointerInfo || e.pointerId !== pointerInfo.id) return;
    const dx = e.clientX - pointerInfo.lastX;
    const dy = e.clientY - pointerInfo.lastY;
    pointerInfo.lastX = e.clientX; pointerInfo.lastY = e.clientY;
    pointerInfo.moved += Math.abs(dx) + Math.abs(dy);
    if (lookMode && !mode && !editingWin) {
      lookYaw -= dx * 0.0045;
      lookPitch -= dy * 0.0045;
      lookPitch = Math.max(-1.25, Math.min(1.25, lookPitch));
    }
  });
  canvas.addEventListener('pointerup', function (e) {
    if (consumeNextTap) { consumeNextTap = false; pointerInfo = null; return; }
    if (!pointerInfo || e.pointerId !== pointerInfo.id) { pointerInfo = null; return; }
    const info = pointerInfo;
    pointerInfo = null;
    if (!started || xrMode) return;
    if (recentUITap()) return;
    if (performance.now() - lastEditEnd < 300) return;
    if (info.moved < 12 && performance.now() - info.t < 700) {
      if (mode) { mode = null; hideModeVisuals(); }
      else if (!editingWin) createWindowCenter();
    }
  });
  canvas.addEventListener('pointercancel', function () { pointerInfo = null; });

  /* ============================================================
     Boot
     ============================================================ */
  resize();
  setTimeout(resize, 50);
  setTimeout(resize, 200);
  setTimeout(resize, 800);
})();
</script>
</body>
</html>
