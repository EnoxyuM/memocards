<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <title>Курсор наклоном</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #050b18;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation;
    }

    body {
      cursor: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      padding: 20px;
      text-align: center;
      color: #e2e8f0;
      background: rgba(2, 6, 23, 0.72);
      font-size: 19px;
      line-height: 1.35;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }

    #overlay.hidden {
      display: none;
    }

    #cursor {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 40;
      pointer-events: none;
      will-change: transform;
    }

    #cursor .ring {
      position: absolute;
      left: -15px;
      top: -15px;
      width: 30px;
      height: 30px;
      border: 2px solid rgba(255, 255, 255, 0.92);
      border-radius: 50%;
      box-shadow:
        0 0 12px rgba(0, 0, 0, 0.45),
        inset 0 0 8px rgba(255, 255, 255, 0.12);
    }

    #cursor .dot {
      position: absolute;
      left: -2.5px;
      top: -2.5px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
    }

    #controls {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: max(10px, env(safe-area-inset-bottom));
      z-index: 20;
      display: grid;
      gap: 7px;
      padding: 9px 11px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 16px;
      background: rgba(2, 6, 23, 0.34);
      backdrop-filter: blur(12px);
      color: #e2e8f0;
      cursor: auto;
    }

    .row {
      display: grid;
      grid-template-columns: 72px 1fr 54px;
      align-items: center;
      gap: 9px;
      font-size: 12px;
    }

    .row span {
      color: #cbd5e1;
    }

    .row output {
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: #93c5fd;
      font-weight: 700;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #60a5fa;
    }
  </style>
</head>
<body>
  <div id="overlay">
    Нажми, чтобы включить управление наклоном
  </div>

  <div id="cursor">
    <div class="ring"></div>
    <div class="dot"></div>
  </div>

  <div id="controls">
    <div class="row">
      <span>Dead zone</span>
      <input id="deadZone" type="range" min="0" max="20" step="0.5" value="2" />
      <output id="deadZoneOut">2.0°</output>
    </div>

    <div class="row">
      <span>Max zone</span>
      <input id="maxZone" type="range" min="3" max="90" step="1" value="10" />
      <output id="maxZoneOut">10°</output>
    </div>

    <div class="row">
      <span>Sens X</span>
      <input id="sensX" type="range" min="0.1" max="5" step="0.1" value="1" />
      <output id="sensXOut">1.0</output>
    </div>

    <div class="row">
      <span>Sens Y</span>
      <input id="sensY" type="range" min="0.1" max="5" step="0.1" value="1" />
      <output id="sensYOut">1.0</output>
    </div>

    <div class="row">
      <span>Max speed</span>
      <input id="maxSpeed" type="range" min="100" max="3000" step="50" value="1000" />
      <output id="maxSpeedOut">1000</output>
    </div>
  </div>

  <script>
    "use strict";

    const overlay = document.getElementById("overlay");
    const cursorEl = document.getElementById("cursor");

    const settings = {
      deadZone: 2,
      maxZone: 10,
      sensX: 1,
      sensY: 1,
      maxSpeed: 1000
    };

    let vw = window.innerWidth;
    let vh = window.innerHeight;

    const pos = {
      x: vw / 2,
      y: vh / 2
    };

    const state = {
      motionEnabled: false,
      hasAccel: false,
      baseSet: false,
      samples: [],
      accel: { x: 0, y: 0, z: 0 },
      baseMatrix: null,
      baseTargetZ: 1
    };

    const SENSOR_FILTER = 0.16;
    const CALIBRATION_SAMPLES = 25;
    const CURSOR_SMOOTHING = 0.18;

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function normalizeVector(v) {
      const len = Math.hypot(v.x, v.y, v.z);

      if (len < 0.000001) {
        return null;
      }

      return {
        x: v.x / len,
        y: v.y / len,
        z: v.z / len
      };
    }

    function dotVec(a, b) {
      return a.x * b.x + a.y * b.y + a.z * b.z;
    }

    function crossVec(a, b) {
      return {
        x: a.y * b.z - a.z * b.y,
        y: a.z * b.x - a.x * b.z,
        z: a.x * b.y - a.y * b.x
      };
    }

    function identityMatrix() {
      return [
        [1, 0, 0],
        [0, 1, 0],
        [0, 0, 1]
      ];
    }

    function axisAngleMatrix(axis, angle) {
      const x = axis.x;
      const y = axis.y;
      const z = axis.z;

      const c = Math.cos(angle);
      const s = Math.sin(angle);
      const t = 1 - c;

      return [
        [
          t * x * x + c,
          t * x * y - s * z,
          t * x * z + s * y
        ],
        [
          t * x * y + s * z,
          t * y * y + c,
          t * y * z - s * x
        ],
        [
          t * x * z - s * y,
          t * y * z + s * x,
          t * z * z + c
        ]
      ];
    }

    function matrixFromVectors(from, to) {
      const f = normalizeVector(from);
      const t = normalizeVector(to);

      if (!f || !t) {
        return identityMatrix();
      }

      const d = clamp(dotVec(f, t), -1, 1);

      if (d > 0.99999) {
        return identityMatrix();
      }

      if (d < -0.99999) {
        return axisAngleMatrix({ x: 1, y: 0, z: 0 }, Math.PI);
      }

      const axis = normalizeVector(crossVec(f, t));

      if (!axis) {
        return identityMatrix();
      }

      return axisAngleMatrix(axis, Math.acos(d));
    }

    function applyMatrix(m, v) {
      return {
        x: m[0][0] * v.x + m[0][1] * v.y + m[0][2] * v.z,
        y: m[1][0] * v.x + m[1][1] * v.y + m[1][2] * v.z,
        z: m[2][0] * v.x + m[2][1] * v.y + m[2][2] * v.z
      };
    }

    function makeBaseMatrix(baseNormalized) {
      const targetZ = baseNormalized.z >= 0 ? 1 : -1;
      state.baseTargetZ = targetZ;

      return matrixFromVectors(
        baseNormalized,
        { x: 0, y: 0, z: targetZ }
      );
    }

    function validXYZ(obj) {
      return obj &&
        Number.isFinite(obj.x) &&
        Number.isFinite(obj.y) &&
        Number.isFinite(obj.z);
    }

    function onMotion(event) {
      if (!state.motionEnabled) return;

      const g = event.accelerationIncludingGravity;

      if (!validXYZ(g)) return;

      if (!state.hasAccel) {
        state.accel.x = g.x;
        state.accel.y = g.y;
        state.accel.z = g.z;
        state.hasAccel = true;
      } else {
        state.accel.x += (g.x - state.accel.x) * SENSOR_FILTER;
        state.accel.y += (g.y - state.accel.y) * SENSOR_FILTER;
        state.accel.z += (g.z - state.accel.z) * SENSOR_FILTER;
      }

      if (!state.baseSet) {
        state.samples.push({
          x: state.accel.x,
          y: state.accel.y,
          z: state.accel.z
        });

        if (state.samples.length >= CALIBRATION_SAMPLES) {
          let x = 0;
          let y = 0;
          let z = 0;

          for (const sample of state.samples) {
            x += sample.x;
            y += sample.y;
            z += sample.z;
          }

          const n = state.samples.length;

          const avg = {
            x: x / n,
            y: y / n,
            z: z / n
          };

          const normalized = normalizeVector(avg);

          if (normalized) {
            state.baseMatrix = makeBaseMatrix(normalized);
            state.baseSet = true;
          }

          state.samples = [];
        }
      }
    }

    // Возвращает вектор скорости в px/s.
    function getMoveVector() {
      if (!state.hasAccel || !state.baseSet || !state.baseMatrix) {
        return { vx: 0, vy: 0, magnitude: 0 };
      }

      const current = normalizeVector(state.accel);

      if (!current) {
        return { vx: 0, vy: 0, magnitude: 0 };
      }

      const v = applyMatrix(state.baseMatrix, current);

      let sx = -v.x * state.baseTargetZ;
      let sy = v.y * state.baseTargetZ;

      sx = clamp(sx, -1, 1);
      sy = clamp(sy, -1, 1);

      let angleX = Math.asin(sx) * 180 / Math.PI;
      let angleY = Math.asin(sy) * 180 / Math.PI;

      // Умножаем на множители чувствительности по осям.
      angleX *= settings.sensX;
      angleY *= settings.sensY;

      const magnitude = Math.hypot(angleX, angleY);

      if (magnitude <= settings.deadZone) {
        return { vx: 0, vy: 0, magnitude };
      }

      const deadZone = settings.deadZone;
      const maxZone = Math.max(deadZone + 0.1, settings.maxZone);

      let t = (magnitude - deadZone) / (maxZone - deadZone);
      t = clamp(t, 0, 1);

      // Небольшая нелинейность: чем сильнее наклон, тем резче рост скорости.
      const curve = t * t;

      const speed = curve * settings.maxSpeed;

      let dirX, dirY;
      if (magnitude < 0.0001) {
        dirX = 0;
        dirY = 0;
      } else {
        dirX = angleX / magnitude;
        dirY = angleY / magnitude;
      }

      return {
        vx: dirX * speed,
        vy: dirY * speed,
        magnitude
      };
    }

    const targetVelocity = { x: 0, y: 0 };
    const velocity = { x: 0, y: 0 };

    let lastTime = performance.now();

    function frame(now) {
      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;

      const move = getMoveVector();

      targetVelocity.x = move.vx;
      targetVelocity.y = move.vy;

      velocity.x += (targetVelocity.x - velocity.x) * CURSOR_SMOOTHING;
      velocity.y += (targetVelocity.y - velocity.y) * CURSOR_SMOOTHING;

      if (Math.abs(velocity.x) < 0.5 && Math.abs(targetVelocity.x) === 0) {
        velocity.x = 0;
      }
      if (Math.abs(velocity.y) < 0.5 && Math.abs(targetVelocity.y) === 0) {
        velocity.y = 0;
      }

      pos.x += velocity.x * dt;
      pos.y += velocity.y * dt;

      const r = 15;

      if (pos.x < r) {
        pos.x = r;
        if (velocity.x < 0) velocity.x = -velocity.x * 0.2;
      } else if (pos.x > vw - r) {
        pos.x = vw - r;
        if (velocity.x > 0) velocity.x = -velocity.x * 0.2;
      }

      if (pos.y < r) {
        pos.y = r;
        if (velocity.y < 0) velocity.y = -velocity.y * 0.2;
      } else if (pos.y > vh - r) {
        pos.y = vh - r;
        if (velocity.y > 0) velocity.y = -velocity.y * 0.2;
      }

      cursorEl.style.transform = `translate3d(${pos.x}px, ${pos.y}px, 0)`;

      requestAnimationFrame(frame);
    }

    function resize() {
      vw = window.innerWidth;
      vh = window.innerHeight;
    }

    window.addEventListener("resize", resize);
    resize();

    function bindSlider(inputId, outputId, key, format) {
      const input = document.getElementById(inputId);
      const output = document.getElementById(outputId);

      const update = () => {
        settings[key] = parseFloat(input.value);
        output.textContent = format(settings[key]);
      };

      input.addEventListener("input", update);
      update();
    }

    bindSlider("deadZone", "deadZoneOut", "deadZone", (v) => `${v.toFixed(1)}°`);
    bindSlider("maxZone", "maxZoneOut", "maxZone", (v) => `${Math.round(v)}°`);
    bindSlider("sensX", "sensXOut", "sensX", (v) => v.toFixed(1));
    bindSlider("sensY", "sensYOut", "sensY", (v) => v.toFixed(1));
    bindSlider("maxSpeed", "maxSpeedOut", "maxSpeed", (v) => `${Math.round(v)}`);

    overlay.addEventListener("click", () => {
      let permissionPromise = Promise.resolve("granted");

      if (
        "DeviceMotionEvent" in window &&
        typeof DeviceMotionEvent.requestPermission === "function"
      ) {
        permissionPromise = DeviceMotionEvent.requestPermission();
      }

      permissionPromise
        .then((result) => {
          if (result === "granted" || result === undefined) {
            if ("DeviceMotionEvent" in window) {
              window.addEventListener("devicemotion", onMotion);
            }

            state.motionEnabled = true;
            overlay.classList.add("hidden");
          } else {
            overlay.textContent = "Доступ к датчикам не разрешён.";
          }
        })
        .catch((error) => {
          const message = error && error.message ? error.message : String(error);
          overlay.textContent = `Ошибка: ${message}`;
        });
    });

    // Двойной тап по экрану — повторная калибровка центра.
    let lastTap = 0;

    window.addEventListener(
      "pointerdown",
      (event) => {
        if (!state.motionEnabled) return;
        if (event.target.closest("#controls")) return;
        if (event.target.closest("#overlay")) return;

        const now = Date.now();

        if (now - lastTap < 300) {
          state.baseSet = false;
          state.samples = [];
        }

        lastTap = now;
      },
      { passive: true }
    );

    requestAnimationFrame(frame);
  </script>
</body>
</html>
