<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <title>Лабиринт наклоном</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #050b18;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation;
    }

    body {
      user-select: none;
      -webkit-user-select: none;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    #overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      padding: 20px;
      text-align: center;
      color: #e2e8f0;
      background: rgba(2, 6, 23, 0.78);
      font-size: 20px;
      line-height: 1.4;
      cursor: pointer;
      backdrop-filter: blur(10px);
      white-space: pre-line;
    }

    #overlay.hidden {
      display: none;
    }

    #levelIndicator {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.22);
      background: rgba(2, 6, 23, 0.35);
      color: rgba(226, 232, 240, 0.9);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
      backdrop-filter: blur(8px);
      pointer-events: none;
    }

    #hint {
      position: fixed;
      bottom: max(12px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      color: rgba(148, 163, 184, 0.6);
      font-size: 11px;
      text-align: center;
      pointer-events: none;
      line-height: 1.35;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <div id="overlay">
    Нажми, чтобы включить
    управление наклоном
  </div>

  <div id="levelIndicator" class="hidden">Уровень 1/5</div>
  <div id="hint" class="hidden">2 тапа — калибровка · 3 тапа — рестарт</div>

  <canvas id="canvas"></canvas>

  <script>
    "use strict";

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const overlay = document.getElementById("overlay");
    const levelIndicator = document.getElementById("levelIndicator");
    const hint = document.getElementById("hint");

    const LEVEL_SIZES = [7, 9, 11, 13, 15];
    const TOTAL_LEVELS = LEVEL_SIZES.length;

    const SENSOR_FILTER = 0.16;
    const CALIBRATION_SAMPLES = 25;
    const ACCEL_FACTOR = 90;
    const DEAD_ZONE_DEG = 0.6;
    const FRICTION = 2.6;
    const RESTITUTION = 0.28;
    const MAX_SPEED = 1300;

    let vw = window.innerWidth;
    let vh = window.innerHeight;
    let dpr = window.devicePixelRatio || 1;

    let currentLevel = 0;
    let overlayMode = "start";
    let overlayVisible = true;

    let cols = 0;
    let rows = 0;
    let cellSize = 0;
    let offsetX = 0;
    let offsetY = 0;
    let grid = [];
    let startCell = { x: 1, y: 1 };
    let exitCell = { x: 1, y: 1 };

    const ball = {
      x: 0,
      y: 0,
      vx: 0,
      vy: 0,
      radius: 10
    };

    const state = {
      motionEnabled: false,
      hasAccel: false,
      baseSet: false,
      samples: [],
      accel: { x: 0, y: 0, z: 0 },
      baseMatrix: null,
      baseTargetZ: 1
    };

    let tapCount = 0;
    let tapTimer = null;

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function normalizeVector(v) {
      const len = Math.hypot(v.x, v.y, v.z);

      if (len < 0.000001) {
        return null;
      }

      return {
        x: v.x / len,
        y: v.y / len,
        z: v.z / len
      };
    }

    function dotVec(a, b) {
      return a.x * b.x + a.y * b.y + a.z * b.z;
    }

    function crossVec(a, b) {
      return {
        x: a.y * b.z - a.z * b.y,
        y: a.z * b.x - a.x * b.z,
        z: a.x * b.y - a.y * b.x
      };
    }

    function identityMatrix() {
      return [
        [1, 0, 0],
        [0, 1, 0],
        [0, 0, 1]
      ];
    }

    function axisAngleMatrix(axis, angle) {
      const x = axis.x;
      const y = axis.y;
      const z = axis.z;

      const c = Math.cos(angle);
      const s = Math.sin(angle);
      const t = 1 - c;

      return [
        [
          t * x * x + c,
          t * x * y - s * z,
          t * x * z + s * y
        ],
        [
          t * x * y + s * z,
          t * y * y + c,
          t * y * z - s * x
        ],
        [
          t * x * z - s * y,
          t * y * z + s * x,
          t * z * z + c
        ]
      ];
    }

    function matrixFromVectors(from, to) {
      const f = normalizeVector(from);
      const t = normalizeVector(to);

      if (!f || !t) {
        return identityMatrix();
      }

      const d = clamp(dotVec(f, t), -1, 1);

      if (d > 0.99999) {
        return identityMatrix();
      }

      if (d < -0.99999) {
        return axisAngleMatrix({ x: 1, y: 0, z: 0 }, Math.PI);
      }

      const axis = normalizeVector(crossVec(f, t));

      if (!axis) {
        return identityMatrix();
      }

      return axisAngleMatrix(axis, Math.acos(d));
    }

    function applyMatrix(m, v) {
      return {
        x: m[0][0] * v.x + m[0][1] * v.y + m[0][2] * v.z,
        y: m[1][0] * v.x + m[1][1] * v.y + m[1][2] * v.z,
        z: m[2][0] * v.x + m[2][1] * v.y + m[2][2] * v.z
      };
    }

    function makeBaseMatrix(baseNormalized) {
      const targetZ = baseNormalized.z >= 0 ? 1 : -1;
      state.baseTargetZ = targetZ;

      return matrixFromVectors(
        baseNormalized,
        { x: 0, y: 0, z: targetZ }
      );
    }

    function validXYZ(obj) {
      return obj &&
        Number.isFinite(obj.x) &&
        Number.isFinite(obj.y) &&
        Number.isFinite(obj.z);
    }

    function onMotion(event) {
      if (!state.motionEnabled) return;

      const g = event.accelerationIncludingGravity;

      if (!validXYZ(g)) return;

      if (!state.hasAccel) {
        state.accel.x = g.x;
        state.accel.y = g.y;
        state.accel.z = g.z;
        state.hasAccel = true;
      } else {
        state.accel.x += (g.x - state.accel.x) * SENSOR_FILTER;
        state.accel.y += (g.y - state.accel.y) * SENSOR_FILTER;
        state.accel.z += (g.z - state.accel.z) * SENSOR_FILTER;
      }

      if (!state.baseSet) {
        state.samples.push({
          x: state.accel.x,
          y: state.accel.y,
          z: state.accel.z
        });

        if (state.samples.length >= CALIBRATION_SAMPLES) {
          let x = 0;
          let y = 0;
          let z = 0;

          for (const sample of state.samples) {
            x += sample.x;
            y += sample.y;
            z += sample.z;
          }

          const n = state.samples.length;

          const avg = {
            x: x / n,
            y: y / n,
            z: z / n
          };

          const normalized = normalizeVector(avg);

          if (normalized) {
            state.baseMatrix = makeBaseMatrix(normalized);
            state.baseSet = true;
          }

          state.samples = [];
        }
      }
    }

    function getTiltAngles() {
      if (!state.hasAccel || !state.baseSet || !state.baseMatrix) {
        return { angleX: 0, angleY: 0 };
      }

      const current = normalizeVector(state.accel);

      if (!current) {
        return { angleX: 0, angleY: 0 };
      }

      const v = applyMatrix(state.baseMatrix, current);

      let sx = -v.x * state.baseTargetZ;
      let sy = v.y * state.baseTargetZ;

      sx = clamp(sx, -1, 1);
      sy = clamp(sy, -1, 1);

      const angleX = Math.asin(sx) * 180 / Math.PI;
      const angleY = Math.asin(sy) * 180 / Math.PI;

      return { angleX, angleY };
    }

    function generateMaze(size) {
      cols = size;
      rows = size;

      grid = Array.from({ length: rows }, () => Array(cols).fill("#"));

      const stack = [];
      const startX = 1;
      const startY = 1;

      grid[startY][startX] = ".";
      stack.push([startX, startY]);

      const visited = new Set();
      visited.add(`${startX},${startY}`);

      const dirs = [
        [0, -2],
        [0, 2],
        [-2, 0],
        [2, 0]
      ];

      while (stack.length > 0) {
        const [cx, cy] = stack[stack.length - 1];
        const neighbors = [];

        for (const [dx, dy] of dirs) {
          const nx = cx + dx;
          const ny = cy + dy;

          if (
            nx > 0 &&
            nx < cols - 1 &&
            ny > 0 &&
            ny < rows - 1 &&
            !visited.has(`${nx},${ny}`)
          ) {
            neighbors.push([nx, ny, dx, dy]);
          }
        }

        if (neighbors.length === 0) {
          stack.pop();
        } else {
          const [nx, ny, dx, dy] = neighbors[
            Math.floor(Math.random() * neighbors.length)
          ];

          grid[cy + dy / 2][cx + dx / 2] = ".";
          grid[ny][nx] = ".";
          visited.add(`${nx},${ny}`);
          stack.push([nx, ny]);
        }
      }

      startCell = { x: 1, y: 1 };
      exitCell = { x: cols - 2, y: rows - 2 };

      grid[startCell.y][startCell.x] = "S";
      grid[exitCell.y][exitCell.x] = "E";

      layout();
      resetBallToStart();
      updateLevelIndicator();
    }

    function layout() {
      vw = window.innerWidth;
      vh = window.innerHeight;

      cellSize = Math.min(vw, vh) / cols;
      offsetX = (vw - cols * cellSize) / 2;
      offsetY = (vh - rows * cellSize) / 2;

      ball.radius = cellSize * 0.28;
    }

    function resetBallToStart() {
      ball.x = offsetX + (startCell.x + 0.5) * cellSize;
      ball.y = offsetY + (startCell.y + 0.5) * cellSize;
      ball.vx = 0;
      ball.vy = 0;
    }

    function updateLevelIndicator() {
      levelIndicator.textContent = `Уровень ${currentLevel + 1}/${TOTAL_LEVELS}`;
    }

    function resizeCanvas() {
      vw = window.innerWidth;
      vh = window.innerHeight;
      dpr = window.devicePixelRatio || 1;

      canvas.width = Math.floor(vw * dpr);
      canvas.height = Math.floor(vh * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      if (cols > 0) {
        layout();
      }
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function update(dt) {
      const tilt = getTiltAngles();

      let ax = tilt.angleX * ACCEL_FACTOR;
      let ay = tilt.angleY * ACCEL_FACTOR;

      const tiltMagnitude = Math.hypot(tilt.angleX, tilt.angleY);

      if (tiltMagnitude < DEAD_ZONE_DEG) {
        ax = 0;
        ay = 0;
      }

      ball.vx += ax * dt;
      ball.vy += ay * dt;

      const damping = Math.exp(-FRICTION * dt);
      ball.vx *= damping;
      ball.vy *= damping;

      let speed = Math.hypot(ball.vx, ball.vy);

      if (speed > MAX_SPEED) {
        const scale = MAX_SPEED / speed;
        ball.vx *= scale;
        ball.vy *= scale;
        speed = MAX_SPEED;
      }

      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;

      collideWalls();
      checkExit();
    }

    function collideWalls() {
      const cellX = Math.floor((ball.x - offsetX) / cellSize);
      const cellY = Math.floor((ball.y - offsetY) / cellSize);

      for (let dy = -2; dy <= 2; dy++) {
        for (let dx = -2; dx <= 2; dx++) {
          const cx = cellX + dx;
          const cy = cellY + dy;

          if (cx < 0 || cx >= cols || cy < 0 || cy >= rows) {
            continue;
          }

          if (grid[cy][cx] !== "#") {
            continue;
          }

          const rectX = offsetX + cx * cellSize;
          const rectY = offsetY + cy * cellSize;

          const nearestX = clamp(ball.x, rectX, rectX + cellSize);
          const nearestY = clamp(ball.y, rectY, rectY + cellSize);

          const dx2 = ball.x - nearestX;
          const dy2 = ball.y - nearestY;

          const distSq = dx2 * dx2 + dy2 * dy2;

          if (distSq < ball.radius * ball.radius) {
            const dist = Math.sqrt(distSq) || 0.0001;

            const nx = dx2 / dist;
            const ny = dy2 / dist;

            const overlap = ball.radius - dist;

            ball.x += nx * overlap;
            ball.y += ny * overlap;

            const dot = ball.vx * nx + ball.vy * ny;

            if (dot < 0) {
              ball.vx -= (1 + RESTITUTION) * dot * nx;
              ball.vy -= (1 + RESTITUTION) * dot * ny;
            }
          }
        }
      }
    }

    function checkExit() {
      const exitX = offsetX + (exitCell.x + 0.5) * cellSize;
      const exitY = offsetY + (exitCell.y + 0.5) * cellSize;

      const dx = ball.x - exitX;
      const dy = ball.y - exitY;

      const dist = Math.hypot(dx, dy);

      if (dist < cellSize * 0.38) {
        nextLevel();
      }
    }

    function nextLevel() {
      currentLevel++;

      if (currentLevel >= TOTAL_LEVELS) {
        showWinOverlay();
        return;
      }

      generateMaze(LEVEL_SIZES[currentLevel]);
    }

    function showWinOverlay() {
      overlayMode = "win";
      overlayVisible = true;
      overlay.textContent =
        "Победа!\nВсе уровни пройдены.\nТапни, чтобы начать заново.";
      overlay.classList.remove("hidden");
      levelIndicator.classList.add("hidden");
      hint.classList.add("hidden");
    }

    function hideOverlay() {
      overlayVisible = false;
      overlay.classList.add("hidden");
      levelIndicator.classList.remove("hidden");
      hint.classList.remove("hidden");
    }

    function startGame() {
      currentLevel = 0;
      generateMaze(LEVEL_SIZES[currentLevel]);
      hideOverlay();
    }

    function restartLevel() {
      resetBallToStart();
    }

    function calibrate() {
      state.baseSet = false;
      state.samples = [];
    }

    overlay.addEventListener("click", () => {
      if (overlayMode === "start") {
        let permissionPromise = Promise.resolve("granted");

        if (
          "DeviceMotionEvent" in window &&
          typeof DeviceMotionEvent.requestPermission === "function"
        ) {
          permissionPromise = DeviceMotionEvent.requestPermission();
        }

        permissionPromise
          .then((result) => {
            if (result === "granted" || result === undefined) {
              if ("DeviceMotionEvent" in window) {
                window.addEventListener("devicemotion", onMotion);
              }

              state.motionEnabled = true;
              startGame();
            } else {
              overlay.textContent = "Доступ к датчикам не разрешён.";
            }
          })
          .catch((error) => {
            const message = error && error.message ? error.message : String(error);
            overlay.textContent = `Ошибка: ${message}`;
          });
      } else if (overlayMode === "win") {
        startGame();
      }
    });

    window.addEventListener(
      "pointerdown",
      () => {
        if (overlayVisible) return;

        tapCount++;

        if (tapTimer) {
          clearTimeout(tapTimer);
        }

        tapTimer = setTimeout(() => {
          if (tapCount === 2) {
            calibrate();
          } else if (tapCount >= 3) {
            restartLevel();
          }

          tapCount = 0;
        }, 350);
      },
      { passive: true }
    );

    function draw() {
      ctx.clearRect(0, 0, vw, vh);

      // Пол.
      ctx.fillStyle = "rgba(15, 23, 42, 0.65)";
      ctx.fillRect(offsetX, offsetY, cols * cellSize, rows * cellSize);

      // Выход.
      const exitX = offsetX + (exitCell.x + 0.5) * cellSize;
      const exitY = offsetY + (exitCell.y + 0.5) * cellSize;

      const pulse = 0.85 + Math.sin(performance.now() / 300) * 0.15;

      ctx.beginPath();
      ctx.arc(exitX, exitY, cellSize * 0.3 * pulse, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(34, 197, 94, 0.85)";
      ctx.fill();

      ctx.beginPath();
      ctx.arc(exitX, exitY, cellSize * 0.38, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(34, 197, 94, 0.35)";
      ctx.lineWidth = 2;
      ctx.stroke();

      // Стены.
      ctx.fillStyle = "rgba(51, 65, 85, 0.95)";

      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          if (grid[y][x] === "#") {
            const px = offsetX + x * cellSize;
            const py = offsetY + y * cellSize;

            ctx.fillRect(px, py, cellSize, cellSize);
          }
        }
      }

      // Шарик.
      const gradient = ctx.createRadialGradient(
        ball.x - ball.radius * 0.35,
        ball.y - ball.radius * 0.35,
        ball.radius * 0.1,
        ball.x,
        ball.y,
        ball.radius
      );

      gradient.addColorStop(0, "#fb923c");
      gradient.addColorStop(0.55, "#f97316");
      gradient.addColorStop(1, "#7c2d12");

      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fillStyle = gradient;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(255, 255, 255, 0.28)";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Блик.
      ctx.beginPath();
      ctx.arc(
        ball.x - ball.radius * 0.32,
        ball.y - ball.radius * 0.34,
        ball.radius * 0.18,
        0,
        Math.PI * 2
      );
      ctx.fillStyle = "rgba(255, 255, 255, 0.28)";
      ctx.fill();
    }

    let lastTime = performance.now();

    function frame(now) {
      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;

      if (!overlayVisible) {
        update(dt);
      }

      draw();
      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  </script>
</body>
</html>
