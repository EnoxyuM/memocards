<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>360</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0a0c0f;color:#cfd8e3;
  font:14px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;touch-action:none}
#world{position:fixed;inset:0;overflow:hidden;cursor:grab}
#world:active{cursor:grabbing}
#cross{position:fixed;left:50%;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;
  pointer-events:none;z-index:9999}
.win{position:absolute;left:0;top:0;display:flex;flex-direction:column;overflow:hidden;
  border-radius:10px;background:#151a21;border:1px solid #2b3542;
  box-shadow:0 12px 34px rgba(0,0,0,.6);will-change:transform;
  transition:background .25s ease,border-color .25s ease,box-shadow .18s ease}
.win.flipped{background:#1a2531;border-color:#3a5470}
.win.moving,.win.resizing{box-shadow:0 0 0 1.5px rgba(110,200,255,.6),0 12px 34px rgba(0,0,0,.6)}
.win.moving{cursor:move}
.win.resizing{cursor:nwse-resize}
.bar{flex:0 0 28px;height:28px;display:flex;align-items:center;justify-content:flex-end;
  gap:4px;padding:0 6px;background:rgba(255,255,255,.035);border-bottom:1px solid rgba(255,255,255,.05)}
.btn{position:relative;width:20px;height:20px;display:grid;place-items:center;border:0;border-radius:50%;
  background:transparent;color:#8296ab;cursor:pointer;padding:0;-webkit-appearance:none;outline:none}
.btn svg{display:block;width:12px;height:12px;pointer-events:none;overflow:visible}
.btn .star{fill:currentColor}
.win.flipped .btn .star{fill:none}
.btn:hover{background:rgba(255,255,255,.09);color:#e8f1fa}
.btn:active{background:rgba(255,255,255,.16)}
.btn .r1,.btn .r2{position:absolute;left:50%;top:50%;width:22px;height:22px;border-radius:50%;
  pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(0)}
.btn .r1{border:1.5px solid rgba(110,200,255,.9)}
.btn .r2{background:rgba(110,200,255,.28);border:1.5px solid rgba(110,200,255,.95)}
.btn.charge .r1{opacity:1;transform:translate(-50%,-50%) scale(1)}
.btn.charge .r2{opacity:1}
.body{position:relative;flex:1;min-height:0}
.face{position:absolute;inset:0;padding:8px 10px;overflow:auto;outline:none;
  user-select:text;-webkit-user-select:text;white-space:pre-wrap;word-break:break-word;
  color:#dbe6f2;font-size:14px;cursor:text}
.face.back{display:none}
.win.flipped .face.front{display:none}
.win.flipped .face.back{display:block}
</style>
</head>
<body>
<div id="world"></div>
<div id="cross">
  <svg width="24" height="24" viewBox="0 0 24 24">
    <circle id="ring" cx="12" cy="12" r="10.5" fill="none" stroke="#7fd4ff" stroke-width="1.6"
      stroke-linecap="round" stroke-dasharray="65.97" stroke-dashoffset="65.97"
      opacity="0" transform="rotate(-90 12 12)"/>
    <g stroke="#7fd4ff" stroke-width="1.4" stroke-linecap="round" opacity="0.85">
      <line x1="12" y1="2.5" x2="12" y2="7.5"/>
      <line x1="12" y1="16.5" x2="12" y2="21.5"/>
      <line x1="2.5" y1="12" x2="7.5" y2="12"/>
      <line x1="16.5" y1="12" x2="21.5" y2="12"/>
    </g>
    <circle cx="12" cy="12" r="1.1" fill="#7fd4ff" opacity="0.9"/>
  </svg>
</div>
<script>
(function(){
'use strict';

var worldEl = document.getElementById('world');
var ringEl  = document.getElementById('ring');
var MOBILE  = matchMedia('(hover: none) and (pointer: coarse)').matches;

var camX = 0, camY = 0;
var wins = [];
var idc  = 0;
var db   = null;

var modeWin      = null;
var stillStart   = 0;
var stillCamX    = 0;
var stillCamY    = 0;
var lastModeSave = 0;

var RING_LEN = 65.97;

/* ---------------- IndexedDB ---------------- */
var dbReq = indexedDB.open('wins360', 1);
dbReq.onupgradeneeded = function(e){
  var d = e.target.result;
  if (!d.objectStoreNames.contains('w')) d.createObjectStore('w', { keyPath: 'id' });
};
dbReq.onsuccess = function(e){
  db = e.target.result;
  try {
    var rq = db.transaction('w', 'readonly').objectStore('w').getAll();
    rq.onsuccess = function(){
      (rq.result || []).forEach(function(rec){
        var a = rec.a || [];
        var front = '', back = '';
        if (a.length >= 8)      { front = a[6] || ''; back = a[7] || ''; }
        else if (a.length === 7){ front = a[5] || ''; back = a[6] || ''; }
        createWindow(a[0] || 0, a[1] || 0, {
          id: rec.id, w: a[2], h: a[3], flip: !!a[4],
          front: front, back: back
        });
      });
    };
  } catch(err){}
};

var saveTimers = {};
function scheduleSave(o){
  clearTimeout(saveTimers[o.id]);
  saveTimers[o.id] = setTimeout(function(){ saveNow(o); }, 300);
}
function saveNow(o){
  if (!db) return;
  try {
    db.transaction('w', 'readwrite').objectStore('w').put({
      id: o.id,
      a: [ Math.round(o.x), Math.round(o.y), Math.round(o.w), Math.round(o.h),
           o.flip ? 1 : 0, o.frontEl.innerHTML, o.backEl.innerHTML ]
    });
  } catch(err){}
}
function removeRec(id){
  if (!db) return;
  try { db.transaction('w', 'readwrite').objectStore('w').delete(id); } catch(err){}
}

/* ---------------- icons ---------------- */
function svg(inner){
  return '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round">'+inner+'</svg>';
}
var ICONS = {
  flip:   svg('<polygon class="star" points="6,1 7.35,4.35 10.9,4.65 8.25,7.1 9.05,10.6 6,8.85 2.95,10.6 3.75,7.1 1.1,4.65 4.65,4.35"/>'),
  edit:   svg('<circle cx="6" cy="6" r="4.2"/>'),
  resize: svg('<polygon points="6,1.5 11,10.3 1,10.3"/>'),
  move:   svg('<rect x="1.9" y="1.9" width="8.2" height="8.2" rx="1.1"/>'),
  close:  svg('<path d="M2.7 2.7 L9.3 9.3 M9.3 2.7 L2.7 9.3" stroke-linecap="round"/>')
};

/* ---------------- PC drag (press & hold button) ---------------- */
var drag = null;

function startDrag(o, kind, e){
  if (drag) endDrag();
  if (modeWin) applyMode(modeWin, null);
  drag = { o: o, kind: kind, sx: e.clientX, sy: e.clientY,
           x0: o.x, y0: o.y, w0: o.w, h0: o.h };
  o.el.classList.add(kind === 'move' ? 'moving' : 'resizing');
}

function endDrag(){
  if (!drag) return;
  var o = drag.o;
  drag = null;
  o.el.classList.remove('moving', 'resizing');
  saveNow(o);
}

/* ---------------- window ---------------- */
function createWindow(x, y, o){
  o = o || {};
  var id = (o.id != null) ? o.id : ++idc;
  if (o.id != null) idc = Math.max(idc, o.id);

  var el = document.createElement('div');
  el.className = 'win' + (o.flip ? ' flipped' : '');
  el.innerHTML =
    '<div class="bar">' +
      '<button class="btn" data-act="flip">'   + ICONS.flip   + '<span class="r1"></span><span class="r2"></span></button>' +
      '<button class="btn" data-act="edit">'   + ICONS.edit   + '<span class="r1"></span><span class="r2"></span></button>' +
      '<button class="btn" data-act="resize">' + ICONS.resize + '<span class="r1"></span><span class="r2"></span></button>' +
      '<button class="btn" data-act="move">'   + ICONS.move   + '<span class="r1"></span><span class="r2"></span></button>' +
      '<button class="btn" data-act="close">'  + ICONS.close  + '<span class="r1"></span><span class="r2"></span></button>' +
    '</div>' +
    '<div class="body">' +
      '<div class="face front" contenteditable="true" spellcheck="false"></div>' +
      '<div class="face back" contenteditable="true" spellcheck="false"></div>' +
    '</div>';

  var frontEl = el.querySelector('.front');
  var backEl  = el.querySelector('.back');
  if (o.front) frontEl.innerHTML = o.front;
  if (o.back)  backEl.innerHTML  = o.back;

  var obj = {
    id: id, x: x, y: y,
    w: o.w || 260, h: o.h || 170,
    flip: !!o.flip, mode: null,
    el: el, frontEl: frontEl, backEl: backEl,
    _w: 0, _h: 0,
    anchorX: 0, anchorY: 0,
    offX: 0, offY: 0
  };

  el.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('.btn') : null;
    if (!b) return;
    var a = b.dataset.act;
    /* на ПК квадрат/треугольник работают через перетаскивание */
    if (!MOBILE && (a === 'move' || a === 'resize')) return;
    e.stopPropagation();
    act(obj, a);
  });

  el.addEventListener('mousedown', function(e){
    if (MOBILE) return;
    var b = e.target.closest ? e.target.closest('.btn') : null;
    if (!b) return;
    var a = b.dataset.act;
    if (a !== 'move' && a !== 'resize') return;
    e.preventDefault();
    e.stopPropagation();
    startDrag(obj, a, e);
  });

  frontEl.addEventListener('input', function(){ scheduleSave(obj); });
  backEl.addEventListener('input',  function(){ scheduleSave(obj); });

  wins.push(obj);
  worldEl.appendChild(el);
  return obj;
}

function act(o, a){
  if (a === 'close'){
    if (o.mode) applyMode(o, null);
    o.el.remove();
    var i = wins.indexOf(o);
    if (i >= 0) wins.splice(i, 1);
    removeRec(o.id);
  } else if (a === 'flip'){
    o.flip = !o.flip;
    o.el.classList.toggle('flipped', o.flip);
    scheduleSave(o);
  } else if (a === 'move'){
    applyMode(o, o.mode === 'move' ? null : 'move');
  } else if (a === 'resize'){
    applyMode(o, o.mode === 'resize' ? null : 'resize');
  } else if (a === 'edit'){
    (o.flip ? o.backEl : o.frontEl).focus();
  }
}

function applyMode(o, m){
  if (o.mode === m) return;
  if (modeWin && modeWin !== o) applyMode(modeWin, null);

  o.mode = m;
  o.el.classList.toggle('moving',   m === 'move');
  o.el.classList.toggle('resizing', m === 'resize');

  if (m){
    modeWin = o;
    if (m === 'move'){
      o.offX = o.x - camX;
      o.offY = o.y - camY;
    } else if (m === 'resize'){
      o.anchorX = camX - o.w;
      o.anchorY = camY - o.h;
    }
    stillStart = performance.now();
    stillCamX  = camX;
    stillCamY  = camY;
  } else {
    if (modeWin === o) modeWin = null;
    scheduleSave(o);
  }
  setRing(0, false);
}

/* ---------------- orientation (fixed) ---------------- */
var orientReady = false, orientTried = false;
var usingCompass = false;
var lastAlpha = null;
var rawYaw = 0, rawPitch = 0;
var smoothYaw = 0, smoothPitch = 0;

function onOrient(e){
  if (e.alpha == null && e.webkitCompassHeading == null) return;
  orientReady = true;

  /* 1. iOS: webkitCompassHeading — стабильный курс */
  if (e.webkitCompassHeading != null && !isNaN(e.webkitCompassHeading)){
    usingCompass = true;
    rawYaw = e.webkitCompassHeading;
    rawPitch = (e.beta == null ? 45 : e.beta) - 45;
    return;
  }

  /* 2. Android: абсолютный alpha из deviceorientationabsolute */
  if (e.alpha != null && e.absolute === true && !usingCompass){
    usingCompass = true;
    rawYaw = 360 - e.alpha;
    rawPitch = (e.beta == null ? 45 : e.beta) - 45;
    return;
  }

  /* 3. Запасной вариант: накапливаем дельту alpha, отсекая выбросы */
  if (e.alpha != null){
    var a = e.alpha;
    if (lastAlpha !== null){
      var d = a - lastAlpha;
      if (d > 180)  d -= 360;
      if (d < -180) d += 360;
      if (Math.abs(d) < 30) rawYaw += d;
    }
    lastAlpha = a;
    rawPitch = (e.beta == null ? 45 : e.beta) - 45;
  }
}

function enableOrientation(){
  if (!MOBILE || orientTried) return;
  orientTried = true;

  function addListeners(){
    if (window.DeviceOrientationEvent && 'ondeviceorientationabsolute' in window){
      window.addEventListener('deviceorientationabsolute', onOrient);
    }
    window.addEventListener('deviceorientation', onOrient);
  }

  try {
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function'){
      DeviceOrientationEvent.requestPermission().then(function(r){
        if (r === 'granted') addListeners();
      }).catch(function(){});
    } else if (typeof DeviceOrientationEvent !== 'undefined'){
      addListeners();
    }
  } catch(err){}
}

/* ---------------- input ---------------- */
var down = null;
var suppressTap = false;

addEventListener('mousedown', function(e){
  if (MOBILE || e.button !== 0) return;
  var t = e.target;
  if (t.closest && (t.closest('.btn') || t.closest('.face'))) return;
  down = {
    x: e.clientX, y: e.clientY,
    lx: e.clientX, ly: e.clientY,
    moved: false,
    noCreate: !!(t.closest && t.closest('.win'))
  };
});

addEventListener('mousemove', function(e){
  if (MOBILE) return;

  if (drag){
    var dx = e.clientX - drag.sx;
    var dy = e.clientY - drag.sy;
    if (drag.kind === 'move'){
      drag.o.x = drag.x0 + dx;
      drag.o.y = drag.y0 + dy;
    } else {
      drag.o.w = Math.max(120, drag.w0 + dx);
      drag.o.h = Math.max(80,  drag.h0 + dy);
    }
    return;
  }

  if (!down) return;
  var mx2 = e.clientX - down.x, my2 = e.clientY - down.y;
  if (!down.moved && (mx2*mx2 + my2*my2) > 16) down.moved = true;
  if (down.moved){
    camX -= (e.clientX - down.lx);
    camY -= (e.clientY - down.ly);
  }
  down.lx = e.clientX;
  down.ly = e.clientY;
});

addEventListener('mouseup', function(e){
  if (MOBILE) return;

  if (drag){ endDrag(); return; }
  if (!down) return;

  if (!down.moved && !down.noCreate && !modeWin){
    var wx = e.clientX - innerWidth  / 2 + camX;
    var wy = e.clientY - innerHeight / 2 + camY;
    createWindow(wx - 130, wy - 85);
  }
  down = null;
});

addEventListener('blur', function(){
  down = null;
  if (drag) endDrag();
});

addEventListener('click', function(e){
  if (!MOBILE) return;
  if (suppressTap){ suppressTap = false; return; }
  var t = e.target;
  if (t.closest && t.closest('.win')) return;
  createWindow(camX - 130, camY - 85);
});

var touchPt = null;

addEventListener('touchstart', function(e){
  enableOrientation();
  if (e.touches.length !== 1){ touchPt = null; return; }
  touchPt = { x: e.touches[0].clientX, y: e.touches[0].clientY, moved: false };
}, { passive: true });

addEventListener('touchmove', function(e){
  if (!touchPt || orientReady || e.touches.length !== 1) return;
  var tx = e.touches[0].clientX, ty = e.touches[0].clientY;
  var dx = tx - touchPt.x, dy = ty - touchPt.y;
  if (!touchPt.moved && (dx*dx + dy*dy) > 16) touchPt.moved = true;
  if (touchPt.moved){
    camX -= dx;
    camY -= dy;
    if (e.cancelable) e.preventDefault();
  }
  touchPt.x = tx;
  touchPt.y = ty;
}, { passive: false });

addEventListener('touchend', function(){
  if (touchPt && touchPt.moved) suppressTap = true;
  touchPt = null;
});

/* ---------------- charge / dwell (мобильные) ---------------- */
var chargeBtn = null, chargeStart = 0, firedBtn = null;
var lastCCamX = 0, lastCCamY = 0;

function setCharge(btn, p, on){
  if (!btn) return;
  btn.classList.toggle('charge', !!on);
  var r2 = btn.querySelector('.r2');
  if (r2) r2.style.transform = 'translate(-50%,-50%) scale(' + (on ? Math.max(0.06, p) : 0) + ')';
}

function updateCharge(t){
  var el  = document.elementFromPoint(innerWidth / 2, innerHeight / 2);
  var btn = (el && el.closest) ? el.closest('.btn') : null;

  if (Math.abs(camX - lastCCamX) > 0.6 || Math.abs(camY - lastCCamY) > 0.6){
    lastCCamX = camX;
    lastCCamY = camY;
    if (chargeBtn) setCharge(chargeBtn, 0, false);
    chargeBtn = btn;
    chargeStart = t;
    firedBtn = null;
    if (chargeBtn) setCharge(chargeBtn, 0, true);
    return;
  }

  if (btn !== chargeBtn){
    if (chargeBtn) setCharge(chargeBtn, 0, false);
    chargeBtn = btn;
    chargeStart = t;
    firedBtn = null;
    if (chargeBtn) setCharge(chargeBtn, 0, true);
  }

  if (!chargeBtn || chargeBtn === firedBtn) return;

  var p = (t - chargeStart) / 1000;
  if (p >= 1){
    firedBtn = chargeBtn;
    setCharge(chargeBtn, 0, false);
    chargeBtn.click();
  } else {
    setCharge(chargeBtn, p, true);
  }
}

/* ---------------- ring ---------------- */
function setRing(p, on){
  ringEl.style.opacity = on ? '1' : '0';
  ringEl.style.strokeDashoffset = String(RING_LEN * (1 - Math.min(1, p)));
}

/* ---------------- frame ---------------- */
var lastT = 0;

function frame(t){
  if (!lastT) lastT = t;
  lastT = t;

  if (MOBILE && orientReady){
    smoothYaw   += (rawYaw   - smoothYaw)   * 0.08;
    smoothPitch += (rawPitch - smoothPitch) * 0.18;
    camX = -smoothYaw * 9;
    var cy = smoothPitch * 7;
    camY = cy > 1500 ? 1500 : (cy < -1500 ? -1500 : cy);
  }

  if (modeWin){
    var mo = modeWin;

    if (mo.mode === 'move'){
      mo.x = camX + mo.offX;
      mo.y = camY + mo.offY;
    } else if (mo.mode === 'resize'){
      mo.x = mo.anchorX;
      mo.y = mo.anchorY;
      mo.w = Math.max(120, camX - mo.anchorX);
      mo.h = Math.max(80,  camY - mo.anchorY);
    }

    if (Math.abs(camX - stillCamX) > 0.5 || Math.abs(camY - stillCamY) > 0.5){
      stillCamX = camX;
      stillCamY = camY;
      stillStart = t;
    }

    var mp = (t - stillStart) / 1000;
    if (mp >= 1){
      applyMode(mo, null);
    } else {
      setRing(mp, true);
    }

    if (t - lastModeSave > 600){
      lastModeSave = t;
      saveNow(mo);
    }
  } else {
    setRing(0, false);
  }

  var hw = innerWidth / 2, hh = innerHeight / 2;

  for (var i = 0; i < wins.length; i++){
    var o = wins[i];
    if (o._w !== o.w){ o.el.style.width  = o.w + 'px'; o._w = o.w; }
    if (o._h !== o.h){ o.el.style.height = o.h + 'px'; o._h = o.h; }
    o.el.style.transform = 'translate(' +
      Math.round(o.x - camX + hw) + 'px,' +
      Math.round(o.y - camY + hh) + 'px)';
  }

  if (MOBILE) updateCharge(t);

  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);

})();
</script>
</body>
</html>
