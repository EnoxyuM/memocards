<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <title>Курсор наклоном</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050b18;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation;
    }

    body {
      cursor: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      padding: 20px;
      text-align: center;
      color: #e2e8f0;
      background: rgba(2, 6, 23, 0.72);
      font-size: 19px;
      line-height: 1.35;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }

    #overlay.hidden {
      display: none;
    }

    #cursor {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 40;
      pointer-events: none;
      will-change: transform;
    }

    #cursor .ring {
      position: absolute;
      left: -15px;
      top: -15px;
      width: 30px;
      height: 30px;
      border: 2px solid rgba(255, 255, 255, 0.92);
      border-radius: 50%;
      box-shadow:
        0 0 12px rgba(0, 0, 0, 0.45),
        inset 0 0 8px rgba(255, 255, 255, 0.12);
    }

    #cursor .dot {
      position: absolute;
      left: -2.5px;
      top: -2.5px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
    }

    #controls {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: max(10px, env(safe-area-inset-bottom));
      z-index: 20;
      display: grid;
      gap: 7px;
      padding: 9px 11px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 16px;
      background: rgba(2, 6, 23, 0.34);
      backdrop-filter: blur(12px);
      color: #e2e8f0;
      cursor: auto;
    }

    .row {
      display: grid;
      grid-template-columns: 58px 1fr 44px;
      align-items: center;
      gap: 9px;
      font-size: 12px;
    }

    .row span {
      color: #cbd5e1;
    }

    .row output {
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: #93c5fd;
      font-weight: 700;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #60a5fa;
    }
  </style>
</head>
<body>
  <div id="overlay">
    Нажми, чтобы включить управление наклоном
  </div>

  <div id="cursor">
    <div class="ring"></div>
    <div class="dot"></div>
  </div>

  <div id="controls">
    <div class="row">
      <span>Max X</span>
      <input id="maxX" type="range" min="2" max="90" step="1" value="20" />
      <output id="maxXOut">20°</output>
    </div>

    <div class="row">
      <span>Max Y</span>
      <input id="maxY" type="range" min="2" max="90" step="1" value="20" />
      <output id="maxYOut">20°</output>
    </div>
  </div>

  <script>
    "use strict";

    const overlay = document.getElementById("overlay");
    const cursorEl = document.getElementById("cursor");

    const settings = {
      maxX: 20,
      maxY: 20
    };

    let vw = window.innerWidth;
    let vh = window.innerHeight;

    const pos = {
      x: vw / 2,
      y: vh / 2
    };

    const target = {
      x: vw / 2,
      y: vh / 2
    };

    const state = {
      motionEnabled: false,
      hasAccel: false,
      baseSet: false,
      samples: [],
      accel: { x: 0, y: 0, z: 0 },
      baseMatrix: null,
      baseTargetZ: 1,
      pointer: {
        x: vw / 2,
        y: vh / 2,
        has: false
      }
    };

    const SENSOR_FILTER = 0.16;
    const CALIBRATION_SAMPLES = 25;
    const DEAD_ZONE_DEG = 0.25;
    const CURSOR_SMOOTHING = 0.25;

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function normalizeVector(v) {
      const len = Math.hypot(v.x, v.y, v.z);

      if (len < 0.000001) {
        return null;
      }

      return {
        x: v.x / len,
        y: v.y / len,
        z: v.z / len
      };
    }

    function dotVec(a, b) {
      return a.x * b.x + a.y * b.y + a.z * b.z;
    }

    function crossVec(a, b) {
      return {
        x: a.y * b.z - a.z * b.y,
        y: a.z * b.x - a.x * b.z,
        z: a.x * b.y - a.y * b.x
      };
    }

    function identityMatrix() {
      return [
        [1, 0, 0],
        [0, 1, 0],
        [0, 0, 1]
      ];
    }

    function axisAngleMatrix(axis, angle) {
      const x = axis.x;
      const y = axis.y;
      const z = axis.z;

      const c = Math.cos(angle);
      const s = Math.sin(angle);
      const t = 1 - c;

      return [
        [
          t * x * x + c,
          t * x * y - s * z,
          t * x * z + s * y
        ],
        [
          t * x * y + s * z,
          t * y * y + c,
          t * y * z - s * x
        ],
        [
          t * x * z - s * y,
          t * y * z + s * x,
          t * z * z + c
        ]
      ];
    }

    function matrixFromVectors(from, to) {
      const f = normalizeVector(from);
      const t = normalizeVector(to);

      if (!f || !t) {
        return identityMatrix();
      }

      const d = clamp(dotVec(f, t), -1, 1);

      if (d > 0.99999) {
        return identityMatrix();
      }

      if (d < -0.99999) {
        return axisAngleMatrix({ x: 1, y: 0, z: 0 }, Math.PI);
      }

      const axis = normalizeVector(crossVec(f, t));

      if (!axis) {
        return identityMatrix();
      }

      return axisAngleMatrix(axis, Math.acos(d));
    }

    function applyMatrix(m, v) {
      return {
        x: m[0][0] * v.x + m[0][1] * v.y + m[0][2] * v.z,
        y: m[1][0] * v.x + m[1][1] * v.y + m[1][2] * v.z,
        z: m[2][0] * v.x + m[2][1] * v.y + m[2][2] * v.z
      };
    }

    function makeBaseMatrix(baseNormalized) {
      const targetZ = baseNormalized.z >= 0 ? 1 : -1;
      state.baseTargetZ = targetZ;

      return matrixFromVectors(
        baseNormalized,
        { x: 0, y: 0, z: targetZ }
      );
    }

    function validXYZ(obj) {
      return obj &&
        Number.isFinite(obj.x) &&
        Number.isFinite(obj.y) &&
        Number.isFinite(obj.z);
    }

    function onMotion(event) {
      if (!state.motionEnabled) return;

      const g = event.accelerationIncludingGravity;

      if (!validXYZ(g)) return;

      if (!state.hasAccel) {
        state.accel.x = g.x;
        state.accel.y = g.y;
        state.accel.z = g.z;
        state.hasAccel = true;
      } else {
        state.accel.x += (g.x - state.accel.x) * SENSOR_FILTER;
        state.accel.y += (g.y - state.accel.y) * SENSOR_FILTER;
        state.accel.z += (g.z - state.accel.z) * SENSOR_FILTER;
      }

      if (!state.baseSet) {
        state.samples.push({
          x: state.accel.x,
          y: state.accel.y,
          z: state.accel.z
        });

        if (state.samples.length >= CALIBRATION_SAMPLES) {
          let x = 0;
          let y = 0;
          let z = 0;

          for (const sample of state.samples) {
            x += sample.x;
            y += sample.y;
            z += sample.z;
          }

          const n = state.samples.length;

          const avg = {
            x: x / n,
            y: y / n,
            z: z / n
          };

          const normalized = normalizeVector(avg);

          if (normalized) {
            state.baseMatrix = makeBaseMatrix(normalized);
            state.baseSet = true;
          }

          state.samples = [];
        }
      }
    }

    function computeTarget() {
      if (state.hasAccel && state.baseSet && state.baseMatrix) {
        const current = normalizeVector(state.accel);

        if (current) {
          const v = applyMatrix(state.baseMatrix, current);

          let sx = -v.x * state.baseTargetZ;
          let sy = v.y * state.baseTargetZ;

          sx = clamp(sx, -1, 1);
          sy = clamp(sy, -1, 1);

          let angleX = Math.asin(sx) * 180 / Math.PI;
          let angleY = Math.asin(sy) * 180 / Math.PI;

          if (Math.abs(angleX) < DEAD_ZONE_DEG) angleX = 0;
          if (Math.abs(angleY) < DEAD_ZONE_DEG) angleY = 0;

          const nx = clamp(angleX / settings.maxX, -1, 1);
          const ny = clamp(angleY / settings.maxY, -1, 1);

          target.x = vw / 2 + nx * (vw / 2);
          target.y = vh / 2 + ny * (vh / 2);

          return;
        }
      }

      if (!state.hasAccel && state.pointer.has) {
        target.x = state.pointer.x;
        target.y = state.pointer.y;
        return;
      }

      target.x = vw / 2;
      target.y = vh / 2;
    }

    function frame() {
      computeTarget();

      pos.x += (target.x - pos.x) * CURSOR_SMOOTHING;
      pos.y += (target.y - pos.y) * CURSOR_SMOOTHING;

      pos.x = clamp(pos.x, 0, vw);
      pos.y = clamp(pos.y, 0, vh);

      cursorEl.style.transform = `translate3d(${pos.x}px, ${pos.y}px, 0)`;

      requestAnimationFrame(frame);
    }

    function resize() {
      vw = window.innerWidth;
      vh = window.innerHeight;
    }

    window.addEventListener("resize", resize);
    resize();

    function bindSlider(inputId, outputId, key) {
      const input = document.getElementById(inputId);
      const output = document.getElementById(outputId);

      const update = () => {
        settings[key] = parseFloat(input.value);
        output.textContent = `${Math.round(settings[key])}°`;
      };

      input.addEventListener("input", update);
      update();
    }

    bindSlider("maxX", "maxXOut", "maxX");
    bindSlider("maxY", "maxYOut", "maxY");

    overlay.addEventListener("click", () => {
      let permissionPromise = Promise.resolve("granted");

      if (
        "DeviceMotionEvent" in window &&
        typeof DeviceMotionEvent.requestPermission === "function"
      ) {
        permissionPromise = DeviceMotionEvent.requestPermission();
      }

      try {
        const fullscreenPromise = document.documentElement.requestFullscreen
          ? document.documentElement.requestFullscreen()
          : null;

        if (fullscreenPromise && fullscreenPromise.catch) {
          fullscreenPromise.catch(() => {});
        }
      } catch {
        // Полноэкранный режим не обязателен.
      }

      permissionPromise
        .then((result) => {
          if (result === "granted" || result === undefined) {
            if ("DeviceMotionEvent" in window) {
              window.addEventListener("devicemotion", onMotion);
            }

            state.motionEnabled = true;
            overlay.classList.add("hidden");
          } else {
            overlay.textContent = "Доступ к датчикам не разрешён.";
          }
        })
        .catch((error) => {
          const message = error && error.message ? error.message : String(error);
          overlay.textContent = `Ошибка: ${message}`;
        });
    });

    // Если нет датчиков, можно двигать курсор мышью/пальцем.
    window.addEventListener(
      "pointermove",
      (event) => {
        if (!state.hasAccel) {
          state.pointer.x = event.clientX;
          state.pointer.y = event.clientY;
          state.pointer.has = true;
        }
      },
      { passive: true }
    );

    // Двойной тап по экрану — повторная калибровка центра.
    let lastTap = 0;

    window.addEventListener(
      "pointerdown",
      (event) => {
        if (!state.motionEnabled) return;
        if (event.target.closest("#controls")) return;
        if (event.target.closest("#overlay")) return;

        const now = Date.now();

        if (now - lastTap < 300) {
          state.baseSet = false;
          state.samples = [];
        }

        lastTap = now;
      },
      { passive: true }
    );

    requestAnimationFrame(frame);
  </script>
</body>
</html>
