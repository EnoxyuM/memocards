<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>360</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
  }
  #pano-canvas {
    display: block;
    width: 100%; height: 100%;
    touch-action: none;
  }

  /* Окно, создаваемое по тапу */
  .pano-window {
    position: fixed;
    width: 240px;
    height: 160px;
    box-sizing: border-box;
    background: rgba(18, 18, 18, 0.92);
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.55);
    z-index: 10;
  }
</style>
</head>
<body>
<canvas id="pano-canvas"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';

  if (typeof THREE === 'undefined') {
    console.error('[pano] Three.js не загрузился');
    return;
  }

  /* ============================================================
     Тестовая панорама (4 стороны, FRONT виден сразу)
     ============================================================ */
  function generateTestPano() {
    const W = 2048, H = 1024;
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');

    ctx.fillStyle = '#4CAF50'; ctx.fillRect(0,     0, W/4, H);
    ctx.fillStyle = '#FFEB3B'; ctx.fillRect(W/4,   0, W/4, H);
    ctx.fillStyle = '#FF5722'; ctx.fillRect(W/2,   0, W/4, H);
    ctx.fillStyle = '#2196F3'; ctx.fillRect(3*W/4, 0, W/4, H);

    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 2;
    for (let i = 0; i <= 8; i++) {
      ctx.beginPath(); ctx.moveTo(i*W/8, 0); ctx.lineTo(i*W/8, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i*H/8); ctx.lineTo(W, i*H/8); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(0, H/2); ctx.lineTo(W, H/2); ctx.stroke();

    ctx.font = 'bold 140px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 8;
    ctx.strokeStyle = 'black';
    [
      ['FRONT',  W/2,   H/2],
      ['LEFT',   W/4,   H/2],
      ['RIGHT',  3*W/4, H/2],
      ['BACK',   0,     H/2],
      ['BACK',   W,     H/2],
      ['TOP',    W/2,   H*0.10],
      ['BOTTOM', W/2,   H*0.90]
    ].forEach(function (l) {
      ctx.strokeText(l[0], l[1], l[2]);
      ctx.fillStyle = 'white';
      ctx.fillText(l[0], l[1], l[2]);
    });

    return cv;
  }

  /* ============================================================
     Three.js
     ============================================================ */
  const canvas = document.getElementById('pano-canvas');
  const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

  const scene  = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1100);

  const tex = new THREE.CanvasTexture(generateTestPano());
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;

  const sphere = new THREE.Mesh(
    new THREE.SphereGeometry(500, 60, 40),
    new THREE.MeshBasicMaterial({ map: tex, side: THREE.BackSide })
  );
  sphere.rotation.y = Math.PI / 2;   // FRONT прямо перед камерой
  scene.add(sphere);

  /* ============================================================
     Resize
     ============================================================ */
  function resize() {
    let w = canvas.clientWidth  || window.innerWidth;
    let h = canvas.clientHeight || window.innerHeight;
    if (w < 10) w = window.innerWidth;
    if (h < 10) h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () {
    setTimeout(resize, 250);
  });

  /* ============================================================
     Гироскоп — включается сразу, на iOS — по первому тапу
     ============================================================ */
  let gyroOn = false;
  let requestInFlight = false;

  const dev = { alpha: 0, beta: 0, gamma: 0 };
  let screenOrient = window.orientation || 0;

  window.addEventListener('deviceorientation', function (e) {
    if (e.alpha == null && e.beta == null && e.gamma == null) return;
    dev.alpha = e.alpha || 0;
    dev.beta  = e.beta  || 0;
    dev.gamma = e.gamma || 0;
  });
  window.addEventListener('orientationchange', function () {
    screenOrient = window.orientation || 0;
  });

  function tryEnableGyro() {
    if (gyroOn || requestInFlight) return;

    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      // iOS 13+ — нужен жест пользователя (это вызывает Safari)
      requestInFlight = true;
      DeviceOrientationEvent.requestPermission()
        .then(function (p) {
          requestInFlight = false;
          if (p === 'granted') gyroOn = true;
        })
        .catch(function () {
          requestInFlight = false;
          // Safari отклонил без жеста — попробуем на следующем тапе
        });
    } else {
      // Android / desktop — включается сразу
      gyroOn = true;
    }
  }

  // 1) сразу на загрузке
  tryEnableGyro();

  // 2) на любой тап / клик (нужно только для iOS)
  document.addEventListener('touchstart', tryEnableGyro, { passive: true });
  document.addEventListener('click',      tryEnableGyro);

  /* ============================================================
     Применение гироскопа к камере
     ============================================================ */
  const DEG    = Math.PI / 180;
  const zee    = new THREE.Vector3(0, 0, 1);
  const _euler = new THREE.Euler();
  const q0     = new THREE.Quaternion();
  const q1     = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));

  function applyGyro() {
    const a = dev.alpha * DEG;
    const b = dev.beta  * DEG;
    const g = dev.gamma * DEG;
    const o = screenOrient * DEG;

    _euler.set(b, a, -g, 'YXZ');
    camera.quaternion.setFromEuler(_euler);
    camera.quaternion.multiply(q1);
    camera.quaternion.multiply(q0.setFromAxisAngle(zee, -o));
  }

  /* ============================================================
     Окно по тапу на панораме
     ============================================================ */
  const WIN_W = 240, WIN_H = 160;
  let panoWindow = null;

  canvas.addEventListener('click', function (e) {
    if (panoWindow) return;   // окно уже создано

    const x = Math.max(8, Math.min(e.clientX - WIN_W / 2, window.innerWidth  - WIN_W - 8));
    const y = Math.max(8, Math.min(e.clientY - WIN_H / 2, window.innerHeight - WIN_H - 8));

    panoWindow = document.createElement('div');
    panoWindow.className = 'pano-window';
    panoWindow.style.left = x + 'px';
    panoWindow.style.top  = y + 'px';
    document.body.appendChild(panoWindow);
  });

  /* ============================================================
     Рендер
     ============================================================ */
  function render() {
    requestAnimationFrame(render);
    if (gyroOn) applyGyro();
    renderer.render(scene, camera);
  }

  /* ============================================================
     Старт
     ============================================================ */
  resize();
  setTimeout(resize, 50);
  setTimeout(resize, 200);
  setTimeout(resize, 800);
  render();
})();
</script>
</body>
</html>
