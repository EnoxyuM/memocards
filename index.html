<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>360</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: #05080b;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
  }
  #pano-canvas {
    display: block;
    width: 100%; height: 100%;
    touch-action: none;
  }

  /* ---------- Start screen ---------- */
  #start-screen {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, #0a1118 0%, #04070a 72%);
    color: #5ad0ff;
    font: 600 30px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    letter-spacing: 0.08em;
    text-shadow: 0 0 20px rgba(90, 208, 255, 0.55);
    cursor: pointer;
    transition: opacity 0.45s ease;
    -webkit-user-select: none; user-select: none;
  }
  #start-screen.hidden {
    opacity: 0;
    pointer-events: none;
  }

  /* ---------- Crosshair ---------- */
  #crosshair {
    position: fixed;
    left: 50%; top: 50%;
    width: 22px; height: 22px;
    margin: -11px 0 0 -11px;
    z-index: 10;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  #crosshair.visible { opacity: 1; }
  #crosshair::before,
  #crosshair::after {
    content: '';
    position: absolute;
    background: #8fe4ff;
    box-shadow: 0 0 6px rgba(90, 208, 255, 0.9);
    border-radius: 1px;
  }
  #crosshair::before { left: 10px; top: 0; width: 2px; height: 22px; }
  #crosshair::after  { top: 10px; left: 0; width: 22px; height: 2px; }
</style>
</head>
<body>
<canvas id="pano-canvas"></canvas>
<div id="crosshair"></div>
<div id="start-screen">Tap to Start.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';

  if (typeof THREE === 'undefined') {
    console.error('[pano] Three.js не загрузился');
    return;
  }

  const DEG = Math.PI / 180;

  /* ============================================================
     Renderer / Scene / Camera
     ============================================================ */
  const canvas = document.getElementById('pano-canvas');
  const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x05080b, 1);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 2000);

  /* ============================================================
     Тёмное серо-чёрное окружение (только для рейкастов)
     ============================================================ */
  function generateDarkEnv() {
    const W = 2048, H = 1024;
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');

    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0,    '#0b1117');
    g.addColorStop(0.45, '#070b10');
    g.addColorStop(0.55, '#05080c');
    g.addColorStop(1,    '#030508');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = 'rgba(90, 200, 255, 0.045)';
    ctx.lineWidth = 1.5;
    for (let x = 0; x <= W; x += 64) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y <= H; y += 64) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    ctx.strokeStyle = 'rgba(90, 200, 255, 0.10)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); ctx.stroke();

    const tex = new THREE.CanvasTexture(cv);
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    return tex;
  }

  const sphere = new THREE.Mesh(
    new THREE.SphereGeometry(500, 48, 32),
    new THREE.MeshBasicMaterial({ map: generateDarkEnv(), side: THREE.BackSide })
  );
  scene.add(sphere);

  /* ============================================================
     Состояние
     ============================================================ */
  const windows = [];
  let activeWindow = null;
  let mode = null;            // { type:'move'|'resize', win, plant, progress, scaleT }
  let started = false;
  let lookMode = false;       // fallback: мышь/палец вместо гироскопа

  /* ============================================================
     Raycast helpers
     ============================================================ */
  const raycaster = new THREE.Raycaster();
  const CENTER_NDC = new THREE.Vector2(0, 0);

  function aimSpherePoint() {
    raycaster.setFromCamera(CENTER_NDC, camera);
    const hits = raycaster.intersectObject(sphere, false);
    return hits.length ? hits[0].point.clone() : null;
  }

  /* ============================================================
     Окна: отрисовка тёмного скина
     ============================================================ */
  const WIN_W = 96, WIN_H = 72;
  const TEX_W = 512, TEX_H = 384;
  const WINDOW_FONT = '500 38px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif';

  function wrapText(ctx, text, maxWidth) {
    const paragraphs = String(text).split('\n');
    const lines = [];
    for (let i = 0; i < paragraphs.length; i++) {
      const p = paragraphs[i];
      if (p === '') { lines.push(''); continue; }
      const words = p.split(/\s+/);
      let line = '';
      for (let j = 0; j < words.length; j++) {
        const test = line ? line + ' ' + words[j] : words[j];
        if (ctx.measureText(test).width > maxWidth && line) {
          lines.push(line);
          line = words[j];
        } else {
          line = test;
        }
      }
      lines.push(line);
    }
    return lines;
  }

  function drawWindowFace(ctx, W, H, text, active) {
    ctx.clearRect(0, 0, W, H);

    // фон-стекло
    const bg = ctx.createLinearGradient(0, 0, W, H);
    bg.addColorStop(0,   '#0b141b');
    bg.addColorStop(0.5, '#0c1a24');
    bg.addColorStop(1,   '#071016');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    const sheen = ctx.createLinearGradient(0, 0, W, H);
    sheen.addColorStop(0,    'rgba(90,208,255,0.10)');
    sheen.addColorStop(0.45, 'rgba(90,208,255,0.00)');
    sheen.addColorStop(1,    'rgba(90,208,255,0.06)');
    ctx.fillStyle = sheen;
    ctx.fillRect(0, 0, W, H);

    // рама
    const frame = active ? '#5ad0ff' : '#294553';
    const soft  = active ? 'rgba(90,208,255,0.55)' : 'rgba(90,208,255,0.16)';

    ctx.lineWidth = 12;
    ctx.strokeStyle = frame;
    ctx.strokeRect(6, 6, W - 12, H - 12);

    ctx.lineWidth = 2;
    ctx.strokeStyle = soft;
    ctx.strokeRect(24, 24, W - 48, H - 48);

    // верхняя акцентная полоса
    ctx.fillStyle = active ? 'rgba(90,208,255,0.85)' : 'rgba(90,208,255,0.25)';
    ctx.fillRect(32, 32, W - 64, 5);

    // уголки
    ctx.strokeStyle = active ? '#8fe4ff' : 'rgba(120,180,210,0.35)';
    ctx.lineWidth = 5;
    const c = 22, m = 20;
    ctx.beginPath();
    ctx.moveTo(m, m + c);           ctx.lineTo(m, m);           ctx.lineTo(m + c, m);
    ctx.moveTo(W - m - c, m);       ctx.lineTo(W - m, m);       ctx.lineTo(W - m, m + c);
    ctx.moveTo(W - m, H - m - c);   ctx.lineTo(W - m, H - m);   ctx.lineTo(W - m - c, H - m);
    ctx.moveTo(m + c, H - m);       ctx.lineTo(m, H - m);       ctx.lineTo(m, H - m - c);
    ctx.stroke();

    // текст
    ctx.font = WINDOW_FONT;
    const lines = wrapText(ctx, text || '', W - 100).slice(0, 5);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = active ? '#e9f8ff' : '#a9cbdb';
    const lh = 46;
    const startY = H / 2 + 6 - (lines.length - 1) * lh / 2;
    for (let i = 0; i < lines.length; i++) {
      ctx.fillText(lines[i], W / 2, startY + i * lh);
    }
  }

  /* ============================================================
     Окна: создание/обновление
     ============================================================ */
  function makeSide() {
    const cv = document.createElement('canvas');
    cv.width = TEX_W; cv.height = TEX_H;
    const ctx = cv.getContext('2d');
    const tex = new THREE.CanvasTexture(cv);
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    const mesh = new THREE.Mesh(
      new THREE.PlaneGeometry(WIN_W, WIN_H),
      new THREE.MeshBasicMaterial({ map: tex, transparent: true })
    );
    return { cv: cv, ctx: ctx, tex: tex, mesh: mesh };
  }

  function makeWindow(text) {
    const group = new THREE.Group();
    const inner = new THREE.Group();
    group.add(inner);

    const front = makeSide();
    const back  = makeSide();

    front.mesh.position.z = 0.35;
    back.mesh.position.z  = -0.35;
    back.mesh.rotation.y  = Math.PI;

    inner.add(front.mesh);
    inner.add(back.mesh);

    const win = {
      group: group,
      inner: inner,
      front: front,
      back: back,
      frontText: text || '',
      backText: '',
      flipped: false,
      active: false,
      scale: 1
    };

    drawWindowFace(front.ctx, TEX_W, TEX_H, win.frontText, false);
    drawWindowFace(back.ctx,  TEX_W, TEX_H, win.backText,  false);
    front.tex.needsUpdate = true;
    back.tex.needsUpdate = true;

    return win;
  }

  function refreshWindowTextures(win) {
    drawWindowFace(win.front.ctx, TEX_W, TEX_H, win.frontText, win.active);
    drawWindowFace(win.back.ctx,  TEX_W, TEX_H, win.backText,  win.active);
    win.front.tex.needsUpdate = true;
    win.back.tex.needsUpdate = true;
  }

  function placeWindowAt(win, point) {
    win.group.position.copy(point).multiplyScalar(0.985);
    win.group.lookAt(0, 0, 0);
    win.group.scale.setScalar(win.scale);
  }

  function createWindowAtScreen(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const ndc = new THREE.Vector2(
      ((clientX - rect.left) / rect.width) * 2 - 1,
      -((clientY - rect.top) / rect.height) * 2 + 1
    );
    raycaster.setFromCamera(ndc, camera);
    const hits = raycaster.intersectObject(sphere, false);
    if (!hits.length) return;

    const win = makeWindow('');
    placeWindowAt(win, hits[0].point);
    scene.add(win.group);
    windows.push(win);
    setActiveWindow(win);
  }

  function removeWindow(win) {
    scene.remove(win.group);
    [win.front, win.back].forEach(function (side) {
      side.mesh.geometry.dispose();
      if (side.mesh.material.map) side.mesh.material.map.dispose();
      side.mesh.material.dispose();
      side.tex.dispose();
    });

    const i = windows.indexOf(win);
    if (i !== -1) windows.splice(i, 1);

    if (activeWindow === win) {
      activeWindow = null;
      if (windows.length) {
        setActiveWindow(windows[windows.length - 1]);
      } else {
        updateStarButton();
        updateButtonEnabled();
      }
    }
  }

  function setActiveWindow(win) {
    if (activeWindow === win) return;
    const prev = activeWindow;
    activeWindow = win;
    if (prev) { prev.active = false; refreshWindowTextures(prev); }
    if (win)  { win.active  = true;  refreshWindowTextures(win);  }
    updateStarButton();
    updateButtonEnabled();
  }

  /* ============================================================
     Кнопки (3D, в правом верхнем углу мира)
     ============================================================ */
  const BTN_R      = 0.18;
  const BTN_DIST   = 3.0;
  const BTN_EL     = 20 * DEG;
  const BTN_AZ     = [17, 8.5, 0, -8.5, -17].map(function (v) { return v * DEG; });

  const BTN_DEFS = [
    { id: 'close',  az: BTN_AZ[0] },
    { id: 'move',   az: BTN_AZ[1] },
    { id: 'resize', az: BTN_AZ[2] },
    { id: 'text',   az: BTN_AZ[3] },
    { id: 'flip',   az: BTN_AZ[4] }
  ];

  function drawButtonFace(btn, kind) {
    const S = 256;
    const ctx = btn.baseCtx;
    ctx.clearRect(0, 0, S, S);

    ctx.beginPath();
    ctx.arc(S / 2, S / 2, S / 2 - 8, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(7, 13, 19, 0.88)';
    ctx.fill();
    ctx.lineWidth = 6;
    ctx.strokeStyle = 'rgba(90, 208, 255, 0.85)';
    ctx.stroke();

    const cx = S / 2, cy = S / 2, r = S * 0.23;

    ctx.strokeStyle = '#8fe4ff';
    ctx.fillStyle = '#8fe4ff';
    ctx.lineWidth = 14;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    if (kind === 'close') {
      ctx.beginPath();
      ctx.moveTo(cx - r * 0.62, cy - r * 0.62);
      ctx.lineTo(cx + r * 0.62, cy + r * 0.62);
      ctx.moveTo(cx + r * 0.62, cy - r * 0.62);
      ctx.lineTo(cx - r * 0.62, cy + r * 0.62);
      ctx.stroke();
    } else if (kind === 'move') {
      ctx.beginPath();
      ctx.rect(cx - r * 0.62, cy - r * 0.62, r * 1.24, r * 1.24);
      ctx.stroke();
    } else if (kind === 'resize') {
      ctx.beginPath();
      ctx.moveTo(cx, cy - r * 0.85);
      ctx.lineTo(cx + r * 0.85, cy + r * 0.62);
      ctx.lineTo(cx - r * 0.85, cy + r * 0.62);
      ctx.closePath();
      ctx.stroke();
    } else if (kind === 'text') {
      ctx.beginPath();
      ctx.arc(cx, cy, r * 0.72, 0, Math.PI * 2);
      ctx.stroke();
    } else if (kind === 'flip-filled' || kind === 'flip-hollow') {
      const spikes = 5, outer = r * 0.95, inner = r * 0.42;
      ctx.beginPath();
      for (let i = 0; i < spikes * 2; i++) {
        const rad = (i % 2 === 0) ? outer : inner;
        const a = -Math.PI / 2 + i * Math.PI / spikes;
        const x = cx + Math.cos(a) * rad;
        const y = cy + Math.sin(a) * rad;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath();
      if (kind === 'flip-filled') ctx.fill(); else ctx.stroke();
    }

    btn.baseTex.needsUpdate = true;
  }

  function makeButton(def) {
    const group = new THREE.Group();

    const dir = new THREE.Vector3(
      Math.sin(def.az) * Math.cos(BTN_EL),
      Math.sin(BTN_EL),
      -Math.cos(def.az) * Math.cos(BTN_EL)
    );
    group.position.copy(dir).multiplyScalar(BTN_DIST);
    group.lookAt(0, 0, 0);

    const baseCv = document.createElement('canvas');
    baseCv.width = 256; baseCv.height = 256;
    const baseCtx = baseCv.getContext('2d');
    const baseTex = new THREE.CanvasTexture(baseCv);
    baseTex.minFilter = THREE.LinearFilter;
    baseTex.magFilter = THREE.LinearFilter;

    const base = new THREE.Mesh(
      new THREE.CircleGeometry(BTN_R, 48),
      new THREE.MeshBasicMaterial({ map: baseTex, transparent: true, depthTest: false, depthWrite: false })
    );
    base.renderOrder = 30;
    group.add(base);

    const ring = new THREE.Mesh(
      new THREE.RingGeometry(BTN_R + 0.04, BTN_R + 0.07, 48),
      new THREE.MeshBasicMaterial({
        color: 0x5ad0ff, transparent: true, opacity: 0.9,
        side: THREE.DoubleSide, depthTest: false, depthWrite: false
      })
    );
    ring.renderOrder = 31;
    ring.visible = false;
    group.add(ring);

    const prog = new THREE.Mesh(
      new THREE.CircleGeometry(BTN_R + 0.04, 48),
      new THREE.MeshBasicMaterial({
        color: 0x5ad0ff, transparent: true, opacity: 0.35,
        side: THREE.DoubleSide, depthTest: false, depthWrite: false
      })
    );
    prog.renderOrder = 32;
    prog.visible = false;
    prog.scale.setScalar(0.0001);
    group.add(prog);

    const btn = {
      def: def,
      group: group,
      base: base,
      ring: ring,
      prog: prog,
      baseCv: baseCv,
      baseCtx: baseCtx,
      baseTex: baseTex,
      progress: 0,
      armed: true,
      kind: def.id
    };

    drawButtonFace(btn, def.id === 'flip' ? 'flip-filled' : def.id);
    return btn;
  }

  const buttons = BTN_DEFS.map(makeButton);
  buttons.forEach(function (b) { scene.add(b.group); });

  function updateStarButton() {
    const b = buttons.find(function (x) { return x.kind === 'flip'; });
    if (!b) return;
    const flipped = activeWindow ? activeWindow.flipped : false;
    drawButtonFace(b, flipped ? 'flip-hollow' : 'flip-filled');
  }

  function updateButtonEnabled() {
    const on = !!activeWindow;
    for (let i = 0; i < buttons.length; i++) {
      const b = buttons[i];
      b.base.material.transparent = true;
      b.base.material.opacity = on ? 1 : 0.28;
    }
  }

  /* ============================================================
     Действия кнопок
     ============================================================ */
  function fireButton(btn) {
    const win = activeWindow;
    if (!win) return;

    if (btn.kind === 'close') {
      removeWindow(win);
    } else if (btn.kind === 'move') {
      startMode('move', win);
    } else if (btn.kind === 'resize') {
      startMode('resize', win);
    } else if (btn.kind === 'text') {
      editWindowText(win);
    } else if (btn.kind === 'flip') {
      win.flipped = !win.flipped;
      win.inner.rotation.y = win.flipped ? Math.PI : 0;
      refreshWindowTextures(win);
      updateStarButton();
    }
  }

  function editWindowText(win) {
    const current = win.flipped ? win.backText : win.frontText;
    const value = window.prompt('Window text:', current);
    if (value === null) return;
    if (win.flipped) win.backText = value;
    else win.frontText = value;
    refreshWindowTextures(win);
  }

  /* ============================================================
     Режимы move / resize (кружок у перекрестия, удержание 1 сек)
     ============================================================ */
  const MODE_TOLERANCE = 6 * DEG;
  const MODE_DURATION  = 1.0;

  const modeRing = new THREE.Mesh(
    new THREE.RingGeometry(0.93, 1.0, 64),
    new THREE.MeshBasicMaterial({
      color: 0x5ad0ff, transparent: true, opacity: 0.9,
      side: THREE.DoubleSide, depthTest: false, depthWrite: false
    })
  );
  modeRing.renderOrder = 40;
  modeRing.visible = false;
  scene.add(modeRing);

  const modeFill = new THREE.Mesh(
    new THREE.CircleGeometry(1, 64),
    new THREE.MeshBasicMaterial({
      color: 0x5ad0ff, transparent: true, opacity: 0.22,
      side: THREE.DoubleSide, depthTest: false, depthWrite: false
    })
  );
  modeFill.renderOrder = 39;
  modeFill.visible = false;
  scene.add(modeFill);

  function startMode(type, win) {
    const aim = aimSpherePoint();
    if (!aim) return;
    mode = {
      type: type,
      win: win,
      plant: aim,
      progress: 0,
      scaleT: 0
    };
    updateModeRingVisuals();
  }

  function updateModeRingVisuals() {
    if (!mode) { modeRing.visible = false; modeFill.visible = false; return; }

    const p = mode.plant.clone().multiplyScalar(0.965);
    const dist = p.length();
    const R = dist * Math.tan(MODE_TOLERANCE);

    modeRing.position.copy(p);
    modeRing.lookAt(0, 0, 0);
    modeRing.scale.setScalar(R);
    modeRing.visible = true;

    const pr = Math.max(0, Math.min(1, mode.progress / MODE_DURATION));
    modeFill.position.copy(p).multiplyScalar(0.998);
    modeFill.lookAt(0, 0, 0);
    modeFill.scale.setScalar(Math.max(0.0001, R * pr));
    modeFill.visible = pr > 0.001;
  }

  function updateMode(dt) {
    if (!mode) return;

    const aim = aimSpherePoint();
    if (!aim) return;

    const plantDir = mode.plant.clone().normalize();
    const aimDir = aim.clone().normalize();
    const ang = Math.acos(Math.max(-1, Math.min(1, plantDir.dot(aimDir))));

    if (ang > MODE_TOLERANCE) {
      mode.plant.copy(aim);
      mode.progress = 0;
    } else {
      mode.progress += dt;
    }

    if (mode.type === 'move') {
      placeWindowAt(mode.win, aim);
    } else if (mode.type === 'resize') {
      if (mode.progress === 0) mode.scaleT += dt;
      const base = 1.35 + 0.85 * Math.sin(mode.scaleT * 1.7);
      mode.win.scale = Math.max(0.55, Math.min(2.2, base));
      mode.win.group.scale.setScalar(mode.win.scale);
    }

    updateModeRingVisuals();

    if (mode.progress >= MODE_DURATION) {
      mode = null;
      modeRing.visible = false;
      modeFill.visible = false;
    }
  }

  /* ============================================================
     Наведение перекрестия на кнопки (gaze)
     ============================================================ */
  const _camDir = new THREE.Vector3();

  function updateButtons(dt) {
    camera.getWorldDirection(_camDir);

    const enabled = !!activeWindow;
    const START_ANG = 3.4;
    const KEEP_ANG  = 4.9;

    for (let i = 0; i < buttons.length; i++) {
      const btn = buttons[i];

      const dir = btn.group.position.clone().normalize();
      const ang = Math.acos(Math.max(-1, Math.min(1, _camDir.dot(dir)))) * 180 / Math.PI;

      if (!enabled || mode) {
        btn.progress = 0;
        btn.armed = true;
        btn.ring.visible = false;
        btn.prog.visible = false;
        btn.prog.scale.setScalar(0.0001);
        continue;
      }

      if (!btn.armed && ang > 8) btn.armed = true;

      if (btn.progress > 0) {
        if (ang > KEEP_ANG) {
          btn.progress = 0;
        } else {
          btn.progress += dt;
          if (btn.progress >= 1) {
            btn.progress = 0;
            btn.armed = false;
            fireButton(btn);
          }
        }
      } else {
        if (btn.armed && ang < START_ANG) {
          btn.progress = 0.0001;
        }
      }

      const show = btn.progress > 0;
      btn.ring.visible = show;
      btn.prog.visible = show;
      btn.prog.scale.setScalar(show ? Math.max(0.0001, btn.progress) : 0.0001);
    }
  }

  /* ============================================================
     Выбор активного окна взглядом
     ============================================================ */
  const _meshList = [];

  function updateWindowSelection() {
    if (mode) return;
    _meshList.length = 0;
    for (let i = 0; i < windows.length; i++) {
      _meshList.push(windows[i].front.mesh, windows[i].back.mesh);
    }
    if (!_meshList.length) return;

    raycaster.setFromCamera(CENTER_NDC, camera);
    const hits = raycaster.intersectObjects(_meshList, false);
    if (!hits.length) return;

    const obj = hits[0].object;
    for (let i = 0; i < windows.length; i++) {
      const w = windows[i];
      if (w.front.mesh === obj || w.back.mesh === obj) {
        if (w !== activeWindow) setActiveWindow(w);
        return;
      }
    }
  }

  /* ============================================================
     Гироскоп (как в оригинале)
     ============================================================ */
  let gyroOn = false;
  let gyroFailed = false;
  let requestInFlight = false;
  let gotOrientation = false;

  const dev = { alpha: 0, beta: 0, gamma: 0 };
  let screenOrient = window.orientation || 0;

  window.addEventListener('deviceorientation', function (e) {
    if (e.alpha == null && e.beta == null && e.gamma == null) return;
    gotOrientation = true;
    dev.alpha = e.alpha || 0;
    dev.beta  = e.beta  || 0;
    dev.gamma = e.gamma || 0;
  });

  window.addEventListener('orientationchange', function () {
    screenOrient = window.orientation || 0;
  });

  function tryEnableGyro() {
    if (gyroOn || requestInFlight || gyroFailed) return;

    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      requestInFlight = true;
      DeviceOrientationEvent.requestPermission()
        .then(function (p) {
          requestInFlight = false;
          if (p === 'granted') gyroOn = true;
        })
        .catch(function () {
          requestInFlight = false;
        });
    } else {
      gyroOn = true;
    }
  }

  document.addEventListener('touchstart', tryEnableGyro, { passive: true });
  document.addEventListener('click', tryEnableGyro);

  /* ============================================================
     Применение гироскопа к камере
     ============================================================ */
  const zee    = new THREE.Vector3(0, 0, 1);
  const _euler = new THREE.Euler();
  const q0     = new THREE.Quaternion();
  const q1     = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));

  function applyGyro() {
    const a = dev.alpha * DEG;
    const b = dev.beta  * DEG;
    const g = dev.gamma * DEG;
    const o = screenOrient * DEG;

    _euler.set(b, a, -g, 'YXZ');
    camera.quaternion.setFromEuler(_euler);
    camera.quaternion.multiply(q1);
    camera.quaternion.multiply(q0.setFromAxisAngle(zee, -o));
  }

  /* ============================================================
     Fallback: мышь/палец, если гироскоп не пришёл
     ============================================================ */
  let lookYaw = 0, lookPitch = 0;
  const _lookEuler = new THREE.Euler(0, 0, 0, 'YXZ');

  function applyLook() {
    _lookEuler.set(lookPitch, lookYaw, 0, 'YXZ');
    camera.quaternion.setFromEuler(_lookEuler);
  }

  /* ============================================================
     Resize
     ============================================================ */
  function resize() {
    let w = canvas.clientWidth  || window.innerWidth;
    let h = canvas.clientHeight || window.innerHeight;
    if (w < 10) w = window.innerWidth;
    if (h < 10) h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () {
    setTimeout(resize, 250);
  });

  /* ============================================================
     Ввод: старт + тап-создание окна + drag-look (fallback)
     ============================================================ */
  const startScreen = document.getElementById('start-screen');
  const crosshair = document.getElementById('crosshair');

  function begin() {
    if (started) return;
    started = true;
    startScreen.classList.add('hidden');
    crosshair.classList.add('visible');
    tryEnableGyro();

    setTimeout(function () {
      if (!gotOrientation) {
        gyroOn = false;
        gyroFailed = true;
        lookMode = true;
      }
    }, 2500);
  }
  startScreen.addEventListener('pointerdown', begin);

  let pointerInfo = null;

  canvas.addEventListener('pointerdown', function (e) {
    if (!started) return;
    pointerInfo = {
      id: e.pointerId,
      lastX: e.clientX,
      lastY: e.clientY,
      moved: 0,
      t: performance.now()
    };
    if (lookMode && canvas.setPointerCapture) {
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    }
  });

  canvas.addEventListener('pointermove', function (e) {
    if (!pointerInfo || e.pointerId !== pointerInfo.id) return;

    const dx = e.clientX - pointerInfo.lastX;
    const dy = e.clientY - pointerInfo.lastY;
    pointerInfo.lastX = e.clientX;
    pointerInfo.lastY = e.clientY;
    pointerInfo.moved += Math.abs(dx) + Math.abs(dy);

    if (lookMode) {
      lookYaw   -= dx * 0.0045;
      lookPitch -= dy * 0.0045;
      lookPitch = Math.max(-1.25, Math.min(1.25, lookPitch));
    }
  });

  canvas.addEventListener('pointerup', function (e) {
    if (!pointerInfo || e.pointerId !== pointerInfo.id) {
      pointerInfo = null;
      return;
    }
    const info = pointerInfo;
    pointerInfo = null;

    if (!started) return;
    if (info.moved < 12 && performance.now() - info.t < 700) {
      if (!mode) createWindowAtScreen(e.clientX, e.clientY);
    }
  });

  canvas.addEventListener('pointercancel', function () {
    pointerInfo = null;
  });

  /* ============================================================
     Рендер
     ============================================================ */
  let lastTime = performance.now();

  function render(now) {
    requestAnimationFrame(render);

    const t = (typeof now === 'number') ? now : performance.now();
    const dt = Math.min(0.05, Math.max(0, (t - lastTime) / 1000));
    lastTime = t;

    if (gyroOn) applyGyro();
    else if (lookMode) applyLook();

    if (started) {
      updateWindowSelection();
      updateButtons(dt);
      updateMode(dt);
    }

    renderer.render(scene, camera);
  }

  /* ============================================================
     Старт
     ============================================================ */
  updateButtonEnabled();
  updateStarButton();

  resize();
  setTimeout(resize, 50);
  setTimeout(resize, 200);
  setTimeout(resize, 800);

  requestAnimationFrame(render);
})();
</script>
</body>
</html>
