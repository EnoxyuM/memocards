<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>360</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000;
    -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  #pano-canvas { display:block; width:100%; height:100%; touch-action:none; }
</style>
</head>
<body>
<canvas id="pano-canvas"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';
  if (typeof THREE === 'undefined') return;

  /* ---- Тестовая панорама ---- */
  function generateTestPano() {
    const W = 2048, H = 1024;
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');

    ctx.fillStyle = '#4CAF50'; ctx.fillRect(0,     0, W/4, H);
    ctx.fillStyle = '#FFEB3B'; ctx.fillRect(W/4,   0, W/4, H);
    ctx.fillStyle = '#FF5722'; ctx.fillRect(W/2,   0, W/4, H);
    ctx.fillStyle = '#2196F3'; ctx.fillRect(3*W/4, 0, W/4, H);

    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 2;
    for (let i = 0; i <= 8; i++) {
      ctx.beginPath(); ctx.moveTo(i*W/8, 0); ctx.lineTo(i*W/8, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i*H/8); ctx.lineTo(W, i*H/8); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(0, H/2); ctx.lineTo(W, H/2); ctx.stroke();

    ctx.font = 'bold 140px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 8; ctx.strokeStyle = 'black';
    [
      ['FRONT',  W/2,   H/2], ['LEFT',   W/4,   H/2], ['RIGHT',  3*W/4, H/2],
      ['BACK',   0,     H/2], ['BACK',   W,     H/2],
      ['TOP',    W/2,   H*0.10], ['BOTTOM', W/2,   H*0.90]
    ].forEach(function (l) {
      ctx.strokeText(l[0], l[1], l[2]);
      ctx.fillStyle = 'white';
      ctx.fillText(l[0], l[1], l[2]);
    });
    return cv;
  }

  /* ---- Three.js ---- */
  const canvas = document.getElementById('pano-canvas');
  const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

  const scene  = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1100);
  camera.rotation.order = 'YXZ';

  const tex = new THREE.CanvasTexture(generateTestPano());
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;

  const sphere = new THREE.Mesh(
    new THREE.SphereGeometry(500, 60, 40),
    new THREE.MeshBasicMaterial({ map: tex, side: THREE.BackSide })
  );
  sphere.rotation.y = Math.PI / 2;
  scene.add(sphere);

  function resize() {
    let w = canvas.clientWidth  || window.innerWidth;
    let h = canvas.clientHeight || window.innerHeight;
    if (w < 10) w = window.innerWidth;
    if (h < 10) h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 250); });

  /* ============================================================
     ГИРОСКОП — ОДИН источник, залочен после первых валидных данных
     ============================================================ */
  const dev = { alpha: 0, beta: 0, gamma: 0 };
  let gotGyroData   = false;
  let lockedSource  = null;          // 'absolute' | 'relative' | null
  let permissionGranted = false;
  let requestInFlight   = false;
  let screenOrient = window.orientation || 0;

  function acceptEvent(e) {
    // только реальные числа (null/undefined → отбрасываем)
    if (typeof e.alpha !== 'number' ||
        typeof e.beta  !== 'number' ||
        typeof e.gamma !== 'number') return false;
    dev.alpha = e.alpha;
    dev.beta  = e.beta;
    dev.gamma = e.gamma;
    if (!gotGyroData) {
      gotGyroData = true;
      console.log('[pano] gyro locked to:', lockedSource);
    }
    return true;
  }

  window.addEventListener('deviceorientationabsolute', function (e) {
    if (lockedSource === 'relative') return;            // уже выбрали relative — игнор
    if (lockedSource === 'absolute') { acceptEvent(e); return; }
    if (acceptEvent(e)) lockedSource = 'absolute';      // первый валидный — фиксируем
  });

  window.addEventListener('deviceorientation', function (e) {
    if (lockedSource === 'absolute') return;            // уже выбрали absolute — игнор
    if (lockedSource === 'relative') { acceptEvent(e); return; }
    if (acceptEvent(e)) lockedSource = 'relative';      // первый валидный — фиксируем
  });

  window.addEventListener('orientationchange', function () {
    screenOrient = window.orientation || 0;
  });

  /* ---- iOS 13+: requestPermission из жеста ---- */
  function tryEnableGyro() {
    if (permissionGranted || requestInFlight) return;
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      requestInFlight = true;
      DeviceOrientationEvent.requestPermission()
        .then(function (p) {
          requestInFlight = false;
          if (p === 'granted') permissionGranted = true;
        })
        .catch(function () { requestInFlight = false; });
    } else {
      permissionGranted = true;   // Android: жест всё равно нужен браузеру, но не нам
    }
  }
  tryEnableGyro();
  document.addEventListener('touchstart',  tryEnableGyro, { passive: true });
  document.addEventListener('pointerdown', tryEnableGyro);
  document.addEventListener('click',       tryEnableGyro);
  document.addEventListener('keydown',     tryEnableGyro);

  /* ---- Применение к камере ---- */
  const DEG = Math.PI / 180;
  const ZEE = new THREE.Vector3(0, 0, 1);
  const _euler = new THREE.Euler();
  const Q0 = new THREE.Quaternion();
  const Q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));

  function applyGyro() {
    _euler.set(dev.beta * DEG, dev.alpha * DEG, -dev.gamma * DEG, 'YXZ');
    camera.quaternion.setFromEuler(_euler);
    camera.quaternion.multiply(Q1);
    Q0.setFromAxisAngle(ZEE, -screenOrient * DEG);
    camera.quaternion.multiply(Q0);
  }

  /* ---- Рендер ---- */
  function render() {
    requestAnimationFrame(render);
    if (gotGyroData) applyGyro();
    renderer.render(scene, camera);
  }

  resize();
  setTimeout(resize, 50);
  setTimeout(resize, 200);
  setTimeout(resize, 800);
  render();
})();
</script>
</body>
</html>
