<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=5.0,user-scalable=yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>360 Panorama Test</title>

<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; height: 100%; }
  #wrap { min-height: 0; height: 100%; }
  #pano_container { position: relative; width: 100%; height: 100%; }
  #mobile_krp_div { width: 100%; height: 100%; }
  #mobile_pano_object { width: 100%; height: 100%; position: relative; }
  #pano-canvas { width: 100%; height: 100%; display: block; touch-action: none; }

  /* --- ИЗ ИСХОДНИКА: кнопки панорамы --- */
  @media all and (orientation: portrait) {
    #normal_screen_pano_buttons { height: 16%; width: 70%; }
    #fullscreen_pano_buttons    { height: 10%; width: 50%; }
    .mobile_pano_vr_view img { margin-left: 0; }
    .mobile_gyro_toggle img  { margin-left: 20px; }
  }
  @media all and (orientation: landscape) {
    #normal_screen_pano_buttons { height: 24%; width: 30%; }
    #fullscreen_pano_buttons    { height: 14%; width: 35%; }
  }

  #normal_screen_pano_buttons .mobile_icon { height: 40%; }
  #normal_screen_pano_buttons {
    display: inline-block;
    position: absolute;
    top: 0; right: 0;
    z-index: 100;
  }
  #fullscreen_pano_buttons {
    display: none;
    position: absolute;
    top: 0; right: 0;
    z-index: 100;
  }
  #fullscreen_pano_buttons div { height: 100%; width: 30%; display: inline-block; }

  .mobile_icon {
    opacity: 0.8;
    margin-top: 30%;
    margin-left: auto;
    margin-right: auto;
    display: block;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
  }
  #fullscreen_pano_buttons .mobile_icon { height: 50%; }
  #normal_screen_pano_buttons div { height: 100%; width: 20%; display: inline-block; }
  .mobile_pano_vr_view, .mobile_gyro_toggle { float: left; }

  /* --- ИЗ ИСХОДНИКА: подпись под панорамой --- */
  #mobile_pano_labels {
    display: inline-block;
    position: absolute;
    bottom: 0; left: 0;
    width: 100%;
    background: none;
    opacity: 0.80;
    text-shadow: -1px 0 2px black, 0 1px 2px black, 1px 0 2px black, 0 -1px 2px black;
    font-family: 'Roboto Condensed', sans-serif;
    font-size: 16px;
    color: #FFFFFF;
    margin-bottom: 6px;
    padding-left: 6px;
    padding-right: 6px;
    box-sizing: border-box;
    pointer-events: none;
    z-index: 50;
  }
  #mobile_pano_labels a { color: #FFFFFF !important; pointer-events: auto; }

  /* --- ИЗ ИСХОДНИКА: меню Share --- */
  #pano_share_menu_mobile {
    display: none;
    position: absolute;
    left: 50%; top: 20px;
    transform: translateX(-50%);
    width: 320px;
    padding: 16px;
    border-radius: 6px;
    background-color: rgba(62, 66, 70, 0.92);
    border: 1px solid rgba(212, 212, 212, 0.7);
    z-index: 200;
    box-sizing: border-box;
    font-family: sans-serif;
  }
  #pano_share_menu_mobile .share-title {
    color: #fff; font-weight: bold; font-size: 18px; display: block; margin-bottom: 10px;
  }
  #pano_share_menu_mobile .share-close {
    position: absolute; top: 8px; right: 12px;
    color: #fff; font-size: 22px; font-weight: bold;
    cursor: pointer; line-height: 1;
  }
  #pano_share_menu_mobile .share-row { display: flex; gap: 8px; margin-top: 10px; }
  #pano_share_menu_mobile input {
    flex: 1; min-width: 0; padding: 8px;
    border: 1px solid #ccc; border-radius: 4px; font-size: 13px; box-sizing: border-box;
  }
  #pano_share_menu_mobile button {
    padding: 8px 14px; border: 0; border-radius: 4px;
    background: #c33135; color: #fff; font-weight: bold; cursor: pointer;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="pano_container">
    <div id="mobile_pano_object">

      <div id="mobile_krp_div">
        <canvas id="pano-canvas"></canvas>
      </div>

      <!-- Обычные кнопки -->
      <div id="normal_screen_pano_buttons" style="display:flex; justify-content:space-between;">
        <div class="mobile_pano_vr_view">
          <svg class="mobile_icon" viewBox="0 0 100 100" id="vr-btn">
            <rect x="8" y="30" width="84" height="40" rx="10" fill="none" stroke="white" stroke-width="4"/>
            <circle cx="35" cy="50" r="10" fill="none" stroke="white" stroke-width="3"/>
            <circle cx="65" cy="50" r="10" fill="none" stroke="white" stroke-width="3"/>
          </svg>
        </div>
        <div class="mobile_gyro_toggle">
          <svg class="mobile_icon" viewBox="0 0 100 100" id="gyro-btn">
            <circle cx="50" cy="50" r="28" fill="none" stroke="white" stroke-width="3" opacity="0.4"/>
            <path d="M50 22 A28 28 0 0 1 78 50" fill="none" stroke="white" stroke-width="4"/>
            <path d="M78 50 L71 42 M78 50 L85 42" stroke="white" stroke-width="4" fill="none"/>
          </svg>
        </div>
        <div class="mobile_pano_share_view">
          <svg class="mobile_icon" viewBox="0 0 100 100" id="share-btn">
            <circle cx="72" cy="25" r="10" fill="white"/>
            <circle cx="72" cy="75" r="10" fill="white"/>
            <circle cx="28" cy="50" r="10" fill="white"/>
            <line x1="37" y1="45" x2="63" y2="30" stroke="white" stroke-width="4"/>
            <line x1="37" y1="55" x2="63" y2="70" stroke="white" stroke-width="4"/>
          </svg>
        </div>
        <div id="mobile_pano_fullscreen" style="color:white; margin-right:12px;">
          <svg class="mobile_icon" viewBox="0 0 100 100" id="fullscreen-btn">
            <polyline points="15,35 15,15 35,15" fill="none" stroke="white" stroke-width="5"/>
            <polyline points="65,15 85,15 85,35" fill="none" stroke="white" stroke-width="5"/>
            <polyline points="15,65 15,85 35,85" fill="none" stroke="white" stroke-width="5"/>
            <polyline points="85,65 85,85 65,85" fill="none" stroke="white" stroke-width="5"/>
          </svg>
        </div>
      </div>

      <!-- Кнопки во fullscreen -->
      <div id="fullscreen_pano_buttons" style="display:none; justify-content:space-between; width:80%">
        <div class="mobile_pano_vr_view" style="margin:auto;">
          <svg class="mobile_icon" viewBox="0 0 100 100" id="vr-btn-fs">
            <rect x="8" y="30" width="84" height="40" rx="10" fill="none" stroke="white" stroke-width="4"/>
            <circle cx="35" cy="50" r="10" fill="none" stroke="white" stroke-width="3"/>
            <circle cx="65" cy="50" r="10" fill="none" stroke="white" stroke-width="3"/>
          </svg>
        </div>
        <div class="mobile_gyro_toggle" style="margin:auto;">
          <svg class="mobile_icon" viewBox="0 0 100 100" id="gyro-btn-fs">
            <circle cx="50" cy="50" r="28" fill="none" stroke="white" stroke-width="3" opacity="0.4"/>
            <path d="M50 22 A28 28 0 0 1 78 50" fill="none" stroke="white" stroke-width="4"/>
            <path d="M78 50 L71 42 M78 50 L85 42" stroke="white" stroke-width="4" fill="none"/>
          </svg>
        </div>
        <div class="mobile_pano_share_view" style="margin-left:-8px;">
          <svg class="mobile_icon" viewBox="0 0 100 100" id="share-btn-fs">
            <circle cx="72" cy="25" r="10" fill="white"/>
            <circle cx="72" cy="75" r="10" fill="white"/>
            <circle cx="28" cy="50" r="10" fill="white"/>
            <line x1="37" y1="45" x2="63" y2="30" stroke="white" stroke-width="4"/>
            <line x1="37" y1="55" x2="63" y2="70" stroke="white" stroke-width="4"/>
          </svg>
        </div>
        <div id="mobile_pano_exit_fullscreen" style="margin-left:-14px;">
          <svg class="mobile_icon" viewBox="0 0 100 100" id="exit-fullscreen-btn">
            <polyline points="35,15 35,35 15,35" fill="none" stroke="white" stroke-width="5"/>
            <polyline points="65,15 65,35 85,35" fill="none" stroke="white" stroke-width="5"/>
            <polyline points="35,85 35,65 15,65" fill="none" stroke="white" stroke-width="5"/>
            <polyline points="65,85 65,65 85,65" fill="none" stroke="white" stroke-width="5"/>
          </svg>
        </div>
      </div>

      <div id="mobile_pano_labels">
        <a href="#">Test Panorama</a> — colored checkerboard
      </div>

      <div id="pano_share_menu_mobile">
        <span class="share-close" id="share-close">×</span>
        <span class="share-title">Share this panorama</span>
        <div class="share-row">
          <input type="text" id="pm_url_share" readonly>
          <button id="pm_url_share_btn">Copy</button>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';

  /* ============================================================
     1. Генерация тестовой панорамы — цветная шахматная карта,
        каждая грань куба своим цветом, в эквиректангулярной проекции
     ============================================================ */
  function generateTestPano() {
    const W = 2048, H = 1024;
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');
    const img = ctx.createImageData(W, H);

    // цвета граней: FRONT, BACK, RIGHT, LEFT, TOP, BOTTOM
    const faceColor = [
      [255,  87,  34],  // FRONT   оранжевый
      [ 76, 175,  80],  // BACK    зелёный
      [ 33, 150, 243],  // RIGHT   синий
      [255, 235,  59],  // LEFT    жёлтый
      [156,  39, 176],  // TOP     фиолетовый
      [  0, 188, 212]   // BOTTOM  бирюзовый
    ];

    for (let y = 0; y < H; y++) {
      const lat    = (H/2 - y) / (H/2) * (Math.PI/2);
      const cosLat = Math.cos(lat);
      const sinLat = Math.sin(lat);
      for (let x = 0; x < W; x++) {
        const lon = (x / W) * 2 * Math.PI - Math.PI;
        const dx  = cosLat * Math.sin(lon);
        const dy  = sinLat;
        const dz  = cosLat * Math.cos(lon);

        const ax = Math.abs(dx), ay = Math.abs(dy), az = Math.abs(dz);
        let face, u, v;
        if (ax >= ay && ax >= az) {
          if (dx > 0) { face = 2; u = -dz/ax; v = -dy/ax; }
          else        { face = 3; u =  dz/ax; v = -dy/ax; }
        } else if (ay >= ax && ay >= az) {
          if (dy > 0) { face = 4; u = dx/ay; v =  dz/ay; }
          else        { face = 5; u = dx/ay; v = -dz/ay; }
        } else {
          if (dz > 0) { face = 0; u =  dx/az; v = -dy/az; }
          else        { face = 1; u = -dx/az; v = -dy/az; }
        }
        u = (u + 1) / 2;
        v = (v + 1) / 2;

        const checker = (Math.floor(u * 8) + Math.floor(v * 8)) & 1;
        const c = faceColor[face];
        const k = checker ? 0.55 : 1.0;

        const i = (y * W + x) * 4;
        img.data[i]     = c[0] * k;
        img.data[i + 1] = c[1] * k;
        img.data[i + 2] = c[2] * k;
        img.data[i + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);

    // подписи на гранях
    ctx.font = 'bold 110px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 12;

    const labels = [
      { t: 'FRONT',  lon: 0,          lat: 0,            ink: 'white' },
      { t: 'BACK',   lon: Math.PI,    lat: 0,            ink: 'white' },
      { t: 'RIGHT',  lon: Math.PI/2,  lat: 0,            ink: 'white' },
      { t: 'LEFT',   lon:-Math.PI/2,  lat: 0,            ink: 'black' },
      { t: 'TOP',    lon: 0,          lat: Math.PI/3,    ink: 'white' },
      { t: 'BOTTOM', lon: 0,          lat:-Math.PI/3,    ink: 'black' }
    ];
    labels.forEach(function (L) {
      const x = ((L.lon + Math.PI) / (2 * Math.PI)) * W;
      const y = ((Math.PI/2 - L.lat) / Math.PI) * H;
      ctx.strokeStyle = 'black';
      ctx.fillStyle   = L.ink;
      ctx.strokeText(L.t, x, y);
      ctx.fillText(L.t, x, y);
      if (Math.abs(L.lon) === Math.PI) {
        ctx.strokeText(L.t, 0, y); ctx.fillText(L.t, 0, y);
        ctx.strokeText(L.t, W, y); ctx.fillText(L.t, W, y);
      }
    });

    // линия горизонта
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, H/2); ctx.lineTo(W, H/2); ctx.stroke();

    return cv;
  }

  /* ============================================================
     2. Three.js сцена — сфера с панорамой внутри
     ============================================================ */
  const canvas   = document.getElementById('pano-canvas');
  const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);

  const scene  = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1100);
  camera.rotation.order = 'YXZ';   // сначала yaw, потом pitch

  const panoTex = new THREE.CanvasTexture(generateTestPano());
  if (THREE.SRGBColorSpace) panoTex.colorSpace = THREE.SRGBColorSpace;

  const sphere = new THREE.Mesh(
    new THREE.SphereGeometry(500, 60, 40),
    new THREE.MeshBasicMaterial({ map: panoTex, side: THREE.BackSide })
  );
  // выставляем FRONT (u=0.5) так, чтобы он оказался в -Z (куда смотрит камера по умолчанию)
  sphere.rotation.y = Math.PI / 2;
  scene.add(sphere);

  /* ============================================================
     3. Управление drag / touch
     ============================================================ */
  let lon = 0, lat = 0;
  let lonStart = 0, latStart = 0;
  let isDragging = false, startX = 0, startY = 0;
  const MAX_LAT = Math.PI/2 - 0.01;

  function clampLat() {
    if (lat >  MAX_LAT) lat =  MAX_LAT;
    if (lat < -MAX_LAT) lat = -MAX_LAT;
  }

  canvas.addEventListener('touchstart', function (e) {
    if (e.touches.length === 1) {
      isDragging = true;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      lonStart = lon; latStart = lat;
    }
  }, { passive: true });

  canvas.addEventListener('touchmove', function (e) {
    if (!isDragging || e.touches.length !== 1 || gyroEnabled) return;
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;
    lon = lonStart - dx * 0.005;
    lat = latStart - dy * 0.005;
    clampLat();
  }, { passive: true });

  canvas.addEventListener('touchend', function () { isDragging = false; });

  canvas.addEventListener('mousedown', function (e) {
    isDragging = true;
    startX = e.clientX; startY = e.clientY;
    lonStart = lon; latStart = lat;
  });
  window.addEventListener('mousemove', function (e) {
    if (!isDragging || gyroEnabled) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    lon = lonStart - dx * 0.005;
    lat = latStart - dy * 0.005;
    clampLat();
  });
  window.addEventListener('mouseup', function () { isDragging = false; });

  /* ============================================================
     4. Гироскоп (DeviceOrientation), стандартный подход Three.js
     ============================================================ */
  let gyroEnabled = false;
  const devOrient = { alpha: 0, beta: 0, gamma: 0 };
  let screenOrient = window.orientation || 0;

  window.addEventListener('deviceorientation', function (e) {
    devOrient.alpha = e.alpha || 0;
    devOrient.beta  = e.beta  || 0;
    devOrient.gamma = e.gamma || 0;
  });
  window.addEventListener('orientationchange', function () {
    screenOrient = window.orientation || 0;
  });

  const zee = new THREE.Vector3(0, 0, 1);
  const _euler = new THREE.Euler();
  const q0 = new THREE.Quaternion();
  const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));
  const DEG2RAD = Math.PI / 180;

  function applyGyroToQuat(quat) {
    const a = devOrient.alpha * DEG2RAD;
    const b = devOrient.beta  * DEG2RAD;
    const g = devOrient.gamma * DEG2RAD;
    const o = screenOrient    * DEG2RAD;

    _euler.set(b, a, -g, 'YXZ');
    quat.setFromEuler(_euler);
    quat.multiply(q1);
    quat.multiply(q0.setFromAxisAngle(zee, -o));
  }

  function enableGyro() {
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().then(function (p) {
        if (p === 'granted') gyroEnabled = true;
      }).catch(function () {});
    } else {
      gyroEnabled = true;
    }
  }

  function toggleGyro() {
    if (gyroEnabled) {
      // зафиксировать текущий yaw/pitch, чтобы не дёрнулось
      const e = new THREE.Euler().setFromQuaternion(camera.quaternion, 'YXZ');
      lon = e.y; lat = e.x;
      gyroEnabled = false;
    } else {
      enableGyro();
    }
  }

  /* ============================================================
     5. VR / cardboard — side-by-side стерео
     ============================================================ */
  let vrMode = false;

  function renderStereo() {
    const w = renderer.domElement.width;
    const h = renderer.domElement.height;
    const halfW = Math.floor(w / 2);

    camera.aspect = halfW / h;
    camera.updateProjectionMatrix();

    renderer.setScissorTest(true);

    renderer.setViewport(0, 0, halfW, h);
    renderer.setScissor(0, 0, halfW, h);
    renderer.render(scene, camera);

    renderer.setViewport(halfW, 0, halfW, h);
    renderer.setScissor(halfW, 0, halfW, h);
    renderer.render(scene, camera);
  }

  function toggleVR() {
    vrMode = !vrMode;
    if (!vrMode) {
      renderer.setScissorTest(false);
      resize();
    }
  }

  /* ============================================================
     6. Размер и цикл рендера
     ============================================================ */
  function resize() {
    const container = document.getElementById('mobile_krp_div');
    const w = container.clientWidth;
    const h = container.clientHeight;
    renderer.setSize(w, h, false);
    if (!vrMode) {
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setScissorTest(false);
      renderer.setViewport(0, 0, renderer.domElement.width, renderer.domElement.height);
    }
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });

  function animate() {
    requestAnimationFrame(animate);
    if (gyroEnabled) {
      applyGyroToQuat(camera.quaternion);
    } else {
      camera.rotation.y = lon;
      camera.rotation.x = lat;
    }
    if (vrMode) renderStereo();
    else        renderer.render(scene, camera);
  }

  /* ============================================================
     7. Кнопки / Share / Fullscreen
     ============================================================ */
  const normalBtns = document.getElementById('normal_screen_pano_buttons');
  const fsBtns     = document.getElementById('fullscreen_pano_buttons');
  const shareMenu  = document.getElementById('pano_share_menu_mobile');

  document.getElementById('vr-btn').addEventListener('click', toggleVR);
  document.getElementById('vr-btn-fs').addEventListener('click', toggleVR);
  document.getElementById('gyro-btn').addEventListener('click', toggleGyro);
  document.getElementById('gyro-btn-fs').addEventListener('click', toggleGyro);

  document.getElementById('share-btn').addEventListener('click', function () {
    document.getElementById('pm_url_share').value = location.href;
    shareMenu.style.display = 'block';
  });
  document.getElementById('share-btn-fs').addEventListener('click', function () {
    document.getElementById('pm_url_share').value = location.href;
    shareMenu.style.display = 'block';
  });
  document.getElementById('share-close').addEventListener('click', function () {
    shareMenu.style.display = 'none';
  });
  document.getElementById('pm_url_share_btn').addEventListener('click', function () {
    const inp = document.getElementById('pm_url_share');
    inp.select();
    try { document.execCommand('copy'); } catch (e) {}
    const self = this;
    self.textContent = 'Copied!';
    setTimeout(function () { self.textContent = 'Copy'; }, 1500);
  });

  function enterFullscreen() {
    const el = document.getElementById('pano_container');
    if (el.requestFullscreen)          el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    normalBtns.style.display = 'none';
    fsBtns.style.display = 'flex';
    setTimeout(resize, 120);
  }
  function exitFullscreen() {
    if (document.exitFullscreen)          document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    normalBtns.style.display = 'flex';
    fsBtns.style.display = 'none';
    setTimeout(resize, 120);
  }
  document.getElementById('fullscreen-btn').addEventListener('click', enterFullscreen);
  document.getElementById('exit-fullscreen-btn').addEventListener('click', exitFullscreen);
  document.addEventListener('fullscreenchange', function () {
    if (!document.fullscreenElement) {
      normalBtns.style.display = 'flex';
      fsBtns.style.display = 'none';
      setTimeout(resize, 120);
    }
  });

  /* ============================================================
     8. Старт
     ============================================================ */
  resize();
  animate();
})();
</script>
</body>
</html>
