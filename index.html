<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>360</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: #050508;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
  }
  #pano-canvas {
    display: block;
    width: 100%; height: 100%;
    touch-action: none;
  }

  #start-screen {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    background: #050508;
    color: #5ad0ff;
    font: 600 30px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    letter-spacing: 0.08em;
    text-shadow: 0 0 20px rgba(90, 208, 255, 0.55);
    cursor: pointer;
    transition: opacity 0.45s ease;
    -webkit-user-select: none; user-select: none;
  }
  #start-screen.hidden { opacity: 0; pointer-events: none; }

  #crosshair {
    position: fixed;
    left: 50%; top: 50%;
    width: 22px; height: 22px;
    margin: -11px 0 0 -11px;
    z-index: 10;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  #crosshair.visible { opacity: 1; }
  #crosshair::before,
  #crosshair::after {
    content: '';
    position: absolute;
    background: #8fe4ff;
    box-shadow: 0 0 6px rgba(90, 208, 255, 0.9);
    border-radius: 1px;
  }
  #crosshair::before { left: 10px; top: 0; width: 2px; height: 22px; }
  #crosshair::after  { top: 10px; left: 0; width: 22px; height: 2px; }
</style>
</head>
<body>
<canvas id="pano-canvas"></canvas>
<div id="crosshair"></div>
<div id="start-screen">Tap to Start.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';

  if (typeof THREE === 'undefined') {
    console.error('[pano] Three.js не загрузился');
    return;
  }

  const DEG = Math.PI / 180;

  /* ============================================================
     Renderer / Scene / Camera
     ============================================================ */
  const canvas = document.getElementById('pano-canvas');
  const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x050508, 1);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 2000);

  /* ============================================================
     Константы
     ============================================================ */
  const DIST = 60;
  const TEX_W = 512, TEX_H = 384;
  const WIN_W = 24, WIN_H = 18;
  const WINDOW_FONT = '500 36px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif';

  const BTN_IDS = ['close', 'move', 'resize', 'text', 'flip'];
  const BTN_SIZE = 44, BTN_TOP = 12, BTN_RIGHT = 12, BTN_GAP = 4;

  function buttonRect(index) {
    const right = TEX_W - BTN_RIGHT - index * (BTN_SIZE + BTN_GAP);
    return { x: right - BTN_SIZE, y: BTN_TOP, w: BTN_SIZE, h: BTN_SIZE };
  }

  /* ============================================================
     Цветовые схемы
     ============================================================ */
  function palette(flipped) {
    return flipped ? {
      accent:      '#ff7ec1',
      accentLight: '#ffb0d8',
      accentSoft:  'rgba(255, 126, 193, 0.10)',
      border:      'rgba(255, 126, 193, 0.50)',
      text:        '#f5dce8',
      glow:        'rgba(255, 126, 193, 0.28)',
      hex:         0xff7ec1
    } : {
      accent:      '#5ad0ff',
      accentLight: '#8fe4ff',
      accentSoft:  'rgba(90, 208, 255, 0.10)',
      border:      'rgba(90, 208, 255, 0.50)',
      text:        '#c8d8e0',
      glow:        'rgba(90, 208, 255, 0.28)',
      hex:         0x5ad0ff
    };
  }

  /* ============================================================
     Отрисовка лица окна
     ============================================================ */
  function wrapText(ctx, text, maxWidth) {
    const paragraphs = String(text).split('\n');
    const lines = [];
    for (let i = 0; i < paragraphs.length; i++) {
      const p = paragraphs[i];
      if (p === '') { lines.push(''); continue; }
      const words = p.split(/\s+/);
      let line = '';
      for (let j = 0; j < words.length; j++) {
        const test = line ? line + ' ' + words[j] : words[j];
        if (ctx.measureText(test).width > maxWidth && line) {
          lines.push(line);
          line = words[j];
        } else {
          line = test;
        }
      }
      lines.push(line);
    }
    return lines;
  }

  function drawButtonIcon(ctx, r, id, flipped, p) {
    const cx = r.x + r.w / 2;
    const cy = r.y + r.h / 2;
    const rad = r.w / 2 - 2;

    ctx.beginPath();
    ctx.arc(cx, cy, rad, 0, Math.PI * 2);
    ctx.fillStyle = p.accentSoft;
    ctx.fill();

    ctx.strokeStyle = p.accentLight;
    ctx.fillStyle   = p.accentLight;
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    const isz = rad * 0.52;

    if (id === 'close') {
      ctx.beginPath();
      ctx.moveTo(cx - isz, cy - isz);
      ctx.lineTo(cx + isz, cy + isz);
      ctx.moveTo(cx + isz, cy - isz);
      ctx.lineTo(cx - isz, cy + isz);
      ctx.stroke();
    } else if (id === 'move') {
      ctx.beginPath();
      ctx.rect(cx - isz, cy - isz, isz * 2, isz * 2);
      ctx.stroke();
    } else if (id === 'resize') {
      ctx.beginPath();
      ctx.moveTo(cx, cy - isz * 1.05);
      ctx.lineTo(cx + isz * 1.05, cy + isz * 0.9);
      ctx.lineTo(cx - isz * 1.05, cy + isz * 0.9);
      ctx.closePath();
      ctx.stroke();
    } else if (id === 'text') {
      ctx.beginPath();
      ctx.arc(cx, cy, isz * 0.95, 0, Math.PI * 2);
      ctx.stroke();
    } else if (id === 'flip') {
      const spikes = 5, outer = isz * 1.15, inner = isz * 0.48;
      ctx.beginPath();
      for (let i = 0; i < spikes * 2; i++) {
        const rr = (i % 2 === 0) ? outer : inner;
        const a = -Math.PI / 2 + i * Math.PI / spikes;
        const x = cx + Math.cos(a) * rr;
        const y = cy + Math.sin(a) * rr;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath();
      if (flipped) ctx.stroke(); else ctx.fill();
    }
  }

  function drawWindowFace(ctx, W, H, text, flipped) {
    const p = palette(flipped);

    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0d0d11';
    ctx.fillRect(0, 0, W, H);

    const g = ctx.createRadialGradient(W / 2, H / 2, 20, W / 2, H / 2, Math.max(W, H) * 0.7);
    g.addColorStop(0, p.glow);
    g.addColorStop(1, 'rgba(5, 5, 8, 0.0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = p.border;
    ctx.lineWidth = 2;
    ctx.strokeRect(1, 1, W - 2, H - 2);

    if (text) {
      ctx.font = WINDOW_FONT;
      ctx.fillStyle = p.text;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const lines = wrapText(ctx, text, W - 90).slice(0, 5);
      const lh = 38;
      const startY = H / 2 + 8 - (lines.length - 1) * lh / 2;
      for (let i = 0; i < lines.length; i++) {
        ctx.fillText(lines[i], W / 2, startY + i * lh);
      }
    }

    for (let i = 0; i < BTN_IDS.length; i++) {
      drawButtonIcon(ctx, buttonRect(i), BTN_IDS[i], flipped, p);
    }
  }

  /* ============================================================
     Окна
     ============================================================ */
  const windows = [];

  function makeWindow(text) {
    const group = new THREE.Group();

    const cv = document.createElement('canvas');
    cv.width = TEX_W; cv.height = TEX_H;
    const ctx = cv.getContext('2d');
    const tex = new THREE.CanvasTexture(cv);
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;

    const face = new THREE.Mesh(
      new THREE.PlaneGeometry(WIN_W, WIN_H),
      new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide })
    );
    group.add(face);

    const win = {
      group: group,
      face: face,
      ctx: ctx,
      tex: tex,
      textFront: text || '',
      textBack: '',
      flipped: false,
      buttons: {}
    };

    for (let i = 0; i < BTN_IDS.length; i++) {
      const id = BTN_IDS[i];
      const r = buttonRect(i);
      const lx = ((r.x + r.w / 2) / TEX_W - 0.5) * WIN_W;
      const ly = (0.5 - (r.y + r.h / 2) / TEX_H) * WIN_H;
      const rad = (r.w / 2 / TEX_W) * WIN_W;

      const hit = new THREE.Mesh(
        new THREE.CircleGeometry(rad * 1.45, 16),
        new THREE.MeshBasicMaterial({ visible: false })
      );
      hit.position.set(lx, ly, 0.05);
      group.add(hit);

      const ring = new THREE.Mesh(
        new THREE.RingGeometry(rad * 1.10, rad * 1.38, 28),
        new THREE.MeshBasicMaterial({
          color: 0x5ad0ff, transparent: true, opacity: 0.95,
          side: THREE.DoubleSide, depthTest: false, depthWrite: false
        })
      );
      ring.position.set(lx, ly, 0.12);
      ring.renderOrder = 6;
      ring.visible = false;
      group.add(ring);

      const prog = new THREE.Mesh(
        new THREE.CircleGeometry(rad * 1.10, 28),
        new THREE.MeshBasicMaterial({
          color: 0x5ad0ff, transparent: true, opacity: 0.35,
          side: THREE.DoubleSide, depthTest: false, depthWrite: false
        })
      );
      prog.position.set(lx, ly, 0.10);
      prog.renderOrder = 5;
      prog.visible = false;
      prog.scale.setScalar(0.0001);
      group.add(prog);

      win.buttons[id] = {
        id: id,
        hit: hit,
        ring: ring,
        prog: prog,
        progress: 0,
        armed: true
      };
    }

    refreshWindow(win);
    return win;
  }

  function refreshWindow(win) {
    const text = win.flipped ? win.textBack : win.textFront;
    drawWindowFace(win.ctx, TEX_W, TEX_H, text, win.flipped);
    win.tex.needsUpdate = true;

    const col = palette(win.flipped).hex;
    for (const id in win.buttons) {
      win.buttons[id].ring.material.color.setHex(col);
      win.buttons[id].prog.material.color.setHex(col);
    }
  }

  function placeWindowAt(win, dir) {
    win.group.position.copy(dir).multiplyScalar(DIST);
    win.group.lookAt(0, 0, 0);
  }

  function createWindowCenter() {
    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir);
    const win = makeWindow('');
    placeWindowAt(win, dir);
    scene.add(win.group);
    windows.push(win);
  }

  function removeWindow(win) {
    scene.remove(win.group);

    win.face.geometry.dispose();
    if (win.face.material.map) win.face.material.map.dispose();
    win.face.material.dispose();
    win.tex.dispose();

    for (const id in win.buttons) {
      const b = win.buttons[id];
      b.hit.geometry.dispose();
      b.hit.material.dispose();
      b.ring.geometry.dispose();
      b.ring.material.dispose();
      b.prog.geometry.dispose();
      b.prog.material.dispose();
    }

    const i = windows.indexOf(win);
    if (i !== -1) windows.splice(i, 1);

    if (mode && mode.win === win) {
      mode = null;
      hideModeVisuals();
    }
    if (editingWin === win) cancelEdit();
  }

  /* ============================================================
     Raycaster
     ============================================================ */
  const raycaster = new THREE.Raycaster();
  const CENTER_NDC = new THREE.Vector2(0, 0);

  /* ============================================================
     Ввод текста (textarea => поддерживает перевод строки)
     ============================================================ */
  let editInput = null;
  let editingWin = null;
  let lastEditEnd = 0;

  function ensureInput() {
    if (editInput) return editInput;

    editInput = document.createElement('textarea');
    editInput.id = 'window-text-input';
    editInput.autocomplete = 'off';
    editInput.spellcheck = false;
    editInput.setAttribute('autocorrect', 'off');
    editInput.setAttribute('autocapitalize', 'sentences');
    editInput.rows = 3;

    Object.assign(editInput.style, {
      position: 'fixed',
      left: '50%',
      top: '25%',
      transform: 'translate(-50%, -50%)',
      width: '78%',
      maxWidth: '440px',
      boxSizing: 'border-box',
      padding: '14px 18px',
      fontSize: '20px',
      fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif',
      background: '#0d0d11',
      color: '#e9f8ff',
      border: '2px solid #5ad0ff',
      borderRadius: '10px',
      boxShadow: '0 0 24px rgba(90,208,255,0.55)',
      zIndex: 100,
      outline: 'none',
      display: 'none',
      caretColor: '#5ad0ff',
      resize: 'none',
      lineHeight: '1.35',
      minHeight: '80px',
      maxHeight: '42vh',
      overflowY: 'auto'
    });

    document.body.appendChild(editInput);

    editInput.addEventListener('keydown', function (e) {
      // Enter/Return — стандартное поведение textarea: перевод строки.
      // Escape — отмена (на случай внешней клавиатуры).
      if (e.key === 'Escape') { e.preventDefault(); cancelEdit(); }
    });

    editInput.addEventListener('blur', function () {
      setTimeout(function () {
        if (editingWin && document.activeElement !== editInput) commitEdit();
      }, 120);
    });

    return editInput;
  }

  /* Разогрев клавиатуры на iOS: фокусируем скрытый input
     во время пользовательского жеста «Tap to Start»,
     чтобы потом программный focus() из updateHover срабатывал. */
  let warmInput = null;
  function warmUpKeyboard() {
    if (warmInput) return;
    warmInput = document.createElement('input');
    warmInput.type = 'text';
    warmInput.setAttribute('autocomplete', 'off');
    Object.assign(warmInput.style, {
      position: 'fixed',
      left: '50%',
      top: '0',
      width: '1px',
      height: '1px',
      padding: '0',
      border: 'none',
      outline: 'none',
      opacity: '0',
      pointerEvents: 'none',
      zIndex: -1
    });
    document.body.appendChild(warmInput);
    try { warmInput.focus(); } catch (e) {}
    setTimeout(function () { try { warmInput.blur(); } catch (e) {} }, 30);
  }

  function editText(win) {
    ensureInput();
    editingWin = win;

    const p = palette(win.flipped);
    editInput.style.borderColor = p.accent;
    editInput.style.boxShadow = '0 0 24px ' + (win.flipped
      ? 'rgba(255,126,193,0.55)'
      : 'rgba(90,208,255,0.55)');
    editInput.style.caretColor = p.accent;
    editInput.style.color = win.flipped ? '#f5dce8' : '#e9f8ff';

    editInput.value = win.flipped ? win.textBack : win.textFront;
    editInput.style.display = 'block';

    const tryFocus = function () {
      try {
        editInput.focus({ preventScroll: true });
        const len = editInput.value.length;
        editInput.setSelectionRange(len, len);
      } catch (e) {}
    };
    tryFocus();
    requestAnimationFrame(tryFocus);
    setTimeout(tryFocus, 20);
    setTimeout(tryFocus, 80);
    setTimeout(tryFocus, 200);
  }

  function commitEdit() {
    if (!editingWin || !editInput) return;
    const win = editingWin;
    editingWin = null;
    lastEditEnd = performance.now();

    const value = editInput.value;
    if (win.flipped) win.textBack = value;
    else win.textFront = value;
    refreshWindow(win);

    editInput.style.display = 'none';
    try { editInput.blur(); } catch (e) {}
  }

  function cancelEdit() {
    if (!editInput) return;
    editingWin = null;
    lastEditEnd = performance.now();
    editInput.style.display = 'none';
    try { editInput.blur(); } catch (e) {}
  }

  /* ============================================================
     Ховер кнопок
     ============================================================ */
  function getButtonUnderCrosshair() {
    if (!windows.length) return null;

    const hitsList = [];
    for (let i = 0; i < windows.length; i++) {
      const w = windows[i];
      for (const id in w.buttons) hitsList.push(w.buttons[id].hit);
    }

    raycaster.setFromCamera(CENTER_NDC, camera);
    const hits = raycaster.intersectObjects(hitsList, false);
    if (!hits.length) return null;

    const obj = hits[0].object;
    for (let i = 0; i < windows.length; i++) {
      const w = windows[i];
      for (const id in w.buttons) {
        if (w.buttons[id].hit === obj) {
          return { win: w, btn: w.buttons[id], id: id };
        }
      }
    }
    return null;
  }

  function clearAllButtonVisuals() {
    for (let i = 0; i < windows.length; i++) {
      const w = windows[i];
      for (const id in w.buttons) {
        const b = w.buttons[id];
        b.progress = 0;
        b.armed = true;
        b.ring.visible = false;
        b.prog.visible = false;
        b.prog.scale.setScalar(0.0001);
      }
    }
  }

  function updateHover(dt) {
    if (mode || editingWin) {
      clearAllButtonVisuals();
      return;
    }

    const found = getButtonUnderCrosshair();

    for (let i = 0; i < windows.length; i++) {
      const w = windows[i];
      for (const id in w.buttons) {
        const b = w.buttons[id];
        const isFound = found && found.btn === b;
        if (!isFound) {
          b.progress = 0;
          b.armed = true;
          b.ring.visible = false;
          b.prog.visible = false;
          b.prog.scale.setScalar(0.0001);
        }
      }
    }

    if (!found) return;
    const b = found.btn;
    b.ring.visible = true;

    if (b.armed) {
      b.progress += dt;
      if (b.progress >= 1) {
        b.progress = 0;
        b.armed = false;
        fireButton(found.win, b.id);
      }
    }

    if (b.progress > 0.001) {
      b.prog.visible = true;
      b.prog.scale.setScalar(Math.max(0.0001, b.progress));
    } else {
      b.prog.visible = false;
    }
  }

  /* ============================================================
     Действия
     ============================================================ */
  function fireButton(win, id) {
    if (id === 'close') {
      removeWindow(win);
    } else if (id === 'move') {
      startMode('move', win);
    } else if (id === 'resize') {
      startMode('resize', win);
    } else if (id === 'text') {
      editText(win);
    } else if (id === 'flip') {
      win.flipped = !win.flipped;
      refreshWindow(win);
    }
  }

  /* ============================================================
     Режимы move / resize
     Кружок теперь размером с кнопку окна.
     ============================================================ */
  let mode = null;
  const MODE_TOL = 1.6 * DEG;      // ~ размер кнопки окна
  const MODE_DURATION = 1.0;

  const modeRing = new THREE.Mesh(
    new THREE.RingGeometry(0.93, 1.0, 64),
    new THREE.MeshBasicMaterial({
      color: 0x5ad0ff, transparent: true, opacity: 0.95,
      side: THREE.DoubleSide, depthTest: false, depthWrite: false
    })
  );
  modeRing.renderOrder = 40;
  modeRing.visible = false;
  scene.add(modeRing);

  const modeFill = new THREE.Mesh(
    new THREE.CircleGeometry(1, 64),
    new THREE.MeshBasicMaterial({
      color: 0x5ad0ff, transparent: true, opacity: 0.22,
      side: THREE.DoubleSide, depthTest: false, depthWrite: false
    })
  );
  modeFill.renderOrder = 39;
  modeFill.visible = false;
  scene.add(modeFill);

  function hideModeVisuals() {
    modeRing.visible = false;
    modeFill.visible = false;
  }

  function startMode(type, win) {
    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir);

    clearAllButtonVisuals();

    mode = {
      type: type,
      win: win,
      plant: dir.clone(),
      progress: 0,
      scaleT: 0,
      baseScale: win.group.scale.x || 1
    };

    if (type === 'move') placeWindowAt(win, dir);

    const col = palette(win.flipped).hex;
    modeRing.material.color.setHex(col);
    modeFill.material.color.setHex(col);

    updateModeVisuals();
  }

  function updateModeVisuals() {
    if (!mode) { hideModeVisuals(); return; }

    const dist = DIST * 0.9;
    const pos = mode.plant.clone().multiplyScalar(dist);
    const R = dist * Math.tan(MODE_TOL);

    modeRing.position.copy(pos);
    modeRing.lookAt(0, 0, 0);
    modeRing.scale.setScalar(R);
    modeRing.visible = true;

    const pr = Math.max(0, Math.min(1, mode.progress / MODE_DURATION));
    modeFill.position.copy(mode.plant).multiplyScalar(dist - 0.5);
    modeFill.lookAt(0, 0, 0);
    modeFill.scale.setScalar(Math.max(0.0001, R * pr));
    modeFill.visible = pr > 0.001;
  }

  function updateMode(dt) {
    if (!mode) return;

    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir);

    const ang = Math.acos(Math.max(-1, Math.min(1, mode.plant.dot(dir))));
    const moving = ang > MODE_TOL;

    if (moving) {
      mode.plant.copy(dir);
      mode.progress = 0;
    } else {
      mode.progress += dt;
    }

    if (mode.type === 'move') {
      placeWindowAt(mode.win, dir);
    } else if (mode.type === 'resize') {
      if (moving) {
        mode.scaleT += dt;
        const s = mode.baseScale + Math.sin(mode.scaleT * 4) * 0.7;
        mode.win.group.scale.setScalar(Math.max(0.4, Math.min(2.5, s)));
      }
    }

    updateModeVisuals();

    if (mode.progress >= MODE_DURATION) {
      mode = null;
      hideModeVisuals();
    }
  }

  /* ============================================================
     Гироскоп
     ============================================================ */
  let gyroOn = false;
  let gyroFailed = false;
  let requestInFlight = false;
  let gotOrientation = false;

  const dev = { alpha: 0, beta: 0, gamma: 0 };
  let screenOrient = window.orientation || 0;

  window.addEventListener('deviceorientation', function (e) {
    if (e.alpha == null && e.beta == null && e.gamma == null) return;
    gotOrientation = true;
    dev.alpha = e.alpha || 0;
    dev.beta  = e.beta  || 0;
    dev.gamma = e.gamma || 0;
  });

  window.addEventListener('orientationchange', function () {
    screenOrient = window.orientation || 0;
  });

  function tryEnableGyro() {
    if (gyroOn || requestInFlight || gyroFailed) return;
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      requestInFlight = true;
      DeviceOrientationEvent.requestPermission()
        .then(function (p) {
          requestInFlight = false;
          if (p === 'granted') gyroOn = true;
          else gyroFailed = true;
        })
        .catch(function () {
          requestInFlight = false;
          gyroFailed = true;
        });
    } else {
      gyroOn = true;
    }
  }

  document.addEventListener('touchstart', tryEnableGyro, { passive: true });
  document.addEventListener('click', tryEnableGyro);

  const zee    = new THREE.Vector3(0, 0, 1);
  const _euler = new THREE.Euler();
  const q0     = new THREE.Quaternion();
  const q1     = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));

  function applyGyro() {
    const a = dev.alpha * DEG;
    const b = dev.beta  * DEG;
    const g = dev.gamma * DEG;
    const o = screenOrient * DEG;

    _euler.set(b, a, -g, 'YXZ');
    camera.quaternion.setFromEuler(_euler);
    camera.quaternion.multiply(q1);
    camera.quaternion.multiply(q0.setFromAxisAngle(zee, -o));
  }

  /* ============================================================
     Fallback: мышь/палец
     ============================================================ */
  let lookMode = false;
  let lookYaw = 0, lookPitch = 0;
  const _lookEuler = new THREE.Euler(0, 0, 0, 'YXZ');

  function applyLook() {
    _lookEuler.set(lookPitch, lookYaw, 0, 'YXZ');
    camera.quaternion.setFromEuler(_lookEuler);
  }

  /* ============================================================
     Resize
     ============================================================ */
  function resize() {
    let w = canvas.clientWidth  || window.innerWidth;
    let h = canvas.clientHeight || window.innerHeight;
    if (w < 10) w = window.innerWidth;
    if (h < 10) h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () {
    setTimeout(resize, 250);
  });

  /* ============================================================
     Ввод
     ============================================================ */
  const startScreen = document.getElementById('start-screen');
  const crosshair = document.getElementById('crosshair');

  let started = false;
  let consumeNextTap = false;

  function begin() {
    if (started) return;
    started = true;
    startScreen.classList.add('hidden');
    crosshair.classList.add('visible');

    // разогрев клавиатуры на iOS в контексте жеста
    warmUpKeyboard();

    tryEnableGyro();

    setTimeout(function () {
      if (!gotOrientation && !gyroOn) {
        gyroOn = false;
        gyroFailed = true;
        lookMode = true;
      }
    }, 2500);
  }
  startScreen.addEventListener('pointerdown', begin);

  let pointerInfo = null;

  canvas.addEventListener('pointerdown', function (e) {
    if (!started) return;

    if (editingWin) {
      commitEdit();
      consumeNextTap = true;
      return;
    }

    pointerInfo = {
      id: e.pointerId,
      lastX: e.clientX,
      lastY: e.clientY,
      moved: 0,
      t: performance.now()
    };
    if (lookMode && canvas.setPointerCapture) {
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    }
  });

  canvas.addEventListener('pointermove', function (e) {
    if (!pointerInfo || e.pointerId !== pointerInfo.id) return;

    const dx = e.clientX - pointerInfo.lastX;
    const dy = e.clientY - pointerInfo.lastY;
    pointerInfo.lastX = e.clientX;
    pointerInfo.lastY = e.clientY;
    pointerInfo.moved += Math.abs(dx) + Math.abs(dy);

    if (lookMode && !mode && !editingWin) {
      lookYaw   -= dx * 0.0045;
      lookPitch -= dy * 0.0045;
      lookPitch = Math.max(-1.25, Math.min(1.25, lookPitch));
    }
  });

  canvas.addEventListener('pointerup', function (e) {
    if (consumeNextTap) {
      consumeNextTap = false;
      pointerInfo = null;
      return;
    }
    if (!pointerInfo || e.pointerId !== pointerInfo.id) {
      pointerInfo = null;
      return;
    }
    const info = pointerInfo;
    pointerInfo = null;

    if (!started) return;
    if (performance.now() - lastEditEnd < 300) return;
    if (info.moved < 12 && performance.now() - info.t < 700) {
      if (!mode && !editingWin) createWindowCenter();
    }
  });

  canvas.addEventListener('pointercancel', function () {
    pointerInfo = null;
  });

  /* ============================================================
     Рендер
     ============================================================ */
  let lastTime = performance.now();

  function render(now) {
    requestAnimationFrame(render);

    const t = (typeof now === 'number') ? now : performance.now();
    const dt = Math.min(0.05, Math.max(0, (t - lastTime) / 1000));
    lastTime = t;

    if (gyroOn) applyGyro();
    else if (lookMode) applyLook();

    if (started) {
      updateHover(dt);
      updateMode(dt);
    }

    renderer.render(scene, camera);
  }

  /* ============================================================
     Старт
     ============================================================ */
  resize();
  setTimeout(resize, 50);
  setTimeout(resize, 200);
  setTimeout(resize, 800);

  requestAnimationFrame(render);
})();
</script>
</body>
</html>
